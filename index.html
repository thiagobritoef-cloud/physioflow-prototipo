const DIAS_SEMANA = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DIAS_SEMANA_JS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"]; // índice = Date.getDay()
function getWeekdayLabel(dataIso){
  const d = new Date(dataIso + "T00:00:00");
  return DIAS_SEMANA_JS[d.getDay()];
}
function horasEntre(inicio, fim){
  if (!inicio || !fim) return 0;
  const [h1,m1] = inicio.split(":").map(Number);
  const [h2,m2] = fim.split(":").map(Number);
  return Math.max(0, (h2 + m2/60) - (h1 + m1/60));
}
function getInicioSemana(dataIso){ // segunda-feira da semana que contém dataIso
  const d = new Date(dataIso + "T00:00:00");
  const dia = d.getDay(); // 0=Dom..6=Sáb
  d.setDate(d.getDate() + (dia===0 ? -6 : 1-dia));
  return d.toISOString().slice(0,10);
}
function getFimSemana(dataIso){
  const d = new Date(getInicioSemana(dataIso) + "T00:00:00");
  d.setDate(d.getDate()+6);
  return d.toISOString().slice(0,10);
}

  if (prof.comissaoTipo === "salario") return `${fmtBRL(prof.salarioFixoMensal||0)} salário${prof.bonusMensal ? ` + ${fmtBRL(prof.bonusMensal)} bônus` : ""}/mês`;
  if (prof.comissaoTipo === "fixo") return `${fmtBRL(prof.comissaoValorSessao||0)}/sessão`;
  return `${prof.comissaoPercentual??0}% sobre faturamento`;
}
function fmtDataBR(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }

// ---- Ponto eletrônico / banco de horas / fechamento mensal ----
const TOLERANCIA_HORA_EXTRA_MIN = 10; // minutos de tolerância antes de considerar hora extra
function minutosEntre(isoInicio, isoFim){ return (new Date(isoFim) - new Date(isoInicio)) / 60000; }
function calcularJornadaEsperadaMin(prof){
  if (!prof || !prof.horaInicio || !prof.horaFim) return 0;
  const [hi,mi] = prof.horaInicio.split(":").map(Number);
  const [hf,mf] = prof.horaFim.split(":").map(Number);
  return Math.max(0, (hf*60+mf) - (hi*60+mi));
}
// Junta as marcações do dia em pares entrada→saída e soma os minutos efetivamente trabalhados.
function minutosTrabalhadosNoDia(profissionalId, dataDia, pontoRegistros){
  const doDia = pontoRegistros.filter(r=>r.profissionalId===profissionalId && r.timestamp.slice(0,10)===dataDia).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  let total = 0;
  for (let i=0; i<doDia.length-1; i+=2) {
    if (doDia[i].tipo==="entrada" && doDia[i+1]?.tipo==="saida") total += minutosEntre(doDia[i].timestamp, doDia[i+1].timestamp);
  }
  return total;
}
function diasComPontoNoMes(profissionalId, mes, ano, pontoRegistros){
  const dias = new Set();
  pontoRegistros.filter(r=>r.profissionalId===profissionalId).forEach(r=>{
    const [y,m] = r.timestamp.slice(0,7).split("-").map(Number);
    if (y===ano && m===mes) dias.add(r.timestamp.slice(0,10));
  });
  return Array.from(dias).sort();
}
// Saldo do banco de horas: déficits (trabalhou menos que o esperado) entram sozinhos; excedentes só entram
// depois que o gestor liberar com a própria senha (RN pedida pelo usuário) — senão ficam de fora do saldo.
function calcularSaldoBancoHoras(profissionalId, professionals, pontoRegistros, horasExtras){
  const prof = professionals.find(p=>p.id===profissionalId);
  if (!prof) return 0;
  const jornadaMin = calcularJornadaEsperadaMin(prof);
  const dias = new Set(pontoRegistros.filter(r=>r.profissionalId===profissionalId).map(r=>r.timestamp.slice(0,10)));
  let saldoMin = 0;
  dias.forEach(dia => {
    const trabalhadoMin = minutosTrabalhadosNoDia(profissionalId, dia, pontoRegistros);
    if (trabalhadoMin <= 0) return;
    const delta = trabalhadoMin - jornadaMin;
    if (delta <= 0) { saldoMin += delta; return; }
    const extra = horasExtras.find(h=>h.profissionalId===profissionalId && h.data===dia);
    if (extra && extra.status==="aprovada") saldoMin += delta;
  });
  return saldoMin;
}
function formatarSaldoHoras(minutos){
  const sinal = minutos < 0 ? "-" : "";
  const abs = Math.round(Math.abs(minutos));
  const h = Math.floor(abs/60), m = abs%60;
  return `${sinal}${h}h${String(m).padStart(2,"0")}`;
}
// Fechamento mensal: dias com ponto batido, horas totais, saldo do banco de horas e o valor de
// pagamento + vale-transporte + vale-alimentação a pagar no mês seguinte, por profissional.
function gerarFechamentoMensal(professionals, pontoRegistros, horasExtras, vendas, mes, ano){
  const refMes = `${ano}-${String(mes).padStart(2,"0")}`;
  return professionals.map(prof => {
    const dias = diasComPontoNoMes(prof.id, mes, ano, pontoRegistros);
    const minutosTotais = dias.reduce((s,d)=>s+minutosTrabalhadosNoDia(prof.id, d, pontoRegistros), 0);
    const saldoBancoHoras = calcularSaldoBancoHoras(prof.id, professionals, pontoRegistros, horasExtras);
    const diasTrabalhados = dias.length;
    const valorVT = diasTrabalhados * (prof.valorValeTransporteDia||0);
    const valorVA = diasTrabalhados * (prof.valorValeAlimentacaoDia||0);
    const valorSalario = prof.comissaoTipo === "salario" ? (prof.salarioFixoMensal||0) + (prof.bonusMensal||0) : 0;
    const valorComissaoVendas = (vendas||[]).filter(v => v.vendedorId===prof.id && v.data.slice(0,7)===refMes).reduce((s,v)=>s+(v.comissaoValor||0), 0);
    return { profissional: prof, diasTrabalhados, minutosTotais, saldoBancoHoras, valorVT, valorVA, valorSalario, valorComissaoVendas, valorTotal: valorSalario + valorVT + valorVA + valorComissaoVendas };
  });
}

// Persistência local (mantém os dados entre recarregamentos da página, neste navegador/computador)
const STORAGE_PREFIX = "physioflow_v1_";
function loadPersisted(key, fallback){
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function savePersisted(key, value){
  try { window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch (e) {}
}
function clearPersisted(){
  try {
    Object.keys(window.localStorage).filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>window.localStorage.removeItem(k));
  } catch (e) {}
}

/* ---------------- Sinalização do agendamento (pagamento, última sessão, evolução) ---------------- */
// Avaliação não exige pagamento vinculado (é o primeiro contato do cliente).
function pagamentoOk(appt, cliente){
  if (!cliente) return true;
  if ((appt.tipo||"sessao") === "avaliacao") return true;
  if (cliente.pagamento.tipo === "bolsa") return true;
  if (cliente.pagamento.tipo === "convenio") return !!appt.guiaId;
  // Regra pedida explicitamente pelo usuário: o valor (particular ou de guia) precisa estar vinculado ao
  // agendamento. Para particular, isso substitui a antiga confirmação por checkbox (`pagamentoVinculado`,
  // mantido só como fallback de compatibilidade para agendamentos antigos já salvos sem o campo `valor`).
  return (Number(appt.valor)||0) > 0 || !!appt.pagamentoVinculado;
}

// Nº da sessão auto-computado (P0-3, RN-3.2.4): conta quantos atendimentos já concluídos ("atendido")
// existem antes deste, para o mesmo cliente + mesmo "balde". O balde é a guia (convênio), ou a compra de
// pacote vinculada (`vendaId` — RN pedida explicitamente pelo usuário: selecionar no agendamento qual
// compra/pacote particular está sendo consumido), ou, na ausência de qualquer um dos dois, um balde único
// "sem vínculo" (comportamento antigo, mantido para agendamentos particulares avulsos ou já existentes
// antes dessa regra) — assim, um cliente com duas compras de pacote em datas diferentes tem contadores de
// sessão independentes por compra, em vez de tudo cair no mesmo contador.
function baldeDoAgendamento(appt){
  return appt.guiaId || appt.vendaId || "";
}
function getSessaoAtual(appt, appointments){
  const mesmoBalde = a => a.clienteId===appt.clienteId && (a.tipo||"sessao")!=="avaliacao" && baldeDoAgendamento(appt) === baldeDoAgendamento(a);
  const atendidasAntes = appointments.filter(a =>
    a.id!==appt.id && mesmoBalde(a) && a.status==="atendido" &&
    (a.data < appt.data || (a.data===appt.data && a.hora < appt.hora))
  ).length;
  return atendidasAntes + 1;
}

function isUltimaSessao(appt, cliente, guias, appointments, vendas, produtos){
  if (!cliente || (appt.tipo||"sessao") === "avaliacao") return false;
  let total = cliente.sessoesTotal;
  if (cliente.pagamento.tipo === "convenio" && appt.guiaId) {
    const guia = guias.find(g=>g.id===appt.guiaId);
    if (guia) total = guia.quantidadeAutorizada;
  } else if (appt.vendaId) {
    const venda = (vendas||[]).find(v=>v.id===appt.vendaId);
    const produto = venda ? (produtos||[]).find(p=>p.id===venda.produtoId) : null;
    if (produto?.sessoesIncluidas) total = produto.sessoesIncluidas;
  }
  const sessaoAtual = appointments ? getSessaoAtual(appt, appointments) : appt.sessaoAtual;
  return sessaoAtual >= total;
}

// Evolução pós-sessão (RN pedida explicitamente pelo usuário): toda sessão "atendida" precisa ter uma
// evolução registrada depois (texto do profissional sobre como foi a sessão), gravada diretamente no
// agendamento (`appt.evolucaoTexto`) — não é mais "qualquer ficha preenchida no mesmo dia" (definição antiga,
// frouxa: uma ficha de avaliação de outro atendimento no mesmo dia contava como se fosse a evolução desta
// sessão). Cada sessão tem sua própria evolução, vinculada 1:1 pelo id do agendamento.
function evolucaoPendente(appt){
  if (appt.status !== "atendido") return false;
  if (appt.data >= TODAY) return false;
  return !((appt.evolucaoTexto||"").trim());
}
function isEvolucaoAtrasada(appt){
  return evolucaoPendente(appt);
}

// Notificação push real (RN pedida explicitamente pelo usuário: "criar uma notificação push que será
// enviada ao profissional sobre a realização da evolução"). Usa a Web Notification API do navegador — é
// a única forma de push "de verdade" possível num protótipo sem backend/service worker dedicado: aparece
// como um toast do sistema operacional enquanto o navegador estiver aberto, mesmo com o PhysioFlow em
// segundo plano. Continua funcionando lado a lado com o registro simulado no canal "Push" da aba
// Notificações (esse já existia e serve de trilha de auditoria dentro do app).
function statusPermissaoPush(){
  if (typeof Notification === "undefined") return "unsupported";
  return Notification.permission; // "granted" | "denied" | "default"
}
function solicitarPermissaoPush(){
  if (typeof Notification === "undefined") return Promise.resolve("unsupported");
  if (Notification.permission !== "default") return Promise.resolve(Notification.permission);
  return Notification.requestPermission();
}
function dispararNotificacaoPushNavegador(titulo, corpo, tag){
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try {
    const n = new Notification(titulo, { body: corpo, tag: tag || "physioflow-evolucao" });
    n.onclick = () => { try { window.focus(); } catch(e){} };
  } catch(e) {
    // Alguns contextos (ex.: iframe sem permissão, navegador sem suporte real) lançam mesmo com
    // permission==="granted" — falha silenciosa, o registro no log interno cobre esse caso.
  }
}

  laranja:  { dot:"bg-orange-500", label:"Evolução em atraso" },
  guia:     { dot:"bg-pink-500",   label:"Guia com saldo baixo ou vencendo" },
};

function getSinalizacao(appt, cliente, guias, fichas, appointments, vendas, produtos){
  if ((appt.tipo||"sessao") === "avaliacao") return "verde";
  if (!pagamentoOk(appt, cliente)) return "vermelha";
  const guiaVinculada = appt.guiaId ? (guias||[]).find(g=>g.id===appt.guiaId) : null;
  if (guiaVinculada && guiaAlertaSaldoOuValidade(guiaVinculada)) return "guia";
  if (isUltimaSessao(appt, cliente, guias, appointments, vendas, produtos)) return "amarela";
  if (isEvolucaoAtrasada(appt)) return "laranja";
  return null;
}

/* ---------------- P0-2: Bloqueio de saldo/validade de guia (RN-5.1) ---------------- */
// Bloqueia (com possibilidade de exceção consciente/registrada) marcar uma sessão de convênio como
// atendida quando a guia não tem saldo de sessões ou já venceu. Nunca "clampa" silenciosamente o saldo.
function avaliarBloqueioGuia(guia){
  if (!guia) return null;
  if (guia.quantidadeUtilizada >= guia.quantidadeAutorizada) {
    return { motivo:`Guia ${guia.numeroGuia} sem sessões disponíveis (${guia.quantidadeUtilizada}/${guia.quantidadeAutorizada} já utilizadas).` };
  }
  if (guia.validade && guia.validade < TODAY) {
    return { motivo:`Guia ${guia.numeroGuia} vencida em ${fmtDataBR(guia.validade)}.` };
  }
  return null;
}

// Alerta (não bloqueante) exibido no card da Agenda quando a guia está perto do limite.
function guiaAlertaSaldoOuValidade(guia){
  if (!guia) return null;
  const restantes = guia.quantidadeAutorizada - guia.quantidadeUtilizada;
  const dias = diasParaVencer(guia.validade);
  if (restantes <= 3) return `Restam ${Math.max(restantes,0)} sessão(ões) na guia`;
  if (dias <= 7) return `Guia vence em ${dias < 0 ? "—" : dias===0 ? "hoje" : dias+"d"}`;
  return null;
}

/* ---------------- P0-3: Detecção de conflitos de agenda (RN-3.1) ---------------- */
function horariosSobrepoem(hora1, dur1, hora2, dur2){
  const toMin = h => { const [hh,mm]=(h||"00:00").split(":").map(Number); return hh*60+mm; };
  const ini1=toMin(hora1), fim1=ini1+(dur1||50);
  const ini2=toMin(hora2), fim2=ini2+(dur2||50);
  return ini1 < fim2 && ini2 < fim1;
}

function apptFimHora(appt){
  const [h,m] = appt.hora.split(":").map(Number);
  const total = h*60+m+(appt.duracaoMin||50);
  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
}

// Retorna a lista de conflitos encontrados para o agendamento `appt` frente aos demais `appointments`.
// tipo:"expediente" é aviso (soft-block, exige confirmação consciente); os demais são bloqueio duro.
function detectarConflitos(appt, appointments, professionals, clients, permitirForaExpediente){
  const conflitos = [];
  const outros = (appointments||[]).filter(a => a.id!==appt.id && a.data===appt.data && a.status!=="remarcado" && a.status!=="desmarcado");
  const nomeCliente = id => clients.find(c=>c.id===id)?.nome || "cliente";
  const nomeProf = id => professionals.find(p=>p.id===id)?.nome || "profissional";

  outros.filter(a=>a.profissionalId===appt.profissionalId).forEach(a => {
    if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
      conflitos.push({ tipo:"profissional", msg:`${nomeProf(appt.profissionalId)} já tem um atendimento às ${a.hora} com ${nomeCliente(a.clienteId)}.`, apptConflitante:a });
    }
  });

  outros.filter(a=>a.clienteId===appt.clienteId).forEach(a => {
    if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
      conflitos.push({ tipo:"cliente", msg:`${nomeCliente(appt.clienteId)} já tem outro atendimento agendado às ${a.hora} com ${nomeProf(a.profissionalId)}.`, apptConflitante:a });
    }
  });

  const prof = professionals.find(p=>p.id===appt.profissionalId);
  if (prof?.sala) {
    outros.filter(a=>{
      const p2 = professionals.find(pp=>pp.id===a.profissionalId);
      return p2?.sala === prof.sala && a.profissionalId !== appt.profissionalId;
    }).forEach(a => {
      if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
        conflitos.push({ tipo:"sala", msg:`Sala "${prof.sala}" já está ocupada às ${a.hora} por ${nomeProf(a.profissionalId)}.`, apptConflitante:a });
      }
    });
  }

  if (prof && !permitirForaExpediente) {
    const diaSemana = getWeekdayLabel(appt.data);
    const dentroDoDia = (prof.dias||[]).includes(diaSemana);
    const dentroDoHorario = appt.hora >= prof.horaInicio && apptFimHora(appt) <= prof.horaFim;
    if (!dentroDoDia || !dentroDoHorario) {
      conflitos.push({ tipo:"expediente", msg:`Horário fora do expediente cadastrado de ${prof.nome} (${(prof.dias||[]).join(", ")}, ${prof.horaInicio}–${prof.horaFim}).` });
    }
  }

  return conflitos;
}

// Sugere até 3 horários livres mais próximos para o mesmo profissional/dia, dentro do expediente cadastrado.
function sugerirHorariosLivres(profissionalId, data, appointments, professionals, duracaoMin){
  const prof = professionals.find(p=>p.id===profissionalId);
  if (!prof || !prof.horaInicio || !prof.horaFim) return [];
  const ocupados = (appointments||[]).filter(a=>a.profissionalId===profissionalId && a.data===data && a.status!=="remarcado" && a.status!=="desmarcado");
  const sugestoes = [];
  const [hIni,mIni] = prof.horaInicio.split(":").map(Number);
  const [hFim,mFim] = prof.horaFim.split(":").map(Number);
  let cursor = hIni*60+mIni;
  const fimExpediente = hFim*60+mFim;
  let guarda = 0;
  while (cursor + (duracaoMin||50) <= fimExpediente && sugestoes.length < 3 && guarda < 200) {
    guarda++;
    const horaStr = String(Math.floor(cursor/60)).padStart(2,"0")+":"+String(cursor%60).padStart(2,"0");
    const livre = !ocupados.some(a => horariosSobrepoem(horaStr, duracaoMin, a.hora, a.duracaoMin));
    if (livre) sugestoes.push(horaStr);
    cursor += 15;
  }
  return sugestoes;
}

const inputCls = "w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500";
const dateSegCls = "border border-slate-300 rounded-lg py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-teal-500";

// Campo de data com avanço automático (RN pedida explicitamente pelo usuário): ao completar os 2 dígitos
// do dia, o foco pula sozinho para o mês; ao completar os 2 dígitos do mês, pula para o ano. Substitui os
// <input type="date"> nativos do sistema, mas mantém o mesmo formato de valor (string ISO "AAAA-MM-DD"),
// então nenhum outro código precisou mudar — só a forma como a data é digitada.
function DateInput({value, onChange, className}) {
  const [y, m, d] = (value || "").split("-");
  const [dia, setDia] = useState(d || "");
  const [mes, setMes] = useState(m || "");
  const [ano, setAno] = useState(y || "");
  const diaRef = useRef(null);
  const mesRef = useRef(null);
  const anoRef = useRef(null);

  // Sincroniza os campos quando o valor vem de fora (ex.: limpar formulário, trocar de registro).
  useEffect(() => {
    const [yy, mm, dd] = (value || "").split("-");
    setDia(dd || ""); setMes(mm || ""); setAno(yy || "");
  }, [value]);

  function emitir(novoDia, novoMes, novoAno){
    // Só dispara onChange quando a data fica completa (3 segmentos) ou totalmente vazia (usuário limpou
    // tudo). Em estados intermediários (ex.: dia e mês preenchidos, ano ainda pela metade) NÃO dispara —
    // isso evita um loop de sincronização: como o `value` é controlado pelo componente pai, se disparássemos
    // onChange("") a cada tecla intermediária, o pai devolveria value="" e o useEffect acima limparia os
    // campos já digitados (dia/mês) no meio da digitação do ano.
    if (novoDia.length===2 && novoMes.length===2 && novoAno.length===4) onChange(`${novoAno}-${novoMes}-${novoDia}`);
    else if (!novoDia && !novoMes && !novoAno) onChange("");
  }
  function handleDia(e){
    const v = e.target.value.replace(/\D/g,"").slice(0,2);
    setDia(v); emitir(v, mes, ano);
    if (v.length===2) mesRef.current?.focus();
  }
  function handleMes(e){
    const v = e.target.value.replace(/\D/g,"").slice(0,2);
    setMes(v); emitir(dia, v, ano);
    if (v.length===2) anoRef.current?.focus();
  }
  function handleAno(e){
    const v = e.target.value.replace(/\D/g,"").slice(0,4);
    setAno(v); emitir(dia, mes, v);
  }
  function voltarSeVazio(ref){ return e => { if (e.key==="Backspace" && e.target.value==="") ref.current?.focus(); }; }

  return (
    <div className={"flex items-center gap-1 " + (className||"")}>
      <input ref={diaRef} type="text" inputMode="numeric" placeholder="DD" maxLength={2} value={dia}
        onChange={handleDia} className={dateSegCls + " w-11 px-1"} />
      <span className="text-slate-400">/</span>
      <input ref={mesRef} type="text" inputMode="numeric" placeholder="MM" maxLength={2} value={mes}
        onChange={handleMes} onKeyDown={voltarSeVazio(diaRef)} className={dateSegCls + " w-11 px-1"} />
      <span className="text-slate-400">/</span>
      <input ref={anoRef} type="text" inputMode="numeric" placeholder="AAAA" maxLength={4} value={ano}
        onChange={handleAno} onKeyDown={voltarSeVazio(mesRef)} className={dateSegCls + " w-16 px-1"} />
    </div>
  );
}

// Campo de valor monetário com suporte a vírgula decimal (RN pedida explicitamente pelo usuário: "ao digitar
// os valores ter a opção de inserir casa decimal"). O <input type="number"> nativo só aceita ponto como
// separador decimal — em teclado numérico de celular/computador configurado em pt-BR, a tecla de decimal
// digita vírgula, que o navegador rejeita silenciosamente (parece que "não dá pra digitar decimal"). Substitui
// esses campos por um <input type="text"> que aceita vírgula (ou ponto) e sempre emite um número JS por
// onChange — nenhum outro código muda, só a forma como o valor é digitado.
function MoneyInput({value, onChange, className, placeholder, allowEmpty}) {
  const formatar = v => (v===null || v===undefined || v==="") ? "" : String(v).replace(".", ",");
  const [texto, setTexto] = useState(() => formatar(value));
  // Guarda o último valor que O PRÓPRIO componente emitiu via onChange. Se o `value` que chega de fora for
  // igual a esse último valor emitido, é só o eco do nosso próprio onChange (o pai re-renderizou com o que
  // acabamos de mandar) — não mexe no texto. Só resincroniza quando `value` muda por outro motivo (troca de
  // cliente/registro, limpar formulário) — evita o mesmo tipo de loop de sincronização já corrigido no DateInput.
  const ultimoEmitido = useRef(value);

  useEffect(() => {
    if (value === ultimoEmitido.current) return;
    ultimoEmitido.current = value;
    setTexto(formatar(value));
  }, [value]);

  function handleChange(e){
    let v = e.target.value.replace(/[^\d,]/g, "");
    const partes = v.split(",");
    if (partes.length > 2) v = partes[0] + "," + partes.slice(1).join(""); // só permite uma vírgula
    setTexto(v);
    let emitido;
    if (v === "" || v === ",") {
      emitido = allowEmpty ? "" : 0;
    } else {
      const n = Number(v.replace(",", "."));
      emitido = isNaN(n) ? (allowEmpty ? "" : 0) : n;
    }
    ultimoEmitido.current = emitido;
    onChange(emitido);
  }

  return <input type="text" inputMode="decimal" className={className} value={texto} onChange={handleChange} placeholder={placeholder||"0,00"} />;
}

  function handleStatusChange(appt, novoStatus, opts={}){
    if (novoStatus === "remarcado") { handleRemarcar(appt); return; }

    const eraAtendido = appt.status === "atendido";
    const seraAtendido = novoStatus === "atendido";

    // P0-2 (RN-5.1): bloqueia marcar como Atendido sessão de convênio cuja guia está sem saldo/vencida,

    const updated = {...appt, status: novoStatus};
    addOrUpdateAppointment(updated);
    const cliente = clients.find(c=>c.id===appt.clienteId);
    const prof = professionals.find(p=>p.id===appt.profissionalId);
    if (notifyEnabled && cliente && prof) {

      if (novoStatus === "chegou") {

        // recebe uma mensagem"). Cobre tanto a confirmação via biometria (LeitorBiometricoModal →

        // Registra no canal "Push" (trilha de auditoria, visível a qualquer um na aba Notificações) e também
        // dispara a notificação real do navegador (Web Notification API) — mesma ressalva já documentada
        // para a evolução pendente: sem um backend/service worker, o push real só aparece no navegador que
        // estiver com o PhysioFlow aberto no momento da leitura biométrica (normalmente o leitor da recepção),

        const corpoPush = `Seu paciente ${cliente.nome} chegou (sessão às ${appt.hora}).`;

      if (novoStatus === "atendido") pushLog("Interno", `Atendimento concluído: ${cliente.nome} com ${prof.nome} (${appt.hora}).`);
      if (novoStatus === "desmarcado") pushLog("WhatsApp", `${cliente.nome} desmarcou a sessão de ${appt.hora} com ${prof.nome}.`);
      if (novoStatus === "faltou") pushLog("Interno", `Falta registrada: ${cliente.nome} não compareceu (${appt.hora}, ${prof.nome}).`);
    }

    // Baixa automática de sessão na guia de convênio vinculada — só na entrada em "atendido"
    if (appt.guiaId && seraAtendido && !eraAtendido) {
      consumeSessionFromGuia(appt.guiaId);
    }
    // Estorno automático — se o status regride e a sessão já estava atendida (correção de lançamento)
    if (appt.guiaId && !seraAtendido && eraAtendido) {
      estornarSessaoGuia(appt.guiaId);
    }
  }

  // ---- Ponto eletrônico (biometria simulada) ----
  // Detecta sozinho se a marcação é de entrada ou saída olhando a última marcação do profissional no dia
  // (mesma lógica de qualquer relógio de ponto: alterna entrada/saída a cada leitura).
  function registrarPonto(profissionalId, dataHoraISO){
    const dataDia = dataHoraISO.slice(0,10);
    const doDia = pontoRegistros.filter(r => r.profissionalId===profissionalId && r.timestamp.slice(0,10)===dataDia).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
    const ultimo = doDia[doDia.length-1];
    const tipo = (!ultimo || ultimo.tipo==="saida") ? "entrada" : "saida";
    const novo = { id:"pt"+Date.now()+Math.random().toString(36).slice(2,6), profissionalId, tipo, timestamp:dataHoraISO };
    setPontoRegistros(list => [...list, novo]);
    const prof = professionals.find(p=>p.id===profissionalId);
    pushLog("Interno", `Ponto eletrônico: ${prof?.nome||"Profissional"} registrou ${tipo==="entrada"?"entrada":"saída"} às ${dataHoraISO.slice(11,16)} (digital simulada).`);
    // Ao fechar o par entrada→saída do dia, confere se ultrapassou o horário cadastrado (RN pedida pelo
    // usuário: hora extra só entra no banco de horas depois que o gestor liberar com a própria senha).
    if (tipo === "saida" && ultimo && prof) {
      const jornadaMin = calcularJornadaEsperadaMin(prof);
      const trabalhadoMin = minutosEntre(ultimo.timestamp, dataHoraISO);
      const excedenteMin = trabalhadoMin - jornadaMin;
      if (excedenteMin > TOLERANCIA_HORA_EXTRA_MIN) {
        const jaExiste = horasExtras.some(h => h.profissionalId===profissionalId && h.data===dataDia);
        if (!jaExiste) {
          setHorasExtras(list => [...list, { id:"he"+Date.now()+Math.random().toString(36).slice(2,6), profissionalId, data:dataDia, minutos:Math.round(excedenteMin), status:"pendente", aprovadoPor:null, aprovadoEm:null }]);
          pushLog("Interno", `Hora extra detectada: ${prof.nome} trabalhou ${Math.round(excedenteMin)} min a mais em ${fmtDataBR(dataDia)} — aguardando liberação do gestor.`);
        }
      }
    }
    return novo;
  }

  // Aprovação de hora extra exige a senha do próprio gestor logado (reautentica no Supabase Auth como
  // dupla confirmação — só quem tem a senha da conta admin consegue liberar).
  async function aprovarHoraExtra(horaExtra, senhaGestor){
    if (!sbClient || !currentUser?.email) return { ok:false, erro:"Sessão inválida." };
    const { error } = await sbClient.auth.signInWithPassword({ email: currentUser.email, password: senhaGestor });
    if (error) return { ok:false, erro:"Senha do gestor incorreta." };
    setHorasExtras(list => list.map(h => h.id===horaExtra.id ? {...h, status:"aprovada", aprovadoPor:currentUser.nome||currentUser.email, aprovadoEm:new Date().toISOString()} : h));
    const prof = professionals.find(p=>p.id===horaExtra.profissionalId);
    pushLog("Interno", `Hora extra de ${prof?.nome||"Profissional"} (${fmtDataBR(horaExtra.data)}, ${horaExtra.minutos} min) liberada por ${currentUser.nome||currentUser.email}.`);
    return { ok:true };
  }

  function recusarHoraExtra(horaExtra){
    setHorasExtras(list => list.map(h => h.id===horaExtra.id ? {...h, status:"recusada", aprovadoPor:currentUser?.nome||currentUser?.email, aprovadoEm:new Date().toISOString()} : h));
  }

  // Confirmação de chegada do paciente reaproveita o mesmo mecanismo de biometria simulada do ponto.
  function confirmarChegadaPaciente(appt){
    handleStatusChange(appt, "chegou");
  }

  // Remarcação (RN-3.2.6): não sobrescreve o agendamento original — cria um novo, vinculado via remarcadoDeId,
  // e move o original para o status "remarcado" (histórico preservado).
  function handleRemarcar(appt){
    const novaData = window.prompt("Nova data para remarcar (AAAA-MM-DD):", appt.data);
    if (!novaData) return;
    const novaHora = window.prompt("Novo horário (HH:MM):", appt.hora);
    if (!novaHora) return;
    if (appt.status === "atendido" && appt.guiaId) estornarSessaoGuia(appt.guiaId);
    const novoId = "a" + Date.now();
    const { id, ...resto } = appt;
    const novoAppt = { ...resto, id: novoId, data: novaData, hora: novaHora, status: "agendado", remarcadoDeId: appt.id };
    addOrUpdateAppointment(novoAppt);
    setAppointments(list => list.map(a => a.id===appt.id ? {...a, status:"remarcado"} : a));
    const cliente = clients.find(c=>c.id===appt.clienteId);
    pushLog("Interno", `Sessão de ${cliente?.nome||"cliente"} remarcada: ${fmtDataBR(appt.data)} ${appt.hora} → ${fmtDataBR(novaData)} ${novaHora}.`);
  }

  function handleMoveProfessional(apptId, novoProfId){
    setAppointments(list => list.map(a => a.id===apptId ? {...a, profissionalId: novoProfId} : a));
  }

  /* ---- Guias de convênio ---- */
  // P0-2 (RN-5.1): não "clampa" mais silenciosamente o saldo — se ultrapassar o autorizado (via exceção consciente),
  // o excesso fica registrado explicitamente no log em vez de ser descartado sem rastro.
  function consumeSessionFromGuia(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const novaQtd = guia.quantidadeUtilizada + 1;
    const excedeu = novaQtd > guia.quantidadeAutorizada;
    setGuias(list => list.map(g => g.id===guiaId ? {...g, quantidadeUtilizada: novaQtd} : g));
    pushLog(excedeu ? "Override" : "Interno", excedeu
      ? `⚠ Sessão descontada da guia ${guia.numeroGuia} ACIMA do saldo autorizado (${novaQtd}/${guia.quantidadeAutorizada}) — exceção registrada.`
      : `Sessão descontada da guia ${guia.numeroGuia} (${guia.convenio}) — ${novaQtd}/${guia.quantidadeAutorizada}.`);
  }

  function estornarSessaoGuia(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const novaQtd = Math.max(0, guia.quantidadeUtilizada - 1);
    setGuias(list => list.map(g => g.id===guiaId ? {...g, quantidadeUtilizada: novaQtd} : g));
    pushLog("Interno", `Estorno: sessão devolvida à guia ${guia.numeroGuia} (${guia.convenio}) — ${novaQtd}/${guia.quantidadeAutorizada}.`);
  }

  function saveGuia(form){
    const guiaAnterior = guias.find(g=>g.id===form.id);
    setGuias(list => {
      const exists = list.some(g=>g.id===form.id);
      return exists ? list.map(g=>g.id===form.id?form:g) : [...list, {...form, id:"g"+Date.now()}];
    });
    // Transição para "paga" (RN pedida explicitamente pelo usuário): dispara o lançamento no caixa na
    // data de pagamento informada no formulário. Só dispara na transição (evita duplicar lançamento se o
    // usuário só editar outro campo de uma guia que já estava paga).
    if (form.status === "paga" && guiaAnterior?.status !== "paga") {
      registrarRecebimentoGuia(form);
    }
    setModal(null);
  }

  function enviarGuiaParaFaturamento(guiaId){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status:"em_faturamento", dataEnvio: g.dataEnvio || TODAY} : g));
    const guia = guias.find(g=>g.id===guiaId);
    if (guia) pushLog("Interno", `Guia ${guia.numeroGuia} incluída em lote de faturamento TISS.`);
  }

  function marcarGuiaPaga(guiaId){
    const guiaAnterior = guias.find(g=>g.id===guiaId);
    if (!guiaAnterior) return;
    const dataPag = guiaAnterior.dataPagamento || TODAY;
    const guiaAtualizada = {...guiaAnterior, status:"paga", valorGlosa:0, motivoGlosa:"", dataPagamento: dataPag};
    setGuias(list => list.map(g => g.id===guiaId ? guiaAtualizada : g));
    // RN pedida explicitamente pelo usuário: guia paga entra no Fluxo de Caixa na data do pagamento.
    // Só dispara na transição (evita duplicar lançamento se a guia já estava paga).
    if (guiaAnterior.status !== "paga") registrarRecebimentoGuia(guiaAtualizada);
  }

  function registrarGlosa(guiaId, tipo, valor, motivo){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status: tipo, valorGlosa: valor, motivoGlosa: motivo} : g));
    const guia = guias.find(g=>g.id===guiaId);
    if (guia) pushLog("Interno", `Glosa registrada na guia ${guia.numeroGuia}: ${motivo} (${fmtBRL(valor)}).`);
    setModal(null);
  }

  function reabrirGuia(guiaId){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status:"aberta", valorGlosa:0, motivoGlosa:""} : g));
  }

  function solicitarAutorizacaoEletronica(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const protocolo = "PROT-" + Math.floor(100000 + Math.random()*899999);
    setGuias(list => list.map(g => g.id===guiaId ? {...g, protocoloEletronico: protocolo} : g));
    pushLog("Sistema", `Autorização solicitada eletronicamente no portal ${guia.convenio} (guia ${guia.numeroGuia}) — protocolo ${protocolo}.`);
  }

  function vincularCodigoBarras(guiaId, codigo){
    const conflito = guias.find(g=>g.codigoBarras===codigo && g.id!==guiaId);
    if (conflito) return { ok:false, msg:`Este código já está vinculado à guia ${conflito.numeroGuia}.` };
    setGuias(list => list.map(g => g.id===guiaId ? {...g, codigoBarras: codigo} : g));
    const guia = guias.find(g=>g.id===guiaId);
    pushLog("Interno", `Código de barras ${codigo} vinculado à guia ${guia?.numeroGuia}.`);
    return { ok:true };
  }

  function registrarEnvioPorCodigo(codigo){
    const guia = guias.find(g=>g.codigoBarras===codigo);
    if (!guia) {
      pushLog("Sistema", `Leitura de código de barras "${codigo}" não corresponde a nenhuma guia vinculada.`);
      return { ok:false, guia:null };
    }
    if (guia.status !== "aberta") {
      return { ok:false, guia, jaEnviada:true };
    }
    setGuias(list => list.map(g => g.id===guia.id ? {...g, status:"em_faturamento", dataEnvio: g.dataEnvio || TODAY} : g));
    pushLog("Interno", `Envio registrado via leitura de código de barras: guia ${guia.numeroGuia} (${guia.convenio}).`);
    return { ok:true, guia };
  }

  /* ---- Fluxo de caixa ---- */
  // Cria OU edita um lançamento manual de caixa. Quando `form.id` já existe (veio de um clique em
  // "Editar" na tabela de lançamentos), atualiza o registro existente em vez de criar um novo — RN
  // pedida explicitamente pelo usuário: permitir editar entradas e saídas do Fluxo de Caixa.
  function addLancamento(form){
    if (fechamentos[form.data]) { alert("O caixa deste dia já está fechado. Reabra o caixa para lançar novos itens."); return; }
    // `_overrideDesconto` é um campo transiente vindo do VenderProdutoModal (venda avulsa na Agenda) —
    // só serve para registrar a autorização de desconto fora da faixa no log; não é salvo no lançamento.
    const { _overrideDesconto, ...lancamento } = form;
    if (_overrideDesconto) {
      pushLog("Override", `Desconto de ${_overrideDesconto.desconto}% em "${_overrideDesconto.produtoNome}" está fora da faixa permitida (${_overrideDesconto.min}%–${_overrideDesconto.max}%) — autorizado pelo gestor na venda avulsa (Agenda).`);
    }
    if (lancamento.id) {
      setLancamentos(list => list.map(l => l.id===lancamento.id ? {...lancamento} : l));
      pushLog("Interno", `Lançamento de caixa editado: ${TIPO_LANCAMENTO[lancamento.tipo]?.label || lancamento.tipo} de ${fmtBRL(lancamento.valor)} em ${fmtDataBR(lancamento.data)} — "${lancamento.descricao}".`);
    } else {
      setLancamentos(list => [...list, {...lancamento, id:"l"+Date.now()}]);
    }
    setModal(null);
  }

  // Venda avulsa pelo card da Agenda (RN pedida explicitamente pelo usuário: toda venda — produto,
  // serviço ou programa — deve ser lançada tanto no Fluxo de Caixa quanto na aba Vendas, com comissão).
  // Antes esse caminho só criava o lançamento de caixa via addLancamento; agora passa pelo mesmo helper
  // `registrarVenda` usado pelo vínculo de produto no cadastro do cliente, já com os campos que a tela
  // de venda avulsa coleta (unidade, forma de pagamento, origem, desconto e parcelas).
  function venderProdutoAvulso(form){
    const { _overrideDesconto, produtoId, produtoNome, clienteId, clienteNome, quantidade, descontoAplicado, parcelas, formaPagamento, origemPagamento, unidadeId, data, valor } = form;
    if (_overrideDesconto) {
      pushLog("Override", `Desconto de ${_overrideDesconto.desconto}% em "${_overrideDesconto.produtoNome}" está fora da faixa permitida (${_overrideDesconto.min}%–${_overrideDesconto.max}%) — autorizado pelo gestor na venda avulsa (Agenda).`);
    }
    const venda = registrarVenda({
      clienteId, clienteNome, produto: { id: produtoId, nome: produtoNome },
      quantidade, valorFinal: valor, descontoAplicado, formaPagamento, origemPagamento, parcelas, unidadeId, data,
    }, { bloquearSeFechado: true });
    if (venda) setModal(null);
  }

  function fecharCaixa(data, valorFisicoContado, valorSistema){
    const diferenca = valorFisicoContado - valorSistema;
    setFechamentos(f => ({...f, [data]: { valorFisico: valorFisicoContado, valorSistema, diferenca, ts: "agora" }}));
    pushLog("Interno", `Caixa de ${fmtDataBR(data)} fechado. Sistema: ${fmtBRL(valorSistema)} · Contado: ${fmtBRL(valorFisicoContado)} · Diferença: ${fmtBRL(diferenca)}.`);
  }

  function reabrirCaixa(data){
    if (!window.confirm(`Reabrir o caixa de ${fmtDataBR(data)}? Esta ação deve ser feita apenas por um administrador.`)) return;
    setFechamentos(f => { const n = {...f}; delete n[data]; return n; });
    pushLog("Interno", `Caixa de ${fmtDataBR(data)} reaberto manualmente (ação administrativa).`);
  }

  // Vendas + Caixa unificados (RN pedida explicitamente pelo usuário: "ao realizar uma venda, seja de
  // produtos ou de serviços ou programas, deve ser lançado diretamente no fluxo de caixa e na aba
  // vendas"). Função central usada pelos três caminhos que podem gerar uma venda: produto vinculado ao
  // cadastro do cliente (saveClient), sugestão automática de produto na Agenda (vincularProdutoAoCliente)
  // e venda avulsa pelo card da Agenda (venderProdutoAvulso). Antes só o primeiro caminho gerava venda
  // (aba Vendas/comissão) e só o terceiro gerava lançamento de caixa — ficavam desencontrados.
  function registrarVenda(params, opts={}){
    const { clienteId, clienteNome, produto, quantidade=1, valorFinal, descontoAplicado=0, formaPagamento, origemPagamento, parcelas, unidadeId, data } = params;
    const dataVenda = data || TODAY;
    if (opts.bloquearSeFechado && fechamentos[dataVenda]) {
      alert("O caixa deste dia já está fechado. Reabra o caixa para lançar novos itens.");
      return null;
    }
    const vendedorProf = professionals.find(p => p.nome === currentUser?.nome);
    const percentual = vendedorProf?.comissaoVendaPercentual || 0;
    const comissaoValor = Math.round(valorFinal * percentual) / 100;
    const formaFinal = formaPagamento || "dinheiro";
    const parcelasFinal = formaFinal === "cartao_credito" ? (Number(parcelas)||1) : 1;
    const venda = {
      id: "v"+Date.now(), data: dataVenda,
      clienteId, clienteNome,
      produtoId: produto.id, produtoNome: produto.nome,
      valorFinal, descontoAplicado: Number(descontoAplicado)||0,
      formaPagamento: formaFinal, parcelas: parcelasFinal,
      vendedorId: vendedorProf?.id || null,
      vendedorNome: vendedorProf?.nome || currentUser?.nome || "—",
      comissaoPercentualAplicada: percentual,
      comissaoValor,
    };
    setVendas(list => [...list, venda]);
    const caixaFechado = !!fechamentos[dataVenda];
    if (!caixaFechado) {
      const unidadeFinal = unidadeId || unidadePadraoParaProfissional(vendedorProf?.id);
      setLancamentos(list => [...list, {
        id: "l"+Date.now(), data: dataVenda, unidadeId: unidadeFinal, tipo: "receita",
        formaPagamento: formaFinal, origemPagamento: origemPagamento || "particular",
        valor: valorFinal,
        descricao: `Venda: ${produto.nome}${quantidade>1?` (${quantidade}x)`:""} — ${clienteNome}`,
        // Nome do paciente/cliente que pagou (pedido explicitamente pelo usuário: mostrar quem pagou,
        // seja particular ou convênio, tanto no Fluxo de Caixa quanto nas Vendas).
        clienteId: clienteId || null, clienteNome: clienteNome || null,
      }]);
      pushLog("Interno", `Venda registrada: "${produto.nome}" para ${clienteNome} por ${venda.vendedorNome} (${fmtBRL(valorFinal)}${percentual>0 ? `, comissão ${fmtBRL(comissaoValor)}` : ""}) — lançada no Fluxo de Caixa (${FORMAS_PAGAMENTO[formaFinal]||formaFinal}).`);
    } else {
      pushLog("Interno", `Venda registrada: "${produto.nome}" para ${clienteNome} por ${venda.vendedorNome} (${fmtBRL(valorFinal)}${percentual>0 ? `, comissão ${fmtBRL(comissaoValor)}` : ""}). Caixa de ${fmtDataBR(dataVenda)} já está fechado — lance manualmente no Fluxo de Caixa após reabrir.`);
    }
    return venda;
  }

  // Guias de convênio pagas entram no Fluxo de Caixa (RN pedida explicitamente pelo usuário), lançadas na
  // DATA DO PAGAMENTO (não na data de hoje) — assim o caixa reflete corretamente quando o dinheiro entrou,
  // mesmo que o registro do pagamento no sistema seja feito depois. Valor = valorGuiaPendente (preço do
  // procedimento TUSS pelo convênio × sessões autorizadas, menos glosa), mesmo cálculo já usado no
  // Dashboard/GuiasResumo para "valor recebido".
  function registrarRecebimentoGuia(guia){
    const dataRecebimento = guia.dataPagamento || TODAY;
    const valor = valorGuiaPendente(guia, procedimentosTuss, convenios);
    const cliente = clients.find(c=>c.id===guia.clienteId);
    if (valor <= 0) {
      pushLog("Interno", `Guia ${guia.numeroGuia} (${guia.convenio}) marcada como paga, mas sem valor líquido a receber (glosa total) — nada lançado no Fluxo de Caixa.`);
      return;
    }
    if (fechamentos[dataRecebimento]) {
      pushLog("Interno", `Guia ${guia.numeroGuia} (${guia.convenio}) paga (${fmtBRL(valor)}), mas o caixa de ${fmtDataBR(dataRecebimento)} já está fechado — lance manualmente no Fluxo de Caixa após reabrir.`);
      return;
    }
    // Observação de competência x caixa (pedido explicitamente pelo usuário: "trazendo a observação do mês
    // de produção e tempo de pagamento"). Mês de produção = mesma referência já usada no Dashboard P0-4
    // (Competência × Caixa): data de envio/faturamento da guia, ou data de autorização se não tiver envio.
    // Tempo de pagamento = dias corridos entre essa referência e a data efetiva do pagamento.
    const referenciaProducao = guia.dataEnvio || guia.dataAutorizacao || null;
    const mesProducao = referenciaProducao ? `${referenciaProducao.slice(5,7)}/${referenciaProducao.slice(0,4)}` : null;
    const prazoPagamentoDias = referenciaProducao
      ? Math.max(0, Math.round((new Date(dataRecebimento+"T00:00:00") - new Date(referenciaProducao+"T00:00:00"))/86400000))
      : null;
    const obsProducaoPrazo = mesProducao
      ? ` — produção ${mesProducao}${prazoPagamentoDias!==null ? `, pago em ${prazoPagamentoDias} dia${prazoPagamentoDias===1?"":"s"}` : ""}`
      : "";
    setLancamentos(list => [...list, {
      id: "l"+Date.now(), data: dataRecebimento, unidadeId: guia.unidadePrestadoraId || unidades[0]?.id || "",
      tipo: "receita", formaPagamento: "transferencia", origemPagamento: "convenio",
      valor, descricao: `Recebimento guia ${guia.numeroGuia} — ${guia.convenio}${cliente ? ` (${cliente.nome})` : ""}`,
      // Campos estruturados de competência x caixa (mês de produção da guia + prazo de pagamento em dias),
      // exibidos como observação abaixo da descrição na tabela do Fluxo de Caixa (ver CaixaPanel).
      mesProducao, prazoPagamentoDias,
      // Nome do paciente vinculado à guia (pedido explicitamente pelo usuário: mostrar quem pagou,
      // seja particular ou convênio, tanto no Fluxo de Caixa quanto nas Vendas).
      clienteId: guia.clienteId || null, clienteNome: cliente?.nome || null,
    }]);
    pushLog("Interno", `Guia ${guia.numeroGuia} (${guia.convenio}) paga — ${fmtBRL(valor)} lançado no Fluxo de Caixa em ${fmtDataBR(dataRecebimento)}${obsProducaoPrazo}.`);
  }

  /* ---- Fichas de avaliação ---- */
  function saveModeloFicha(form){
    setModelosFicha(list => {
      const exists = list.some(m=>m.id===form.id);
      return exists ? list.map(m=>m.id===form.id?form:m) : [...list, {...form, id:"m"+Date.now()}];
    });
    setModal(null);
  }

  function saveFicha(form){
    const isNew = !form.id;
    const ficha = isNew ? {...form, id:"f"+Date.now()} : form;
    setFichas(list => isNew ? [...list, ficha] : list.map(f=>f.id===ficha.id?ficha:f));
    const cliente = clients.find(c=>c.id===ficha.clienteId);
    if (isNew && ficha.modo === "remoto" && notifyEnabled && cliente) {
      pushLog("WhatsApp", `Link de preenchimento remoto enviado para ${cliente.nome}: ficha "${modelosFicha.find(m=>m.id===ficha.modeloId)?.nome}".`);
    }
    if (isNew && ficha.modo === "presencial" && notifyEnabled && cliente) {
      pushLog("Interno", `Relatório de avaliação gerado automaticamente no prontuário de ${cliente.nome}.`);
    }
    setModal(null);
  }

  function assinarFicha(fichaId){
    const protocolo = "ASSIN-" + Math.floor(100000 + Math.random()*899999);
    const agora = "agora";
    setFichas(list => list.map(f => f.id===fichaId ? {...f, status:"assinada", aceiteLGPD:true, assinadoEm:agora, protocoloAssinatura:protocolo} : f));
    const ficha = fichas.find(f=>f.id===fichaId);
    const cliente = clients.find(c=>c.id===ficha?.clienteId);
    pushLog("Sistema", `Ficha assinada eletronicamente por ${cliente?.nome} (termo de consentimento LGPD aceito) — protocolo ${protocolo}.`);
  }

  function exportarPdfFicha(ficha){
    const cliente = clients.find(c=>c.id===ficha.clienteId);
    const prof = professionals.find(p=>p.id===ficha.profissionalId);
    const modelo = modelosFicha.find(m=>m.id===ficha.modeloId);
    const linhas = (modelo?.perguntas||[]).map(p => {
      const v = ficha.respostas[p.id];
      const texto = p.tipo==="sim_nao" ? (v==="sim"?"Sim":v==="nao"?"Não":"—") : (v ?? "—");
      return `<tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;width:40%;">${p.texto}</td><td style="padding:6px 8px;border:1px solid #ddd;">${texto}</td></tr>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ficha - ${cliente?.nome}</title></head>
      <body style="font-family:Arial,sans-serif;padding:32px;color:#1e293b;">
      <h2 style="margin-bottom:0;">${modelo?.nome || "Ficha de Avaliação"}</h2>
      <p style="color:#64748b;margin-top:4px;">PhysioFlow — prontuário eletrônico</p>
      <table style="border-collapse:collapse;width:100%;margin-top:12px;font-size:14px;">
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;width:40%;">Cliente</td><td style="padding:6px 8px;border:1px solid #ddd;">${cliente?.nome||""}</td></tr>
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Data</td><td style="padding:6px 8px;border:1px solid #ddd;">${fmtDataBR(ficha.data)}</td></tr>
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Profissional</td><td style="padding:6px 8px;border:1px solid #ddd;">${prof?.nome||""} (${prof?.conselho||""})</td></tr>
        ${linhas}
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Assinatura eletrônica</td><td style="padding:6px 8px;border:1px solid #ddd;">${ficha.status==="assinada" ? `Assinada em ${ficha.assinadoEm} — protocolo ${ficha.protocoloAssinatura} — termo LGPD aceito` : "Não assinada"}</td></tr>
      </table>
      <p style="color:#94a3b8;font-size:11px;margin-top:24px;">Documento gerado eletronicamente para compor o prontuário do paciente.</p>
      <script>window.onload = () => window.print();<\/script>
      </body></html>`;
    const win = window.open("", "_blank");
    if (win) { win.document.write(html); win.document.close(); }
    pushLog("Interno", `PDF da ficha de ${cliente?.nome} (${fmtDataBR(ficha.data)}) exportado para o prontuário.`);
  }

  function createAppointment(form){
    const { repetirFixo, semanasRepetir, permitirForaExpediente, confirmarExcecaoGuia, ...base } = form;
    const id = "a" + Date.now();
    const appt = {...base, id};
    addOrUpdateAppointment(appt);
    const cliente = clients.find(c=>c.id===form.clienteId);
    const prof = professionals.find(p=>p.id===form.profissionalId);
    if (notifyEnabled && cliente && prof) {
      pushLog("WhatsApp", `Confirmação automática enviada para ${cliente.nome}: sessão em ${fmtDataBR(form.data)} às ${form.hora} com ${prof.nome}.`);
    }
    if (confirmarExcecaoGuia && form.guiaId) {
      const guia = guias.find(g=>g.id===form.guiaId);
      pushLog("Override", `Sessão agendada mesmo com a guia ${guia?.numeroGuia||form.guiaId} bloqueada (saldo/validade) — exceção autorizada manualmente.`);
    }
    if (permitirForaExpediente) {
      pushLog("Override", `Sessão de ${cliente?.nome||"cliente"} agendada fora do expediente cadastrado de ${prof?.nome||""} — exceção autorizada manualmente.`);
    }

    if (repetirFixo) {
      const semanas = Number(semanasRepetir) || 8;
      const geradas = [];
      for (let i = 1; i <= semanas; i++) {
        const dataGerada = addDays(base.data, 7 * i);
        const geradaId = "a" + (Date.now() + i);
        geradas.push({
          ...base,
          id: geradaId,
          data: dataGerada,
          status: "agendado",
        });
      }
      geradas.forEach(g => addOrUpdateAppointment(g));

      if (cliente) {
        const diaSemanaFixo = getWeekdayLabel(base.data);
        const novoHorarioFixo = { id:"hf"+Date.now(), ativo:true, profissionalId: base.profissionalId, diaSemana: diaSemanaFixo, hora: base.hora, dataTermino: null };
        setClients(list => list.map(c => {
          if (c.id !== cliente.id) return c;
          const existentes = c.horariosFixos || [];
          // evita duplicar o mesmo profissional/dia/hora — atualiza em vez de duplicar
          const jaExiste = existentes.some(h => h.profissionalId===novoHorarioFixo.profissionalId && h.diaSemana===novoHorarioFixo.diaSemana && h.hora===novoHorarioFixo.hora);
          const atualizados = jaExiste
            ? existentes.map(h => (h.profissionalId===novoHorarioFixo.profissionalId && h.diaSemana===novoHorarioFixo.diaSemana && h.hora===novoHorarioFixo.hora) ? {...h, ativo:true} : h)
            : [...existentes, novoHorarioFixo];
          return { ...c, horariosFixos: atualizados };
        }));
      }
      pushLog("Interno", `Horário fixo criado para ${cliente?.nome || "cliente"}: ${semanas} sessões geradas automaticamente (${prof?.nome || ""}, ${base.hora}).`);
    }

    setModal(null);
  }

  // Sugestão de produto por especialidade (NOVO): vincula um produto ao cliente sem fechar a
  // modal de agendamento — usado quando o profissional escolhido tem uma especialidade com produto
  // cadastrado no Catálogo e o cliente ainda não tem esse produto vinculado (o usuário pode ignorar).
  function vincularProdutoAoCliente(clienteId, produto){
    const cliente = clients.find(c=>c.id===clienteId);
    setClients(list => list.map(c => c.id===clienteId ? {
      ...c,
      produtoId: produto.id,
      pacoteNome: produto.nome,
      sessoesTotal: produto.sessoesIncluidas || c.sessoesTotal,
      valorSessao: produto.sessoesIncluidas>0 ? Math.round((produto.precoBase/produto.sessoesIncluidas)*100)/100 : produto.precoBase,
      descontoAplicado: 0, parcelas: 1, formaPagamentoProduto: "dinheiro",
    } : c));
    // RN pedida explicitamente pelo usuário: essa vinculação também é uma venda — antes só o vínculo
    // feito dentro do ClientModal contava. Sem tela própria de preço/forma de pagamento aqui (é um
    // atalho de um clique), assume preço cheio do produto (sem desconto), à vista em dinheiro.
    if (cliente) {
      registrarVenda({
        clienteId, clienteNome: cliente.nome, produto, valorFinal: produto.precoBase, descontoAplicado: 0,
        formaPagamento: "dinheiro", parcelas: 1,
        origemPagamento: cliente.pagamento?.tipo==="convenio" ? "convenio" : "particular",
      });
    }
  }

  // Vendas (RN pedida pelo usuário): toda vez que um produto/pacote é vinculado ao cadastro do
  // cliente (aqui no ClientModal — NÃO no "Vender produto" da Agenda), isso conta como uma venda
  // atribuída ao login do atendente que está logado no sistema no momento do cadastro. A comissão
  // aplicada é a que está travada no cadastro do colaborador (comissaoVendaPercentual) na hora da venda.
  function saveClient(form){
    const clienteId = form.id || ("c"+Date.now());
    const clienteFinal = {...form, id: clienteId};
    const clienteAnterior = clients.find(c=>c.id===clienteId);
    const produtoMudou = !!clienteFinal.produtoId && clienteFinal.produtoId !== (clienteAnterior?.produtoId || null);
    setClients(list => {
      const exists = list.some(c=>c.id===clienteId);
      return exists ? list.map(c=>c.id===clienteId?clienteFinal:c) : [...list, clienteFinal];
    });
    // Desconto mín./máx. (RN pedida pelo usuário): a UI (ClientModal) já bloqueia o Salvar até o gestor
    // autorizar por senha um desconto fora da faixa cadastrada no produto — aqui só registramos a
    // ocorrência no log de auditoria (canal "Override"), sem re-clampar o valor (a autorização já validou).
    const produtoVinculado = clienteFinal.produtoId ? produtos.find(p=>p.id===clienteFinal.produtoId) : null;
    if (produtoVinculado) {
      const descAplicado = Number(clienteFinal.descontoAplicado)||0;
      const min = produtoVinculado.descontoMinimoPercent||0, max = produtoVinculado.descontoMaximoPercent||0;
      if (descAplicado > max || descAplicado < min) {
        pushLog("Override", `Desconto de ${descAplicado}% em "${produtoVinculado.nome}" para ${clienteFinal.nome} está fora da faixa permitida (${min}%–${max}%) — autorizado pelo gestor no cadastro do cliente.`);
      }
    }
    if (produtoMudou) {
      const produto = produtoVinculado;
      if (produto) {
        const valorFinal = Math.round(produto.precoBase * (1 - (Number(clienteFinal.descontoAplicado)||0)/100) * 100) / 100;
        // Regra pedida explicitamente pelo usuário: parcelas só existem/aparecem quando a forma de
        // pagamento é cartão de crédito — outras formas ficam sempre à vista (1x). A criação da venda E
        // do lançamento correspondente no Fluxo de Caixa agora passa pelo helper único `registrarVenda`
        // (ver definição perto das funções de Caixa) — antes só era criada a venda, sem lançar no caixa.
        registrarVenda({
          clienteId, clienteNome: clienteFinal.nome, produto, valorFinal,
          descontoAplicado: clienteFinal.descontoAplicado,
          formaPagamento: clienteFinal.formaPagamentoProduto || "cartao_credito",
          origemPagamento: clienteFinal.pagamento?.tipo==="convenio" ? "convenio" : "particular",
          parcelas: clienteFinal.parcelas,
        });
      }
    }
    setModal(null);
  }

  function importarClientesLote(registros){
    setClients(list => {
      const atualizado = [...list];
      registros.forEach((r, i) => {
        const idx = r.cpf ? atualizado.findIndex(c => c.cpf && c.cpf === r.cpf) : -1;
        const base = idx >= 0 ? atualizado[idx] : {
          id: "c" + Date.now() + i, nome:"", telefone:"", email:"", endereco:"", dataNascimento:"", cpf:"",
          numeroCarteirinha:"", convenio:"", pagamento:{tipo:"particular", numeroGuia:""}, medico:"", telefoneEmergencia:"",
          tratamento:"", pacoteNome:"", sessoesTotal:0, dataInicio:TODAY, profissionaisIds:[], valorSessao:0,
          alta:null, horariosFixos:[], produtoId:null, descontoAplicado:0, parcelas:1,
          origemCadastro:"manual", documentosAnexados:[],
        };
        const registroAtualizado = {
          ...base,
          nome: r.nome || base.nome,
          cpf: r.cpf || base.cpf,
          convenio: r.convenio || base.convenio,
          email: r.email || base.email,
          telefone: r.telefone || base.telefone,
          // se veio convênio preenchido e o cliente ainda estava marcado como particular, assume pagamento por convênio
          pagamento: (r.convenio && base.pagamento?.tipo === "particular") ? {...base.pagamento, tipo:"convenio"} : base.pagamento,
        };
        if (idx >= 0) atualizado[idx] = registroAtualizado; else atualizado.push(registroAtualizado);
      });
      return atualizado;
    });
    pushLog("Interno", `Importação em lote de pacientes: ${registros.length} registro(s) processado(s).`);
  }

  function registrarAlta(clienteId, profissionalId, data, motivo){
    setClients(list => list.map(c => c.id===clienteId ? {...c, alta:{data, profissionalId, motivo}} : c));
    const cliente = clients.find(c=>c.id===clienteId);
    const prof = professionals.find(p=>p.id===profissionalId);
    pushLog("Interno", `Alta registrada para ${cliente?.nome} por ${prof?.nome} em ${fmtDataBR(data)}.`);
  }

  function reverterAlta(clienteId){
    if (!window.confirm("Reverter a alta deste cliente?")) return;
    setClients(list => list.map(c => c.id===clienteId ? {...c, alta:null} : c));
  }

  function saveProfessional(form){
    setProfessionals(list => {
      const exists = list.some(p=>p.id===form.id);
      return exists ? list.map(p=>p.id===form.id?form:p) : [...list, {...form, id:"p"+Date.now()}];
    });
    setModal(null);
  }

  function saveConvenio(form){
    setConvenios(list => {
      const exists = list.some(c=>c.id===form.id);
      return exists ? list.map(c=>c.id===form.id?form:c) : [...list, {...form, id:"cv"+Date.now()}];
    });
    setModal(null);
  }

  function saveProduto(form){
    setProdutos(list => {
      const exists = list.some(p=>p.id===form.id);
      return exists ? list.map(p=>p.id===form.id?form:p) : [...list, {...form, id:"pr"+Date.now()}];
    });
    setModal(null);
  }

  function saveUnidade(form){
    setUnidades(list => {
      const exists = list.some(u=>u.id===form.id);
      return exists ? list.map(u=>u.id===form.id?form:u) : [...list, {...form, id:"u"+Date.now()}];
    });
    setModal(null);
  }

  function saveProcedimentoTuss(form){
    setProcedimentosTuss(list => {
      const exists = list.some(p=>p.id===form.id);
      return exists ? list.map(p=>p.id===form.id?form:p) : [...list, {...form, id:"pt"+Date.now()}];
    });
    setModal(null);
  }

  function importarProcedimentosTuss(linhas){
    setProcedimentosTuss(list => {
      const atualizado = [...list];
      linhas.forEach(({codigoTUSS, nomeProcedimento, nomeConvenio, valor}) => {
        let idx = atualizado.findIndex(p=>p.codigoTUSS===codigoTUSS);
        if (idx === -1) {
          atualizado.push({ id:"pt"+Date.now()+Math.random().toString(36).slice(2,6), nome:nomeProcedimento||codigoTUSS, codigoTUSS, valorPadrao:0, precosPorConvenio:{}, ativo:true });
          idx = atualizado.length - 1;
        }
        const proc = {...atualizado[idx], precosPorConvenio:{...(atualizado[idx].precosPorConvenio||{})}};
        if (nomeProcedimento) proc.nome = nomeProcedimento;
        if (!nomeConvenio) {
          proc.valorPadrao = valor;
        } else {
          const convenioObj = convenios.find(c => c.nome.toLowerCase() === nomeConvenio.toLowerCase());
          if (convenioObj) proc.precosPorConvenio[convenioObj.id] = valor;
        }
        atualizado[idx] = proc;
      });
      return atualizado;
    });
    pushLog("Interno", `Importação em lote da tabela TUSS: ${linhas.length} linha(s) processada(s).`);
  }

  // Correção pedida explicitamente pelo usuário: só médicos e fisioterapeutas (ehProfissionalSaude=true)
  // têm agenda de atendimento — colaboradores administrativos (recepção, financeiro, etc.) não aparecem
  // como opção de profissional em nenhum lugar ligado a agendamento/atendimento clínico.
  const profissionaisClinicos = useMemo(() => professionals.filter(p => p.ehProfissionalSaude), [professionals]);
  // P0-1 (2.1): unidade como dimensão global — filtra Agenda/Caixa/Dashboard sem afetar a detecção de conflitos
  // (que precisa enxergar TODOS os agendamentos, de todas as unidades, para nunca dar profissional em dobro — RN-2.1.1).
  const profissionaisNaUnidadeBase = useMemo(() => unidadeFiltro==="todas" ? profissionaisClinicos : profissionaisClinicos.filter(p=>(p.unidadeIds||[]).includes(unidadeFiltro)), [profissionaisClinicos, unidadeFiltro]);
  const appointmentsNaUnidadeBase = useMemo(() => unidadeFiltro==="todas" ? appointments : appointments.filter(a=>a.unidadeId===unidadeFiltro), [appointments, unidadeFiltro]);
  // Fisioterapeuta só vê a própria agenda. O vínculo é feito por nome (staff_profiles x professionals) até a
  // migração de dados para o Supabase ligar as duas tabelas por id de verdade — ver PLANO_MIGRACAO_SUPABASE.md.
  const profissionaisNaUnidade = useMemo(() => {
    if (!perms.agendaSomenteProprio) return profissionaisNaUnidadeBase;
    return profissionaisNaUnidadeBase.filter(p => p.nome === currentUser?.nome);
  }, [profissionaisNaUnidadeBase, perms, currentUser]);
  const appointmentsNaUnidade = useMemo(() => {
    if (!perms.agendaSomenteProprio) return appointmentsNaUnidadeBase;
    const idsPermitidos = new Set(profissionaisNaUnidade.map(p=>p.id));
    return appointmentsNaUnidadeBase.filter(a => idsPermitidos.has(a.profissionalId));
  }, [appointmentsNaUnidadeBase, perms, profissionaisNaUnidade]);
  const lancamentosNaUnidade = useMemo(() => unidadeFiltro==="todas" ? lancamentos : lancamentos.filter(l=>l.unidadeId===unidadeFiltro), [lancamentos, unidadeFiltro]);
  const guiasNaUnidade = useMemo(() => unidadeFiltro==="todas" ? guias : guias.filter(g=>g.unidadePrestadoraId===unidadeFiltro), [guias, unidadeFiltro]);

  // Evolução pós-sessão (RN pedida explicitamente pelo usuário): quando o profissional logado tem sessões
  // já realizadas ("atendido", data no passado) sem evolução registrada, ele é avisado — banner no topo da
  // Agenda + notificação simulada no canal "Push" (aba Notificações). Vínculo por nome, mesmo padrão já
  // usado para "agenda só a própria" (profissionaisNaUnidade acima).
  const meuProfissional = useMemo(() => professionals.find(p => p.nome === currentUser?.nome), [professionals, currentUser]);
  const minhasEvolucoesPendentes = useMemo(() => {
    if (currentUser?.role !== "fisioterapeuta" || !meuProfissional) return [];
    return appointments.filter(a => a.profissionalId === meuProfissional.id && evolucaoPendente(a));
  }, [appointments, currentUser, meuProfissional]);
  const evolucoesNotificadasRef = useRef(new Set());
  useEffect(() => {
    const idsPendentes = minhasEvolucoesPendentes.map(a=>a.id);
    const novas = idsPendentes.filter(id => !evolucoesNotificadasRef.current.has(id));
    if (novas.length > 0 && notifyEnabled) {
      novas.forEach(id => evolucoesNotificadasRef.current.add(id));
      const n = minhasEvolucoesPendentes.length;
      const corpo = `Você tem ${n} evolução${n>1?"ões":""} pendente${n>1?"s":""} de registro — sessões já realizadas ainda sem evolução preenchida.`;
      pushLog("Push", `🔔 ${corpo}`);
      dispararNotificacaoPushNavegador("PhysioFlow — Evolução pendente", corpo);
    }
  }, [minhasEvolucoesPendentes, notifyEnabled]);

  function salvarEvolucao(apptId, texto){
    const appt = appointments.find(a=>a.id===apptId);
    setAppointments(list => list.map(a => a.id===apptId
      ? {...a, evolucaoTexto: texto, evolucaoRegistradaEm: TODAY, evolucaoProfissionalId: meuProfissional?.id || a.profissionalId}
      : a));
    const cliente = clients.find(c=>c.id===appt?.clienteId);
    pushLog("Interno", `Evolução registrada para ${cliente?.nome || "cliente"} (sessão de ${fmtDataBR(appt?.data||TODAY)}) por ${currentUser?.nome || "—"}.`);
  }

  function unidadePadraoParaProfissional(profId){
    if (unidadeFiltro !== "todas") return unidadeFiltro;
    const prof = professionals.find(p=>p.id===profId);
    return prof?.unidadeIds?.[0] || unidades[0]?.id || "";
  }

  return (
    <div className="min-h-screen">
      <TopBar tab={tab} setTab={setTab} notifyEnabled={notifyEnabled} setNotifyEnabled={setNotifyEnabled} onReset={resetParaDadosDeExemplo}
        unidades={unidades} unidadeFiltro={unidadeFiltro} setUnidadeFiltro={setUnidadeFiltro}
        currentUser={currentUser} perms={perms} onLogout={onLogout}
        professionals={professionals} clients={clients} appointments={appointments}
        evolucoesPendentesCount={minhasEvolucoesPendentes.length}
        onRegistrarPonto={registrarPonto} onConfirmarChegada={confirmarChegadaPaciente} />
      <main className="max-w-[1500px] mx-auto p-4">
        {tab === "agenda" && (
          <Agenda
            professionals={profissionaisNaUnidade}
            clients={clients}
            appointments={appointmentsNaUnidade}
            guias={guias}
            fichas={fichas}
            vendas={vendas}
            produtos={produtos}
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            currentUser={currentUser}
            onStatusChange={handleStatusChange}
            onMoveProfessional={handleMoveProfessional}
            onNewAppointment={(profId, dataOverride)=>setModal({type:"appt", data:{profissionalId:profId, data:dataOverride||selectedDate, hora:"09:00", status:"agendado", tipo:"sessao", duracaoMin:50, unidadeId:unidadePadraoParaProfissional(profId), clienteId:clients[0]?.id||"", sessaoAtual:1, pagamentoVinculado:false}})}
            onVenderProduto={perms.tabs.includes("caixa") ? (appt)=>setModal({type:"venderProduto", data:{clienteId:appt.clienteId, unidadeId:appt.unidadeId, data:appt.data}}) : null}
            onConfirmarChegada={confirmarChegadaPaciente}
            onViewClientProfile={(c)=>setModal({type:"clientProfile", data:c})}
            evolucoesPendentes={minhasEvolucoesPendentes}
            onRegistrarEvolucao={(cliente)=>setModal({type:"client", data:cliente, abaInicial:"evolucao"})}
          />
        )}
        {tab === "clientes" && (
          <ClientList clients={clients} professionals={professionals} appointments={appointments}
            onNew={()=>setModal({type:"client", data:{id:"", nome:"", telefone:"", email:"", endereco:"", dataNascimento:"", cpf:"", numeroCarteirinha:"", convenio:"", pagamento:{tipo:"particular", numeroGuia:""}, medico:"", telefoneEmergencia:"", tratamento:"", pacoteNome:"", sessoesTotal:10, dataInicio:TODAY, profissionaisIds:[], valorSessao:0, alta:null, horariosFixos:[], produtoId:null, descontoAplicado:0, parcelas:1, biometriaCadastrada:false, observacoes:"", origemCadastro:"manual", documentosAnexados:[]}})}
            onEdit={(c)=>setModal({type:"client", data:c})}
            onViewProfile={(c)=>setModal({type:"clientProfile", data:c})}
            onImportarLote={()=>setModal({type:"importClientes"})}
            onGerarLinkCadastro={()=>setModal({type:"linkCadastro"})}
          />
        )}
