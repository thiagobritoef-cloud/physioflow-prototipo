      {mostrarRespostas && modelo && (
        <div className="space-y-3 border-t border-slate-100 pt-3 mt-1">
          {modelo.perguntas.map(p => (
            <Field key={p.id} label={p.texto}>
              {p.tipo === "texto" && <textarea className={inputCls} rows="2" value={form.respostas[p.id]||""} onChange={e=>setResposta(p.id, e.target.value)} />}
              {p.tipo === "escala" && <input type="number" min="0" max="10" className={inputCls} value={form.respostas[p.id]??""} onChange={e=>setResposta(p.id, e.target.value)} />}
              {p.tipo === "sim_nao" && (
                <select className={inputCls} value={form.respostas[p.id]||""} onChange={e=>setResposta(p.id, e.target.value)}>
                  <option value="">—</option>
                  <option value="sim">Sim</option>
                  <option value="nao">Não</option>
                </select>
              )}
            </Field>
          ))}
        </div>
      )}

      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={()=>onSave({...form, status: computeStatus()})} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">
          {form.modo==="remoto" && !data.id ? "Enviar para o paciente" : "Salvar"}
        </button>
      </div>
    </Modal>
  );
}

function ModeloFichaModal({data, onClose, onSave}) {
  const [form, setForm] = useState(data);
  function addPergunta(){
    setForm(f => ({...f, perguntas:[...f.perguntas, {id:"q"+Date.now(), texto:"", tipo:"texto"}]}));
  }
  function updatePergunta(id, patch){
    setForm(f => ({...f, perguntas: f.perguntas.map(p => p.id===id ? {...p, ...patch} : p)}));
  }
  function removePergunta(id){
    setForm(f => ({...f, perguntas: f.perguntas.filter(p=>p.id!==id)}));
  }
  return (
    <Modal title={data.id ? "Editar modelo de ficha" : "Novo modelo de ficha"} onClose={onClose} wide>
      <Field label="Nome do modelo"><input className={inputCls} value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
      <div className="space-y-2">
        {form.perguntas.map(p => (
          <div key={p.id} className="flex items-center gap-2">
            <input className={inputCls} value={p.texto} onChange={e=>updatePergunta(p.id,{texto:e.target.value})} placeholder="Pergunta" />
            <select className={inputCls + " max-w-[160px]"} value={p.tipo} onChange={e=>updatePergunta(p.id,{tipo:e.target.value})}>
              {Object.entries(PERGUNTA_TIPOS).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
            </select>
            <button onClick={()=>removePergunta(p.id)} className="text-red-500 text-xs px-2">Remover</button>
          </div>
        ))}
      </div>
      <button onClick={addPergunta} className="mt-2 text-xs font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-lg px-3 py-1.5">+ Adicionar pergunta</button>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={()=>onSave(form)} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">Salvar modelo</button>
      </div>
    </Modal>
  );
}

/* ---------------- Dashboard ---------------- */
function KpiCard({label, value, sub, tone}) {
  const toneCls = {
    default:"text-slate-800", green:"text-green-600", red:"text-red-600", amber:"text-amber-600", teal:"text-teal-600"
  }[tone||"default"];
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-4">
      <div className="text-xs text-slate-500">{label}</div>
      <div className={"text-2xl font-bold mt-1 " + toneCls}>{value}</div>
      {sub && <div className="text-[11px] text-slate-400 mt-1">{sub}</div>}
    </div>
  );
}

// P0-4 (6.1): fonte única de precificação — sessão de convênio usa a tabela TUSS por convênio (guia.procedimentoId);
// sessão particular usa o produto/pacote vinculado ao cliente; cliente.valorSessao só entra como override manual explícito.
function precoDaSessao(appt, cliente, guias, produtos, procedimentosTuss, convenios){
  if (!cliente) return { valor:0, origem:"—" };
  if (cliente.pagamento.tipo === "convenio" && appt.guiaId) {
    const guia = guias.find(g=>g.id===appt.guiaId);
    const procedimento = guia ? procedimentosTuss.find(p=>p.id===guia.procedimentoId) : null;
    if (procedimento) return { valor: getPrecoProcedimento(procedimento, guia.convenio, convenios), origem:"tabela TUSS" };
  }
  if (cliente.produtoId) {
    const produto = produtos.find(p=>p.id===cliente.produtoId);
    if (produto) {
      const descontoFrac = Math.min(cliente.descontoAplicado||0, produto.descontoMaximoPercent||0)/100;
      const precoComDesconto = produto.precoBase * (1-descontoFrac);
      const porSessao = produto.sessoesIncluidas>0 ? precoComDesconto/produto.sessoesIncluidas : precoComDesconto;
      return { valor: porSessao, origem:"produto/pacote" };
    }
  }
  return { valor: cliente.valorSessao||0, origem:"override manual" };
}

function valorGuiaPendente(guia, procedimentosTuss, convenios){
  const procedimento = procedimentosTuss.find(p=>p.id===guia.procedimentoId);
  const precoUnit = procedimento ? getPrecoProcedimento(procedimento, guia.convenio, convenios) : 0;
  return Math.max(0, precoUnit*guia.quantidadeAutorizada - (guia.valorGlosa||0));
}

function Dashboard({clients, appointments, guias, lancamentos, fichas, produtos, convenios, procedimentosTuss}) {
  const caixaHoje = useMemo(() => calcCaixaDia(lancamentos, TODAY), [lancamentos]);
  const fichasPendentes = fichas.filter(f=>f.status==="pendente_paciente").length;
  const fichasAssinadas = fichas.filter(f=>f.status==="assinada").length;
  const barRef = useRef(null);
  const doughnutRef = useRef(null);
  const barChart = useRef(null);
  const doughnutChart = useRef(null);

  const glosasList = useMemo(() => guias
    .filter(g => g.status==="glosada_parcial" || g.status==="glosada_total")
    .map(g => ({ convenio:g.convenio, numeroGuia:g.numeroGuia, valor:g.valorGlosa||0, motivo:g.motivoGlosa||"—" })), [guias]);

  const guiasProntasParaFaturar = guias.filter(g => g.status==="aberta" && g.quantidadeUtilizada >= g.quantidadeAutorizada).length;

  const guiasVencendo = guias.filter(g => (g.status==="aberta"||g.status==="em_faturamento") && diasParaVencer(g.validade) <= LIMITE_ALERTA_VALIDADE_DIAS);

  const glosasPorConvenio = useMemo(() => {
    const map = {};
    glosasList.forEach(g => { map[g.convenio] = (map[g.convenio]||{valor:0, qtd:0}); map[g.convenio].valor += g.valor; map[g.convenio].qtd += 1; });
    return Object.entries(map).map(([convenio, v]) => ({convenio, ...v})).sort((a,b)=>b.valor-a.valor);
  }, [glosasList]);

  const glosasPorMotivo = useMemo(() => {
    const map = {};
    glosasList.forEach(g => { map[g.motivo] = (map[g.motivo]||{valor:0, qtd:0}); map[g.motivo].valor += g.valor; map[g.motivo].qtd += 1; });
    return Object.entries(map).map(([motivo, v]) => ({motivo, ...v})).sort((a,b)=>b.valor-a.valor);
  }, [glosasList]);

  const stats = useMemo(() => {
    const total = appointments.length;
    const atendidos = appointments.filter(a=>a.status==="atendido").length;
    const desmarcados = appointments.filter(a=>a.status==="desmarcado").length;
    const faltas = appointments.filter(a=>a.status==="faltou").length;
    const avaliacoes = appointments.filter(a=>(a.tipo||"sessao")==="avaliacao").length;
    const novosClientesMes = clients.filter(c => c.dataInicio >= (TODAY.slice(0,7) + "-01")).length;

    const valorPorConvenio = {};
    let valorProduzido = 0;
    let sessoesComOverrideManual = 0;
    appointments.filter(a=>a.status==="atendido").forEach(a => {
      const cliente = clients.find(c=>c.id===a.clienteId);
      if (!cliente) return;
      const { valor, origem } = precoDaSessao(a, cliente, guias, produtos, procedimentosTuss, convenios);
      if (origem === "override manual") sessoesComOverrideManual++;
      valorProduzido += valor;
      const chave = cliente.pagamento.tipo==="convenio" ? cliente.convenio : cliente.pagamento.tipo==="bolsa" ? "Bolsa" : "Particular";
      valorPorConvenio[chave] = (valorPorConvenio[chave]||0) + valor;
    });
    const totalGlosas = glosasList.reduce((s,g)=>s+g.valor,0);
    const valorRecebido = valorProduzido - totalGlosas;

    return { total, atendidos, desmarcados, faltas, avaliacoes, novosClientesMes, valorPorConvenio, valorProduzido, valorRecebido, totalGlosas, sessoesComOverrideManual };
  }, [clients, appointments, glosasList, guias, produtos, procedimentosTuss, convenios]);

  // P0-4 (6.1): Produção (competência, sessões "atendido") vs. Recebimento (caixa: particular na hora +
  // guias efetivamente pagas pelo convênio) vs. A receber de convênio, com aging.
  const competenciaVsCaixa = useMemo(() => {
    const producao = stats.valorProduzido;
    const recebimentoParticular = lancamentos.filter(l=>l.tipo==="receita").reduce((s,l)=>s+l.valor,0);
    const guiasPagas = guias.filter(g=>g.status==="paga");
    const recebimentoConvenio = guiasPagas.reduce((s,g)=>s+valorGuiaPendente(g, procedimentosTuss, convenios), 0);
    const recebimentoTotal = recebimentoParticular + recebimentoConvenio;

    const pendentes = guias.filter(g => g.status==="em_faturamento" || g.status==="glosada_parcial" || g.status==="aberta");
    const buckets = { "0–30 dias":0, "31–60 dias":0, "61–90 dias":0, "Acima de 90 dias":0 };
    let totalAReceber = 0;
    pendentes.forEach(g => {
      const valor = valorGuiaPendente(g, procedimentosTuss, convenios);
      totalAReceber += valor;
      const referencia = g.dataEnvio || g.dataAutorizacao;
      const dias = referencia ? Math.round((new Date(TODAY+"T00:00:00") - new Date(referencia+"T00:00:00"))/86400000) : 0;
      if (dias <= 30) buckets["0–30 dias"] += valor;
      else if (dias <= 60) buckets["31–60 dias"] += valor;
      else if (dias <= 90) buckets["61–90 dias"] += valor;
      else buckets["Acima de 90 dias"] += valor;
    });
    return { producao, recebimentoParticular, recebimentoConvenio, recebimentoTotal, buckets, totalAReceber };
  }, [stats.valorProduzido, lancamentos, guias, procedimentosTuss, convenios]);

  useEffect(() => {
    if (barChart.current) barChart.current.destroy();
    if (doughnutChart.current) doughnutChart.current.destroy();
    const chavesConvenio = Object.keys(stats.valorPorConvenio);
    barChart.current = new Chart(barRef.current, {
      type: "bar",
      data: { labels: chavesConvenio, datasets: [{ label:"Valor produzido (R$)", data: chavesConvenio.map(k=>stats.valorPorConvenio[k]), backgroundColor:"#0d9488" }] },
      options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
    });
    doughnutChart.current = new Chart(doughnutRef.current, {
      type: "doughnut",
      data: {
        labels: ["Atendido","Agendado/Confirmado","Desmarcado","Faltou"],
        datasets: [{ data: [
          appointments.filter(a=>a.status==="atendido").length,
          appointments.filter(a=>a.status==="agendado"||a.status==="confirmado"||a.status==="chegou").length,
          appointments.filter(a=>a.status==="desmarcado").length,
          appointments.filter(a=>a.status==="faltou").length,
        ], backgroundColor:["#16a34a","#2563eb","#d97706","#dc2626"] }]
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}}} }
    });
    return () => { barChart.current?.destroy(); doughnutChart.current?.destroy(); };
  }, [stats, appointments]);

  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-3">Dashboard administrativo</h2>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <KpiCard label="Nº de clientes" value={clients.length} />
        <KpiCard label="Atendimentos concluídos" value={stats.atendidos} tone="green" sub={`de ${stats.total} agendamentos carregados`} />
        <KpiCard label="Desmarcações" value={stats.desmarcados} tone="amber" />
        <KpiCard label="Novos clientes (mês)" value={stats.novosClientesMes} tone="teal" />
        <KpiCard label="Faltas (no-show)" value={stats.faltas} tone="red" />
        <KpiCard label="Produção (competência)" value={fmtBRL(stats.valorProduzido)} tone="teal" sub="sessões atendidas × preço da tabela/produto" />
        <KpiCard label="Valor recebido (líquido)" value={fmtBRL(stats.valorRecebido)} tone="green" sub="produzido − glosas" />
        <KpiCard label="Glosas" value={fmtBRL(stats.totalGlosas)} tone="red" sub={`${glosasList.length} guia(s) glosada(s)`} />
        <KpiCard label="Guias prontas p/ faturar" value={guiasProntasParaFaturar} tone="amber" sub="sessões autorizadas 100% realizadas" />
        <KpiCard label="Guias vencendo em breve" value={guiasVencendo.length} tone="amber" sub={`senha/validade em até ${LIMITE_ALERTA_VALIDADE_DIAS} dias`} />
        <KpiCard label="Fichas pendentes (paciente)" value={fichasPendentes} tone="amber" sub="aguardando preenchimento remoto" />
        <KpiCard label="Fichas assinadas" value={fichasAssinadas} tone="green" sub="com termo LGPD aceito" />
        {stats.sessoesComOverrideManual>0 && (
          <KpiCard label="Sessões com preço manual (override)" value={stats.sessoesComOverrideManual} tone="red" sub="sem produto/TUSS vinculado — revisar cadastro" />
        )}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
        <div className="text-sm font-medium text-slate-700 mb-1">Competência × Caixa (P0-4)</div>
        <p className="text-[11px] text-slate-400 mb-3">Produção é o valor gerado pelas sessões atendidas (regime de competência); Recebimento é o que efetivamente entrou no caixa/convênio (regime de caixa). Os dois números não precisam bater no mesmo período.</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <KpiCard label="Produção (competência)" value={fmtBRL(competenciaVsCaixa.producao)} tone="teal" sub="sessões atendidas" />
          <KpiCard label="Recebimento particular" value={fmtBRL(competenciaVsCaixa.recebimentoParticular)} tone="green" sub="lançamentos de receita no caixa" />
          <KpiCard label="Recebimento convênio" value={fmtBRL(competenciaVsCaixa.recebimentoConvenio)} tone="green" sub="guias com status Paga" />
          <KpiCard label="A receber de convênio" value={fmtBRL(competenciaVsCaixa.totalAReceber)} tone="amber" sub="guias enviadas/glosadas ainda não pagas" />
        </div>
        <table className="w-full text-sm mt-3">
          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Faixa (dias desde envio)</th><th className="text-right py-1">Valor a receber</th></tr></thead>
          <tbody>
            {Object.entries(competenciaVsCaixa.buckets).map(([faixa,valor]) => (
              <tr key={faixa} className="border-t border-slate-100">
                <td className="py-1.5 text-slate-600">{faixa}</td>
                <td className="py-1.5 text-right font-medium text-amber-600">{fmtBRL(valor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Valor por convênio</div>
          <canvas ref={barRef} height="220"></canvas>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Agendamentos por status</div>
          <canvas ref={doughnutRef} height="220"></canvas>
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Glosas recentes</div>
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Guia</th><th className="text-left py-1">Convênio</th><th className="text-left py-1">Motivo</th><th className="text-right py-1">Valor</th></tr></thead>
          <tbody>
            {glosasList.length===0 && <tr><td colSpan="4" className="py-3 text-slate-400 text-center">Nenhuma glosa registrada.</td></tr>}
            {glosasList.map((g,i) => (
              <tr key={i} className="border-t border-slate-100">
                <td className="py-1.5">{g.numeroGuia}</td>
                <td className="py-1.5">{g.convenio}</td>
                <td className="py-1.5 text-slate-500">{g.motivo}</td>
                <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Glosas por convênio</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Convênio</th><th className="text-left py-1">Guias glosadas</th><th className="text-right py-1">Total</th></tr></thead>
            <tbody>
              {glosasPorConvenio.length===0 && <tr><td colSpan="3" className="py-3 text-slate-400 text-center">Sem glosas registradas.</td></tr>}
              {glosasPorConvenio.map((g,i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5">{g.convenio}</td>
                  <td className="py-1.5 text-slate-500">{g.qtd}</td>
                  <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Glosas por motivo</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Motivo</th><th className="text-left py-1">Ocorrências</th><th className="text-right py-1">Total</th></tr></thead>
            <tbody>
              {glosasPorMotivo.length===0 && <tr><td colSpan="3" className="py-3 text-slate-400 text-center">Sem glosas registradas.</td></tr>}
              {glosasPorMotivo.map((g,i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5">{g.motivo}</td>
                  <td className="py-1.5 text-slate-500">{g.qtd}</td>
                  <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="text-[11px] text-slate-400 mt-2">Use esse recorte para embasar renegociação com o convênio e priorizar correções que evitam glosas recorrentes.</p>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Resumo financeiro consolidado do dia (DRE simplificado)</div>
        <table className="w-full text-sm">
          <tbody>
            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600">Receita de atendimentos (sessões confirmadas)</td><td className="py-1.5 text-right font-medium text-green-600">{fmtBRL(stats.valorProduzido)}</td></tr>
            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600">(−) Glosas de convênio</td><td className="py-1.5 text-right font-medium text-red-600">{fmtBRL(stats.totalGlosas)}</td></tr>
            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600 font-medium">(=) Receita líquida de atendimentos</td><td className="py-1.5 text-right font-semibold">{fmtBRL(stats.valorRecebido)}</td></tr>
            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600">Entradas de caixa hoje (todas as formas)</td><td className="py-1.5 text-right font-medium text-green-600">{fmtBRL(caixaHoje.totalReceitas)}</td></tr>
            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600">(−) Despesas de caixa hoje</td><td className="py-1.5 text-right font-medium text-red-600">{fmtBRL(caixaHoje.totalDespesas)}</td></tr>
            <tr><td className="py-1.5 text-slate-700 font-semibold">(=) Resultado de caixa do dia</td><td className={"py-1.5 text-right font-bold " + (caixaHoje.resultadoDia>=0?"text-green-600":"text-red-600")}>{fmtBRL(caixaHoje.resultadoDia)}</td></tr>
          </tbody>
        </table>
        <p className="text-[11px] text-slate-400 mt-2">Sangrias e reforços não entram no resultado (são apenas movimentação física de caixa) — veja o detalhamento na aba Fluxo de Caixa.</p>
      </div>

      {guiasVencendo.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Guias com senha/validade vencendo em breve</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Guia</th><th className="text-left py-1">Cliente</th><th className="text-left py-1">Convênio</th><th className="text-right py-1">Validade</th></tr></thead>
            <tbody>
              {guiasVencendo.map(g => {
                const cliente = clients.find(c=>c.id===g.clienteId);
                const d = diasParaVencer(g.validade);
                return (
                  <tr key={g.id} className="border-t border-slate-100">
                    <td className="py-1.5">{g.numeroGuia}</td>
                    <td className="py-1.5">{cliente?.nome}</td>
                    <td className="py-1.5 text-slate-500">{g.convenio}</td>
                    <td className="py-1.5 text-right text-amber-600 font-medium">{fmtDataBR(g.validade)} ({d < 0 ? `venceu há ${Math.abs(d)}d` : d===0 ? "hoje" : `${d}d`})</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- Usuários e Permissões (lê/edita staff_profiles no Supabase) ---------------- */
function UsuariosPanel({currentUser}) {
  const [usuarios, setUsuarios] = useState(undefined); // undefined = carregando
  const [erro, setErro] = useState("");
  const [salvandoId, setSalvandoId] = useState(null);

  function recarregar(){
    setUsuarios(undefined);
    setErro("");
    if (!sbClient) { setErro("Cliente Supabase não carregou. Verifique sua conexão e recarregue a página."); setUsuarios([]); return; }
    sbClient.from("staff_profiles").select("*").order("nome").then(({data, error}) => {
      if (error) { setErro(error.message); setUsuarios([]); return; }
      setUsuarios(data || []);
    });
  }

  useEffect(() => { recarregar(); }, []);

  async function alterarRole(usuario, novoRole){
    setSalvandoId(usuario.id);
    const { error } = await sbClient.from("staff_profiles").update({ role: novoRole }).eq("id", usuario.id);
    setSalvandoId(null);
    if (error) { window.alert("Não foi possível salvar: " + error.message); return; }
    setUsuarios(list => list.map(u => u.id===usuario.id ? {...u, role:novoRole} : u));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-lg font-semibold text-slate-800">Usuários e permissões</h2>
        <button onClick={recarregar} className="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Recarregar</button>
      </div>
      <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-4">
        Aqui você troca o cargo/perfil de quem já tem login. Para criar um login novo (primeiro acesso de alguém), essa ação exige uma chave que não pode ficar no navegador por segurança — peça para quem administra o Supabase do projeto enviar o convite.
      </div>
      {erro && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 mb-4">{erro}</div>}
      {usuarios === undefined ? (
        <div className="text-sm text-slate-400 py-8 text-center">Carregando...</div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
              <tr>
                <th className="text-left px-4 py-2">Nome</th>
                <th className="text-left px-4 py-2">Cargo/Perfil</th>
                <th className="text-left px-4 py-2">Criado em</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {usuarios.length===0 && <tr><td colSpan="4" className="text-center py-4 text-slate-400">Nenhum usuário encontrado.</td></tr>}
              {usuarios.map(u => (
                <tr key={u.id} className="border-t border-slate-100">
                  <td className="px-4 py-2 font-medium text-slate-800">
                    {u.nome}
                    {u.id===currentUser?.id && <span className="ml-2 text-[10px] text-teal-600 font-normal">(você)</span>}
                  </td>
                  <td className="px-4 py-2">
                    <select value={u.role} disabled={salvandoId===u.id} onChange={e=>alterarRole(u, e.target.value)}
                      className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
                      {Object.entries(PERMISSOES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                    </select>
                  </td>
                  <td className="px-4 py-2 text-slate-500 text-xs">{u.created_at ? fmtDataBR(String(u.created_at).slice(0,10)) : "—"}</td>
                  <td className="px-4 py-2 text-right text-xs text-slate-400">{salvandoId===u.id ? "Salvando..." : ""}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- Login (Supabase Auth) ---------------- */
function LoginScreen({onLoggedIn}) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  async function handleSubmit(e){
    e.preventDefault();
    if (!sbClient) { setErro("Cliente Supabase não carregou. Verifique sua conexão e recarregue a página."); return; }
    setErro(""); setCarregando(true);
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password: senha });
    setCarregando(false);
    if (error) { setErro(error.message === "Invalid login credentials" ? "E-mail ou senha inválidos." : error.message); return; }
    onLoggedIn(data.session);
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
      <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-md border border-slate-200 p-8 w-full max-w-sm">
        <div className="flex items-center gap-2 mb-6 justify-center">
          <div className="w-9 h-9 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold">P</div>
          <span className="font-semibold text-slate-800 text-lg">PhysioFlow</span>
        </div>
        <h1 className="text-sm font-medium text-slate-600 mb-4 text-center">Entrar no sistema de agendamento</h1>
        {erro && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 mb-4">{erro}</div>}
        <label className="block text-xs font-medium text-slate-600 mb-1">E-mail</label>
        <input type="email" required value={email} onChange={e=>setEmail(e.target.value)}
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3" placeholder="voce@grupopelvic.com.br" />
        <label className="block text-xs font-medium text-slate-600 mb-1">Senha</label>
        <input type="password" required value={senha} onChange={e=>setSenha(e.target.value)}
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-5" placeholder="••••••••" />
        <button type="submit" disabled={carregando}
          className="w-full bg-teal-600 hover:bg-teal-700 disabled:opacity-60 text-white text-sm font-medium rounded-lg py-2.5">
          {carregando ? "Entrando..." : "Entrar"}
        </button>
        <div className="text-[11px] text-slate-400 mt-4 text-center">Não tem acesso? Peça para o gestor da clínica criar seu usuário.</div>
      </form>
    </div>
  );
}

function SetPasswordScreen({email, onDone}) {
  const [senha, setSenha] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  async function handleSubmit(e){
    e.preventDefault();
    if (senha.length < 6) { setErro("A senha precisa ter pelo menos 6 caracteres."); return; }
    if (senha !== confirmar) { setErro("As senhas não coincidem."); return; }
    setErro(""); setCarregando(true);
    const { error } = await sbClient.auth.updateUser({ password: senha });
    setCarregando(false);
    if (error) { setErro(error.message); return; }
    onDone();
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
      <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-md border border-slate-200 p-8 w-full max-w-sm">
        <div className="flex items-center gap-2 mb-6 justify-center">
          <div className="w-9 h-9 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold">P</div>
          <span className="font-semibold text-slate-800 text-lg">PhysioFlow</span>
        </div>
        <h1 className="text-sm font-medium text-slate-600 mb-1 text-center">Bem-vindo(a)!</h1>
        <div className="text-xs text-slate-400 mb-4 text-center">Defina uma senha para {email} continuar acessando o sistema.</div>
        {erro && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 mb-4">{erro}</div>}
        <label className="block text-xs font-medium text-slate-600 mb-1">Nova senha</label>
        <input type="password" required value={senha} onChange={e=>setSenha(e.target.value)}
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3" placeholder="Mínimo 6 caracteres" />
        <label className="block text-xs font-medium text-slate-600 mb-1">Confirmar senha</label>
        <input type="password" required value={confirmar} onChange={e=>setConfirmar(e.target.value)}
          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-5" placeholder="Repita a senha" />
        <button type="submit" disabled={carregando}
          className="w-full bg-teal-600 hover:bg-teal-700 disabled:opacity-60 text-white text-sm font-medium rounded-lg py-2.5">
          {carregando ? "Salvando..." : "Definir senha e entrar"}
        </button>
      </form>
    </div>
  );
}

function AuthGate() {
  const [session, setSession] = useState(undefined); // undefined = carregando, null = deslogado
  const [profile, setProfile] = useState(undefined); // undefined = carregando, null = sem perfil, obj = ok
  const [erroPerfil, setErroPerfil] = useState("");
  // Detecta, já na primeira renderização (antes do supabase-js consumir o hash da URL),
  // se o usuário veio de um link de convite ou de recuperação de senha — nesses casos
  // ele ainda não tem senha própria definida (ou está redefinindo) e precisa passar por essa etapa.
  const [precisaDefinirSenha, setPrecisaDefinirSenha] = useState(() => {
    const hash = window.location.hash || "";
    return hash.includes("type=invite") || hash.includes("type=recovery");
  });

  useEffect(() => {
    if (!sbClient) { setSession(null); return; }
    sbClient.auth.getSession().then(({data}) => setSession(data.session || null));
    const { data: listener } = sbClient.auth.onAuthStateChange((_event, s) => setSession(s || null));
    return () => listener?.subscription?.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(session === null ? null : undefined); return; }
    setProfile(undefined);
    setErroPerfil("");
    sbClient.from("staff_profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({data, error}) => {
        if (error) { setErroPerfil(error.message); setProfile(null); return; }
        setProfile(data || null);
      });
  }, [session]);

  function handleLogout(){
    if (sbClient) sbClient.auth.signOut();
    setSession(null);
    setProfile(undefined);
  }

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">Carregando...</div>;
  }
  if (session === null) {
    return <LoginScreen onLoggedIn={setSession} />;
  }
  if (precisaDefinirSenha) {
    return <SetPasswordScreen email={session.user.email} onDone={() => {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
      setPrecisaDefinirSenha(false);
    }} />;
  }
  if (profile === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">Carregando perfil...</div>;
  }
  if (profile === null) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
        <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-8 w-full max-w-sm text-center">
          <div className="text-sm font-medium text-slate-700 mb-2">Login feito, mas sem perfil de acesso</div>
          <div className="text-xs text-slate-500 mb-1">Sua conta ({session.user.email}) foi autenticada, mas ainda não existe um perfil (staff_profiles) associado a ela.</div>
          {erroPerfil && <div className="text-[11px] text-red-500 mb-3">{erroPerfil}</div>}
          <div className="text-xs text-slate-500 mb-4">Peça para o gestor da clínica cadastrar seu usuário.</div>
          <button onClick={handleLogout} className="text-xs text-teal-700 underline">Sair</button>
        </div>
      </div>
    );
  }
  const currentUser = { id: profile.id, nome: profile.nome || session.user.email, role: profile.role, email: session.user.email };
  return <App currentUser={currentUser} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
</script>
</body>
