/* ---------------- Agenda Kanban ---------------- */
function Agenda({professionals, clients, appointments, guias, fichas, vendas, produtos, selectedDate, setSelectedDate, currentUser, onStatusChange, onMoveProfessional, onNewAppointment, onVenderProduto, onConfirmarChegada, onViewClientProfile, evolucoesPendentes, onRegistrarEvolucao}) {
  // Regra pedida explicitamente pelo usuário: usuário "profissional" (fisioterapeuta) não vê pagamentos/valores.
  const podeVerValores = currentUser?.role !== "fisioterapeuta";
  // Notificação push real do navegador para evolução pendente (RN pedida explicitamente pelo usuário) —
  // ver dispararNotificacaoPushNavegador. Precisa de permissão explícita do usuário (gesto de clique).
  const [statusPush, setStatusPush] = useState(statusPermissaoPush);
  function ativarNotificacoesPush(){
    solicitarPermissaoPush().then(setStatusPush);
  }
  const dragItem = useRef(null);
  const [apptChegadaBiometria, setApptChegadaBiometria] = useState(null);
  const [visao, setVisao] = useState("dia"); // "dia" (kanban) | "semana" (agenda individual por profissional)
  const [profissionalSemanaId, setProfissionalSemanaId] = useState(() => professionals[0]?.id || "");
  useEffect(() => {
    if (!professionals.some(p=>p.id===profissionalSemanaId)) setProfissionalSemanaId(professionals[0]?.id || "");
  }, [professionals, profissionalSemanaId]);
  const profissionalDaSemana = professionals.find(p=>p.id===profissionalSemanaId);

  const apptsByProf = useMemo(() => {
    const map = {};
    professionals.forEach(p => map[p.id] = []);
    appointments.filter(a=>a.data===selectedDate).forEach(a => {
      if (!map[a.profissionalId]) map[a.profissionalId] = [];
      map[a.profissionalId].push(a);
    });
    Object.values(map).forEach(arr => arr.sort((x,y)=>x.hora.localeCompare(y.hora)));
    return map;
  }, [appointments, professionals, selectedDate]);

  const diaSemana = getWeekdayLabel(selectedDate);
  // Mostra só quem atende nesse dia da semana; mantém visível quem já tem agendamento
  // remanescente naquele dia mesmo fora da disponibilidade cadastrada (não esconde dados).
  const profissionaisDoDia = useMemo(() => professionals.filter(p =>
    (p.dias||[]).includes(diaSemana) || (apptsByProf[p.id]||[]).length > 0
  ), [professionals, diaSemana, apptsByProf]);

  function shiftDate(days){
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate()+days);
    setSelectedDate(d.toISOString().slice(0,10));
  }

  const placar = useMemo(() => {
    const inicioSemana = getInicioSemana(TODAY);
    const fimSemana = getFimSemana(TODAY);
    const mesAtual = TODAY.slice(0,7);
    const apptsMes = appointments.filter(a => a.data.startsWith(mesAtual));
    const atendimentosSemana = appointments.filter(a => a.status==="atendido" && a.data>=inicioSemana && a.data<=fimSemana).length;
    const atendimentosMes = apptsMes.filter(a => a.status==="atendido").length;
    const desmarcadosMes = apptsMes.filter(a => a.status==="desmarcado").length;
    const percentualDesmarcacao = apptsMes.length>0 ? (desmarcadosMes/apptsMes.length*100) : 0;
    const horasDisponiveisMes = professionals.reduce((s,p) => s + (p.dias?.length||0)*horasEntre(p.horaInicio,p.horaFim)*4.33, 0);
    const taxaOcupacao = horasDisponiveisMes>0 ? (atendimentosMes/horasDisponiveisMes*100) : 0;
    const pacientesAtivos = clients.filter(c=>!c.alta).length;
    const contagemSemanaPorCliente = {};
    appointments.filter(a => a.data>=inicioSemana && a.data<=fimSemana && (a.tipo||"sessao")!=="avaliacao").forEach(a => {
      contagemSemanaPorCliente[a.clienteId] = (contagemSemanaPorCliente[a.clienteId]||0) + 1;
    });
    const pacientes2xSemana = clients.filter(c => !c.alta && contagemSemanaPorCliente[c.id]===2).length;
    return { atendimentosSemana, atendimentosMes, taxaOcupacao, percentualDesmarcacao, pacientesAtivos, pacientes2xSemana };
  }, [appointments, professionals, clients]);

  return (
    <div>
      {/* Evolução pós-sessão (RN pedida explicitamente pelo usuário): avisa o profissional logado sobre
          sessões já realizadas que ainda não têm a evolução registrada, com atalho direto para cada cliente. */}
      {(evolucoesPendentes||[]).length > 0 && (
        <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 mb-4">
          <div className="text-sm font-semibold text-orange-800 mb-2">🔔 Você tem {evolucoesPendentes.length} evolução{evolucoesPendentes.length>1?"ões":""} pendente{evolucoesPendentes.length>1?"s":""} de registro</div>
          <div className="flex flex-col gap-1.5">
            {evolucoesPendentes.map(a => {
              const cliente = clients.find(c=>c.id===a.clienteId);
              return (
                <div key={a.id} className="flex items-center justify-between gap-2 text-sm bg-white border border-orange-100 rounded-lg px-3 py-1.5">
                  <span className="text-slate-700">{cliente?.nome || "Cliente removido"} — sessão de {fmtDataBR(a.data)}</span>
                  {cliente && (
                    <button onClick={()=>onRegistrarEvolucao(cliente)} className="text-orange-700 text-xs font-medium hover:underline flex-shrink-0">Registrar evolução</button>
                  )}
                </div>
              );
            })}
          </div>
          {statusPush === "default" && (
            <div className="flex items-center justify-between gap-2 text-xs bg-orange-100/60 border border-orange-200 rounded-lg px-3 py-2 mt-2">
              <span>Ative as notificações do navegador para ser avisado de evoluções pendentes mesmo com o PhysioFlow em segundo plano.</span>
              <button type="button" onClick={ativarNotificacoesPush} className="px-2 py-1 rounded-md bg-orange-600 text-white font-medium hover:bg-orange-700 flex-shrink-0 whitespace-nowrap">Ativar notificações</button>
            </div>
          )}
          {statusPush === "denied" && (
            <p className="text-[11px] text-orange-700 mt-2">🔕 Notificações do navegador bloqueadas — habilite manualmente nas permissões do site para recebê-las (o aviso continua aparecendo aqui e na aba Notificações).</p>
          )}
        </div>
      )}
      <div className="bg-gradient-to-r from-teal-600 to-teal-800 text-white rounded-2xl p-5 mb-4 shadow-md">
        <div className="text-xs uppercase tracking-wide text-teal-100 mb-3">Placar da clínica</div>
        <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
          <div>
            <div className="text-3xl font-bold">{placar.atendimentosSemana}</div>
            <div className="text-xs text-teal-100 mt-1">Atendimentos na semana</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.atendimentosMes}</div>
            <div className="text-xs text-teal-100 mt-1">Atendimentos no mês</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.taxaOcupacao.toFixed(0)}%</div>
            <div className="text-xs text-teal-100 mt-1">Taxa de ocupação (mês)</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.percentualDesmarcacao.toFixed(0)}%</div>
            <div className="text-xs text-teal-100 mt-1">Desmarcação (mês)</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.pacientesAtivos}</div>
            <div className="text-xs text-teal-100 mt-1">Pacientes ativos</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.pacientes2xSemana}</div>
            <div className="text-xs text-teal-100 mt-1">Pacientes com 2x/semana</div>
          </div>
        </div>
      </div>
      <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
        <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
          <button onClick={()=>setVisao("dia")} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (visao==="dia"?"bg-white shadow text-teal-700":"text-slate-500")}>Kanban do dia</button>
          <button onClick={()=>setVisao("semana")} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (visao==="semana"?"bg-white shadow text-teal-700":"text-slate-500")}>Agenda individual (semana)</button>
        </div>
        <BuscaRapidaBar placeholder="Buscar paciente por nome..." items={clients} getLabel={c=>c.nome} getSub={c=>c.telefone}
          onSelect={c=>onViewClientProfile(c)} />
      </div>
      <div className="flex items-center gap-2 mb-3">
        {visao==="semana" && (
          <select value={profissionalSemanaId} onChange={e=>setProfissionalSemanaId(e.target.value)}
            className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white font-medium text-slate-700">
            {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        )}
      </div>

      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <button onClick={()=>shiftDate(visao==="semana"?-7:-1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">←</button>
        <DateInput value={selectedDate} onChange={setSelectedDate} />
        <button onClick={()=>shiftDate(visao==="semana"?7:1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">→</button>
        {visao==="dia" ? (
          <>
            <span className="text-sm text-slate-500">{fmtDataBR(selectedDate)}</span>
            <button onClick={()=>onNewAppointment((profissionaisDoDia[0]||professionals[0])?.id)} className="px-3 py-2 text-sm font-medium rounded-lg bg-teal-600 text-white hover:bg-teal-700">+ Novo agendamento</button>
            <span className="text-xs text-slate-400">{profissionaisDoDia.length} de {professionals.length} profissionais atendem {fmtDataBR(selectedDate)} ({diaSemana})</span>
          </>
        ) : (
          <span className="text-sm text-slate-500">Semana de {fmtDataBR(getInicioSemana(selectedDate))} a {fmtDataBR(getFimSemana(selectedDate))}</span>
        )}
        <div className="ml-auto flex items-center gap-3 text-xs text-slate-500 flex-wrap">
          {Object.entries(STATUS_CONFIG).map(([k,v]) => (
            <span key={k} className="flex items-center gap-1"><span className={"w-2 h-2 rounded-full "+v.dot}></span>{v.label}</span>
          ))}
        </div>
      </div>

      {visao === "semana" && (
        profissionalDaSemana ? (
          <AgendaSemanalProfissional professional={profissionalDaSemana} appointments={appointments} clients={clients}
            weekStart={getInicioSemana(selectedDate)} onStatusChange={onStatusChange} onNewAppointment={onNewAppointment} />
        ) : (
          <div className="text-center text-sm text-slate-400 bg-white rounded-xl border border-slate-200 p-8">Nenhum profissional cadastrado.</div>
        )
      )}

      {visao === "dia" && (
      <>
      {profissionaisDoDia.length === 0 && (
        <div className="text-center text-sm text-slate-400 bg-white rounded-xl border border-slate-200 p-8">Nenhum profissional atende neste dia da semana ({diaSemana}).</div>
      )}

      <div className="flex gap-4 overflow-x-auto pb-4">
        {profissionaisDoDia.map(prof => (
          <div key={prof.id} className="kanban-col bg-slate-200/60 rounded-xl flex flex-col"
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{ e.preventDefault(); if(dragItem.current) onMoveProfessional(dragItem.current, prof.id); dragItem.current=null; }}>
            <div className="px-3 py-3 border-b border-slate-300">
              <div className="font-semibold text-slate-800 text-sm">{prof.nome}</div>
              <div className="text-xs text-slate-500">{prof.cargo} · {prof.conselho}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">{prof.dias.join(", ")} · {prof.horaInicio}–{prof.horaFim}</div>
              <button onClick={()=>onNewAppointment(prof.id)} className="mt-2 w-full text-xs font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-lg py-1.5">+ Novo agendamento</button>
            </div>
            <div className="p-2 flex flex-col gap-2 min-h-[200px]">
              {(apptsByProf[prof.id]||[]).length===0 && <div className="text-center text-xs text-slate-400 py-6">Sem agendamentos</div>}
              {(apptsByProf[prof.id]||[]).map(appt => {
                const cliente = clients.find(c=>c.id===appt.clienteId);
                const cfg = STATUS_CONFIG[appt.status];
                const sinal = getSinalizacao(appt, cliente, guias, fichas, appointments, vendas, produtos);
                const sinalCfg = sinal ? SINALIZACAO_CONFIG[sinal] : null;
                const guiaVinculada = appt.guiaId ? guias.find(g=>g.id===appt.guiaId) : null;
                const alertaGuia = guiaVinculada ? guiaAlertaSaldoOuValidade(guiaVinculada) : null;
                const vendaVinculada = appt.vendaId ? (vendas||[]).find(v=>v.id===appt.vendaId) : null;
                const produtoDaVenda = vendaVinculada ? (produtos||[]).find(p=>p.id===vendaVinculada.produtoId) : null;
                const totalSessoes = guiaVinculada ? guiaVinculada.quantidadeAutorizada : produtoDaVenda?.sessoesIncluidas || cliente?.sessoesTotal;
                const sessaoAtual = getSessaoAtual(appt, appointments);
                const opcoesStatus = STATUS_TRANSICOES[appt.status] || Object.keys(STATUS_CONFIG);
                return (
                  <div key={appt.id} draggable
                    onDragStart={()=>{dragItem.current = appt.id;}}
                    className="bg-white rounded-lg shadow-sm border border-slate-200 p-3 cursor-grab active:cursor-grabbing">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-800">{appt.hora}</span>
                      <span className="text-[11px] text-slate-400">{cliente ? `${sessaoAtual}/${totalSessoes ?? "-"}` : ""}</span>
                    </div>
                    <div className="text-sm text-slate-700 mt-0.5 truncate flex items-center gap-1.5">
                      {sinalCfg && <span title={sinalCfg.label} className={"inline-block w-2 h-2 rounded-full flex-shrink-0 " + sinalCfg.dot}></span>}
                      <span className="truncate">{cliente?.nome || "Cliente removido"}</span>
                      {(appt.tipo||"sessao")!=="sessao" && <span className="text-[9px] uppercase font-semibold text-purple-600 bg-purple-50 border border-purple-200 rounded px-1 flex-shrink-0">{TIPOS_AGENDAMENTO[appt.tipo]}</span>}
                    </div>
                    {guiaVinculada && (
                      <div className="text-[10px] text-slate-400 truncate mt-0.5" title={`Guia ${guiaVinculada.numeroGuia} — ${guiaVinculada.convenio}`}>
                        📋 {guiaVinculada.numeroGuia} · {guiaVinculada.convenio}
                      </div>
                    )}
                    {vendaVinculada && (
                      <div className="text-[10px] text-slate-400 truncate mt-0.5" title={`Compra de ${fmtDataBR(vendaVinculada.data)} — ${fmtBRL(vendaVinculada.valorFinal)}`}>
                        📦 {vendaVinculada.produtoNome} · {sessaoAtual}/{produtoDaVenda?.sessoesIncluidas||"?"}
                      </div>
                    )}
                    {podeVerValores && (Number(appt.valor)||0) > 0 && (
                      <div className="text-[10px] text-emerald-600 font-medium mt-0.5">{fmtBRL(appt.valor)} · {guiaVinculada ? "guia" : "particular"}</div>
                    )}
                    {alertaGuia && (
                      <div className="text-[10px] text-pink-600 font-medium truncate mt-0.5">⚠ {alertaGuia}</div>
                    )}
                    <select value={appt.status} onChange={e=>onStatusChange(appt, e.target.value)}
                      className={"mt-2 w-full text-xs font-medium border rounded-md px-2 py-1 " + cfg.badge}>
                      {opcoesStatus.map(k => <option key={k} value={k}>{STATUS_CONFIG[k].label}</option>)}
                    </select>
                    {cliente && onConfirmarChegada && opcoesStatus.includes("chegou") && appt.status !== "chegou" && (
                      <button onClick={()=>setApptChegadaBiometria(appt)}
                        className="mt-1.5 w-full text-[11px] font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-md py-1">
                        🔒 Confirmar chegada (digital)
                      </button>
                    )}
                    {cliente && onVenderProduto && (
                      <button onClick={()=>onVenderProduto(appt)}
                        className="mt-1.5 w-full text-[11px] font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-md py-1">
                        💰 Vender produto
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-4 text-[11px] text-slate-500 mt-2 flex-wrap">
        {Object.entries(SINALIZACAO_CONFIG).map(([k,v]) => (
          <span key={k} className="flex items-center gap-1"><span className={"w-2 h-2 rounded-full "+v.dot}></span>{v.label}</span>
        ))}
      </div>
      <p className="text-xs text-slate-400 mt-2">Dica: arraste um cartão para outra coluna para trocar o profissional responsável pela sessão.</p>
      </>
      )}
      {apptChegadaBiometria && (
        <BiometriaCaptureModal
          titulo="Confirmar chegada"
          subtitulo={`${clients.find(c=>c.id===apptChegadaBiometria.clienteId)?.nome || "Paciente"} — confirme a chegada com a digital.`}
          onClose={()=>setApptChegadaBiometria(null)}
          onConfirm={()=>{ onConfirmarChegada(apptChegadaBiometria); setApptChegadaBiometria(null); }}
        />
      )}
    </div>
  );
}

/* ---------------- Agenda individual semanal por profissional ---------------- */
function AgendaSemanalProfissional({professional, appointments, clients, weekStart, onStatusChange, onNewAppointment}) {
  const dias = Array.from({length:7}, (_,i) => addDays(weekStart, i));
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-3 mb-4">
      <div className="text-sm font-semibold text-slate-800 mb-0.5">{professional.nome}</div>
      <div className="text-xs text-slate-500 mb-3">{professional.cargo} · {(professional.dias||[]).join(", ")} · {professional.horaInicio}–{professional.horaFim}</div>
      <div className="grid grid-cols-1 md:grid-cols-7 gap-2">
        {dias.map(dia => {
          const diaSemana = getWeekdayLabel(dia);
          const atende = (professional.dias||[]).includes(diaSemana);
          const apptsDoDia = appointments.filter(a=>a.profissionalId===professional.id && a.data===dia).sort((a,b)=>a.hora.localeCompare(b.hora));
          return (
            <div key={dia} className={"rounded-lg border p-2 flex flex-col min-h-[180px] " + (atende ? "bg-slate-50 border-slate-200" : "bg-slate-100/60 border-slate-100")}>
              <div className="text-xs font-semibold text-slate-700">{diaSemana}</div>
              <div className="text-[10px] text-slate-400 mb-2">{fmtDataBR(dia)}</div>
              {!atende && apptsDoDia.length===0 && <div className="text-[10px] text-slate-400 text-center mt-6">Não atende</div>}
              <div className="flex-1 flex flex-col gap-1.5">
                {apptsDoDia.map(appt => {
                  const cliente = clients.find(c=>c.id===appt.clienteId);
                  const cfg = STATUS_CONFIG[appt.status];
                  const opcoesStatus = STATUS_TRANSICOES[appt.status] || Object.keys(STATUS_CONFIG);
                  return (
                    <div key={appt.id} className="bg-white rounded-md border border-slate-200 p-1.5">
                      <div className="text-[11px] font-medium text-slate-700 truncate">{appt.hora} · {cliente?.nome || "Cliente removido"}</div>
                      <select value={appt.status} onChange={e=>onStatusChange(appt, e.target.value)}
                        className={"mt-1 w-full text-[10px] font-medium border rounded px-1 py-0.5 " + cfg.badge}>
                        {opcoesStatus.map(k => <option key={k} value={k}>{STATUS_CONFIG[k].label}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
              <button onClick={()=>onNewAppointment(professional.id, dia)} className="mt-2 w-full text-[10px] font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded py-1">+ agendar</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Appointment Modal ---------------- */
function AppointmentModal({data, clients, professionals, guias, appointments, unidades, produtos, procedimentosTuss, convenios, vendas, currentUser, onClose, onSave, onVincularProduto}) {
  const [form, setForm] = useState({ tipo:"sessao", duracaoMin:50, unidadeId:unidades?.[0]?.id||"", permitirForaExpediente:false, confirmarExcecaoGuia:false, ...data });
  // Regra pedida explicitamente pelo usuário: usuário "profissional" (fisioterapeuta) não vê pagamentos/valores.
  // O valor continua sendo calculado e gravado automaticamente em segundo plano (useEffect abaixo) mesmo com o campo oculto.
  const podeVerValores = currentUser?.role !== "fisioterapeuta";
  const [valorEditadoManualmente, setValorEditadoManualmente] = useState((data?.valor||0) > 0);
  const clienteSelecionado = clients.find(c=>c.id===form.clienteId);
  const guiasDoCliente = guias.filter(g => g.clienteId===form.clienteId && g.status==="aberta" && g.quantidadeUtilizada < g.quantidadeAutorizada);
  const ehAvaliacao = (form.tipo||"sessao") === "avaliacao";
  const tipoPagamento = clienteSelecionado?.pagamento.tipo;
  const profissionalSelecionado = professionals.find(p=>p.id===form.profissionalId);
  const unidadesDoProfissional = (unidades||[]).filter(u => (profissionalSelecionado?.unidadeIds||[]).includes(u.id));

  // NOVO: sugestão automática de produto por especialidade do profissional — só sugere se o cliente
  // ainda não tem esse mesmo produto vinculado; nunca aplica sozinho, sempre exige clique manual.
  const [produtoSugeridoDispensado, setProdutoSugeridoDispensado] = useState(false);
  const produtoSugerido = useMemo(() => {
    if (!profissionalSelecionado?.cargo || !clienteSelecionado) return null;
    const cargo = profissionalSelecionado.cargo.toLowerCase();
    const match = (produtos||[]).find(p => p.ativo && p.especialidade && cargo.includes(p.especialidade.toLowerCase()));
    if (!match || clienteSelecionado.produtoId === match.id) return null;
    return match;
  }, [profissionalSelecionado, clienteSelecionado, produtos]);

  let pagamentoValido = true;
  let motivoInvalido = "";
  if (!ehAvaliacao && clienteSelecionado) {
    if (tipoPagamento === "convenio") {
      pagamentoValido = !!form.guiaId;
      motivoInvalido = "Selecione uma guia de convênio com sessões disponíveis para vincular o pagamento.";
    } else if (tipoPagamento === "particular") {
      // Regra pedida explicitamente pelo usuário: o valor da sessão precisa estar vinculado ao agendamento
      // (substitui a antiga confirmação por checkbox "pagamento confirmado" — ver campo Valor abaixo).
      pagamentoValido = (Number(form.valor)||0) > 0;
      motivoInvalido = "Informe o valor da sessão/pacote antes de agendar (ou marque o tipo como Avaliação).";
    }
    // bolsa: sempre válido, sem cobrança
  }

  // P0-2 (RN-5.1): guia sem saldo/vencida — aviso não bloqueia o agendamento em si (só o "Atendido"),
  // mas exige uma confirmação consciente aqui para evitar surpresa mais tarde.
  const guiaSelecionada = form.guiaId ? guias.find(g=>g.id===form.guiaId) : null;
  const bloqueioGuia = guiaSelecionada ? avaliarBloqueioGuia(guiaSelecionada) : null;

  // Compra de pacote vinculada (RN pedida explicitamente pelo usuário: "em novo agendamento para particular
  // ter a opção de selecionar o pagamento feito — compra do pacote"). Lista as compras (`vendas`) desse
  // cliente que ainda têm sessão disponível, para o usuário escolher qual pacote já pago essa sessão está
  // consumindo — só faz sentido para pagamento particular (convênio já usa a guia para isso).
  const comprasDoCliente = useMemo(() => {
    if (!clienteSelecionado) return [];
    return (vendas||[])
      .filter(v => v.clienteId === clienteSelecionado.id)
      .map(v => {
        const produto = (produtos||[]).find(p=>p.id===v.produtoId);
        const sessoesTotal = produto?.sessoesIncluidas || 0;
        const sessoesUsadas = (appointments||[]).filter(a => a.vendaId===v.id && a.status==="atendido").length;
        return { ...v, produto, sessoesTotal, sessoesUsadas, sessoesRestantes: sessoesTotal - sessoesUsadas };
      })
      // só pacotes de múltiplas sessões (não avulsos) com saldo disponível fazem sentido de selecionar aqui
      .filter(v => v.sessoesTotal > 1 && v.sessoesRestantes > 0)
      .sort((a,b) => b.data.localeCompare(a.data));
  }, [clienteSelecionado, vendas, produtos, appointments]);
  const compraSelecionada = form.vendaId ? comprasDoCliente.find(v=>v.id===form.vendaId) : null;

  // Valor vinculado ao agendamento (RN pedida explicitamente pelo usuário): sugere automaticamente o valor
  // da sessão a partir da tabela TUSS do convênio (quando há guia), da compra de pacote selecionada acima
  // (quando particular com pacote vinculado), ou do produto/pacote/valor do cliente (particular sem pacote
  // selecionado), mas sempre deixa o valor editável — o que fica gravado no agendamento (`form.valor`) é o
  // valor real, podendo divergir da tabela em casos negociados manualmente.
  const valorSugerido = useMemo(() => {
    if (ehAvaliacao || !clienteSelecionado) return 0;
    if (compraSelecionada) {
      return compraSelecionada.sessoesTotal>0
        ? Math.round((compraSelecionada.valorFinal / compraSelecionada.sessoesTotal) * 100) / 100
        : compraSelecionada.valorFinal;
    }
    // Passa valor:undefined para forçar o cálculo derivado (tabela TUSS/produto/valorSessao) em vez de
    // ecoar de volta o `form.valor` já preenchido — senão a sugestão nunca reagiria a trocas de guia/cliente.
    return precoDaSessao({...form, valor:undefined}, clienteSelecionado, guias, produtos, procedimentosTuss, convenios).valor;
  }, [ehAvaliacao, clienteSelecionado, compraSelecionada, form.guiaId, form.clienteId, guias, produtos, procedimentosTuss, convenios]);

  useEffect(() => {
    if (!valorEditadoManualmente) setForm(f => ({...f, valor: valorSugerido}));
  }, [valorSugerido, valorEditadoManualmente]);

  // P0-3 (RN-3.1): detecção de conflitos — sobreposição de profissional/cliente/sala é bloqueio duro;
  // fora do expediente é aviso com caminho de confirmação consciente.
  const conflitos = useMemo(() => form.profissionalId && form.data && form.hora
    ? detectarConflitos(form, appointments||[], professionals, clients, form.permitirForaExpediente)
    : [], [form.profissionalId, form.data, form.hora, form.duracaoMin, form.permitirForaExpediente, appointments, professionals, clients]);
  const conflitosDuros = conflitos.filter(c=>c.tipo!=="expediente");
  const conflitoExpediente = conflitos.find(c=>c.tipo==="expediente");
  const sugestoes = conflitosDuros.length>0 ? sugerirHorariosLivres(form.profissionalId, form.data, appointments||[], professionals, form.duracaoMin) : [];

  const podeSalvar = pagamentoValido && conflitosDuros.length===0 && (!bloqueioGuia || form.confirmarExcecaoGuia);

  function salvar(){
    if (!podeSalvar) return;
    onSave(form);
  }

  return (
    <Modal title="Novo agendamento" onClose={onClose}>
      <Field label="Cliente">
        <select className={inputCls} value={form.clienteId} onChange={e=>{ setValorEditadoManualmente(false); setForm({...form, clienteId:e.target.value, guiaId:"", vendaId:null, pagamentoVinculado:false, valor:0}); }}>
          {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        {/* RN pedida explicitamente pelo usuário: mostrar o convênio (ou particular/bolsa) do cliente logo
            ao selecioná-lo, sem precisar abrir o cadastro para saber como ele paga. */}
        {clienteSelecionado && (
          <p className="text-[11px] text-slate-500 mt-1">
            {tipoPagamento==="convenio"
              ? `📋 Convênio: ${clienteSelecionado.convenio || "—"}${clienteSelecionado.numeroCarteirinha ? ` · carteirinha ${clienteSelecionado.numeroCarteirinha}` : ""}`
              : tipoPagamento==="bolsa" ? "🎗️ Bolsa (sem cobrança)" : "💳 Particular"}
          </p>
        )}
      </Field>
      <Field label="Profissional">
        <select className={inputCls} value={form.profissionalId} onChange={e=>{
          const novoProf = professionals.find(p=>p.id===e.target.value);
          const novaUnidade = (novoProf?.unidadeIds||[]).includes(form.unidadeId) ? form.unidadeId : (novoProf?.unidadeIds?.[0]||form.unidadeId);
          setForm({...form, profissionalId:e.target.value, unidadeId:novaUnidade});
        }}>
          {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </Field>
      {produtoSugerido && !produtoSugeridoDispensado && (
        <div className="bg-teal-50 border border-teal-200 text-teal-800 text-xs rounded-lg p-2 mb-3 flex items-center justify-between gap-2 flex-wrap">
          <span>💡 Sugestão de produto para <strong>{profissionalSelecionado.cargo}</strong>: <strong>{produtoSugerido.nome}</strong> ({fmtBRL(produtoSugerido.precoBase)})</span>
          <div className="flex gap-2">
            <button type="button" onClick={()=>{ onVincularProduto(clienteSelecionado.id, produtoSugerido); setProdutoSugeridoDispensado(true); }}
              className="px-2 py-1 rounded-md bg-teal-600 text-white font-medium hover:bg-teal-700">Vincular ao cliente</button>
            <button type="button" onClick={()=>setProdutoSugeridoDispensado(true)} className="px-2 py-1 rounded-md border border-teal-300 hover:bg-teal-100">Ignorar</button>
          </div>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label="Tipo de agendamento">
          <select className={inputCls} value={form.tipo||"sessao"} onChange={e=>setForm({...form, tipo:e.target.value})}>
            {Object.entries(TIPOS_AGENDAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
          </select>
        </Field>
        <Field label="Unidade">
          <select className={inputCls} value={form.unidadeId||""} onChange={e=>setForm({...form, unidadeId:e.target.value})}>
            {(unidadesDoProfissional.length ? unidadesDoProfissional : (unidades||[])).map(u => <option key={u.id} value={u.id}>{u.nome}</option>)}
          </select>
        </Field>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <Field label="Data"><DateInput value={form.data} onChange={v=>setForm({...form, data:v})} /></Field>
        <Field label="Hora"><input type="time" className={inputCls} value={form.hora} onChange={e=>setForm({...form, hora:e.target.value})} /></Field>

// KPIs de clientes por período: ativos ao fim do período (começou até lá e não teve alta até lá),
// convênio vs particular entre os ativos, novos (dataInicio no período) e churn (alta no período).
function calcKpisClientes(clients, periodoInicio, periodoFim){
  const ativos = clients.filter(c => {
    const inicio = c.dataInicio || TODAY;
    if (inicio > periodoFim) return false;
    return !(c.alta && c.alta.data && c.alta.data <= periodoFim);
  });
  const pacientesConvenio = ativos.filter(c=>c.pagamento?.tipo==="convenio").length;
  const pacientesParticulares = ativos.filter(c=>c.pagamento?.tipo!=="convenio").length;
  const novosPacientes = clients.filter(c => c.dataInicio && c.dataInicio>=periodoInicio && c.dataInicio<=periodoFim).length;
  const churnClientes = clients.filter(c => c.alta && c.alta.data && c.alta.data>=periodoInicio && c.alta.data<=periodoFim).length;
  const baseInicioPeriodo = clients.filter(c => (c.dataInicio||TODAY) < periodoInicio && !(c.alta && c.alta.data && c.alta.data < periodoInicio)).length;
  const churnPercent = baseInicioPeriodo>0 ? (churnClientes/baseInicioPeriodo*100) : 0;
  return { pacientesAtivos: ativos.length, pacientesConvenio, pacientesParticulares, novosPacientes, churnClientes, churnPercent };
}

function ClientesKpiHeader({clients}) {
  const [modo, setModo] = useState("mes"); // mes | ano
  const [mesRef, setMesRef] = useState(TODAY.slice(0,7));
  const [anoRef, setAnoRef] = useState(TODAY.slice(0,4));

  const { periodoInicio, periodoFim } = useMemo(() => {
    if (modo === "ano") {
      return { periodoInicio: `${anoRef}-01-01`, periodoFim: `${anoRef}-12-31` };
    }
    const [ano, mes] = mesRef.split("-");
    const ultimoDia = new Date(Number(ano), Number(mes), 0).getDate();
    return { periodoInicio: `${mesRef}-01`, periodoFim: `${mesRef}-${String(ultimoDia).padStart(2,"0")}` };
  }, [modo, mesRef, anoRef]);

  const kpis = useMemo(() => calcKpisClientes(clients, periodoInicio, periodoFim), [clients, periodoInicio, periodoFim]);

  return (
    <div className="mb-4">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
          <button onClick={()=>setModo("mes")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="mes"?"bg-white shadow text-teal-700":"text-slate-500")}>Por mês</button>
          <button onClick={()=>setModo("ano")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="ano"?"bg-white shadow text-teal-700":"text-slate-500")}>Por ano</button>
        </div>
        {modo==="mes" ? (
          <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white" />
        ) : (
          <input type="number" value={anoRef} onChange={e=>setAnoRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white w-24" />
        )}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <KpiCard label="Pacientes ativos" value={kpis.pacientesAtivos} tone="teal" />
        <KpiCard label="Pacientes de convênio" value={kpis.pacientesConvenio} />
        <KpiCard label="Pacientes particulares" value={kpis.pacientesParticulares} />
        <KpiCard label="Novos pacientes" value={kpis.novosPacientes} tone="green" />
        <KpiCard label="Churn" value={kpis.churnClientes} tone={kpis.churnClientes>0?"red":"default"} sub={`${kpis.churnPercent.toFixed(1)}% da base do período`} />
      </div>
    </div>
  );
}

    return map;

  // analizar clientes por convenios diferentes de acordo com o selecionado, bem como os particulares").
  // A lista de convênios é dinâmica — sai direto dos clientes cadastrados, não de um cadastro fixo, então
  // some/aparece sozinha conforme a carteira de pacientes muda.
  const [subAba, setSubAba] = useState("todos"); // "todos" | "particulares" | nome do convênio

// Modal "Gerar link de cadastro" (RN pedida explicitamente pelo usuário): mostra a URL pública que a
// recepção/gestão envia ao paciente (WhatsApp, e-mail etc.) para ele preencher o cadastro sozinho.
// A URL é a própria origem do app + "?cadastro=1", que o AuthGate detecta e roteia para
// CadastroPublicoPage sem exigir login — ver nota de limitação (mesmo navegador/dispositivo) lá.
function LinkCadastroModal({onClose}) {
  const [copiado, setCopiado] = useState(false);
  const url = `${window.location.origin}${window.location.pathname}?cadastro=1`;

  function copiar(){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(()=>{ setCopiado(true); setTimeout(()=>setCopiado(false), 2000); });
    }
  }

  return (
    <Modal onClose={onClose} title="Link de cadastro do paciente">
      <div className="space-y-4">
        <p className="text-sm text-slate-600">
          Envie este link para o paciente (WhatsApp, e-mail, SMS). Ele vai preencher os dados e enviar os
          documentos exigidos pelo convênio sozinho — sem precisar de login.
        </p>
        <div className="flex items-center gap-2">
          <input readOnly value={url} className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 text-slate-600" onFocus={e=>e.target.select()} />
          <button onClick={copiar} className="px-3 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 whitespace-nowrap">
            {copiado ? "Copiado!" : "Copiar"}
          </button>
        </div>
        <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3 text-xs">
          <strong>Limitação deste protótipo:</strong> o cadastro feito pelo paciente só aparece automaticamente
          na lista de clientes se o link for aberto neste mesmo navegador/computador. Em um paciente real usando
          o celular dele, o sistema precisaria de um banco de dados compartilhado (já planejado, ainda não
          implementado) para sincronizar entre dispositivos.
        </div>
        <div className="flex justify-end">
          <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">Fechar</button>
        </div>
      </div>
    </Modal>
  );
}

function ImportClientesModal({onClose, onImportar}) {
  const [registros, setRegistros] = useState([]);
  const [erro, setErro] = useState("");
  const [nomeArquivo, setNomeArquivo] = useState("");
  const [mostrarTexto, setMostrarTexto] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const textareaRef = useRef(null);

  function baixarModelo(){
    baixarArquivo("modelo_importacao_pacientes.csv", MODELO_CLIENTES_CSV, "text/csv");
  }

  function copiarModelo(){
    const ta = textareaRef.current;
    if (ta) {
      ta.focus(); ta.select();
      try { document.execCommand("copy"); setCopiado(true); setTimeout(()=>setCopiado(false), 2000); }
      catch (e) { window.alert("Não foi possível copiar automaticamente — selecione o texto manualmente (Cmd+A, Cmd+C)."); }
    }
  }

  function handleFile(e){
    const file = e.target.files[0];
    if (!file) return;
    setNomeArquivo(file.name);
    const reader = new FileReader();
    reader.onload = (ev) => {
      const { erro: err, registros: regs } = parseClientesCSV(String(ev.target.result || ""));
      if (err) { setErro(err); setRegistros([]); }
      else if (regs.length === 0) { setErro("Nenhuma linha com nome preenchido foi encontrada no arquivo."); setRegistros([]); }
      else { setErro(""); setRegistros(regs); }
    };
    reader.readAsText(file, "UTF-8");
  }

  return (
    <Modal title="Importar pacientes em lote (CSV)" onClose={onClose} wide>
      <div className="bg-slate-50 rounded-lg p-3 mb-3 text-xs text-slate-600">
        <p className="mb-2">Baixe o modelo CSV, preencha nome, CPF, convênio, e-mail e telefone para cada paciente (uma linha por pessoa) e envie o arquivo preenchido de volta aqui. Pacientes com CPF já cadastrado são atualizados; os demais são criados.</p>
        <div className="flex flex-wrap gap-2 items-center">
          <button type="button" onClick={baixarModelo} className="px-3 py-1.5 text-xs rounded-lg border border-teal-300 text-teal-700 hover:bg-teal-50">Baixar modelo CSV</button>
          <button type="button" onClick={()=>setMostrarTexto(v=>!v)} className="px-3 py-1.5 text-xs rounded-lg border border-slate-300 text-slate-600 hover:bg-white">{mostrarTexto ? "Ocultar" : "Não abriu? Ver/copiar o texto do modelo"}</button>
        </div>
        {mostrarTexto && (
          <div className="mt-2">
            <p className="text-[11px] text-slate-500 mb-1">Selecione tudo e copie, cole em uma planilha (Excel, Numbers, Google Sheets) ou editor de texto e salve/exporte o arquivo com extensão <code>.csv</code>. A primeira linha é o cabeçalho (nome,cpf,convenio,email,telefone) — as colunas podem vir em qualquer ordem, desde que os nomes do cabeçalho sejam mantidos.</p>
            <textarea ref={textareaRef} readOnly rows={4} value={MODELO_CLIENTES_CSV} onClick={e=>e.target.select()}
              className="w-full font-mono text-[11px] border border-slate-300 rounded-lg p-2 bg-white" />
            <button type="button" onClick={copiarModelo} className="mt-1 px-3 py-1.5 text-xs rounded-lg bg-teal-600 text-white hover:bg-teal-700">{copiado ? "Copiado!" : "Copiar texto"}</button>
          </div>
        )}
      </div>
      <Field label="Selecionar arquivo CSV preenchido">
        <input type="file" accept=".csv,text/csv" onChange={handleFile} className={inputCls} />
      </Field>
      {nomeArquivo && <p className="text-[11px] text-slate-400 mb-2">Arquivo selecionado: {nomeArquivo}</p>}
      {erro && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-2 mb-3">⚠ {erro}</div>}
      {registros.length > 0 && (
        <div className="mb-3">
          <p className="text-xs text-slate-500 mb-2">{registros.length} paciente(s) encontrado(s) neste arquivo.</p>
          <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto max-h-56 overflow-y-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0">
                <tr><th className="text-left px-3 py-2">Nome</th><th className="text-left px-3 py-2">CPF</th><th className="text-left px-3 py-2">Convênio</th><th className="text-left px-3 py-2">E-mail</th><th className="text-left px-3 py-2">Telefone</th></tr>
              </thead>
              <tbody>
                {registros.map((r,i) => (
                  <tr key={i} className="border-t border-slate-100">
                    <td className="px-3 py-2 font-medium text-slate-800">{r.nome}</td>
                    <td className="px-3 py-2 text-slate-500">{r.cpf || "—"}</td>
                    <td className="px-3 py-2 text-slate-500">{r.convenio || "—"}</td>
                    <td className="px-3 py-2 text-slate-500">{r.email || "—"}</td>
                    <td className="px-3 py-2 text-slate-500">{r.telefone || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button disabled={registros.length===0} onClick={()=>{ onImportar(registros); onClose(); }}
          className={"px-4 py-2 text-sm rounded-lg text-white " + (registros.length>0 ? "bg-teal-600 hover:bg-teal-700" : "bg-slate-300 cursor-not-allowed")}>
          Confirmar e importar{registros.length>0 ? ` (${registros.length})` : ""}
        </button>
      </div>
    </Modal>
  );
}

// Evolução de uma sessão específica (RN pedida explicitamente pelo usuário: toda sessão realizada precisa
// de uma evolução registrada depois). Gerencia seu próprio texto local para poder editar sem afetar as
// outras linhas; salva imediatamente ao clicar (não depende do botão "Salvar" do cadastro do cliente).
function EvolucaoRow({appt, professionals, onSalvar}){
  const [texto, setTexto] = useState(appt.evolucaoTexto || "");
  const [editando, setEditando] = useState(!appt.evolucaoTexto);
  const profissional = professionals.find(p=>p.id===appt.profissionalId);
  const pendente = evolucaoPendente(appt);
  return (
    <div className={"rounded-lg border p-3 " + (pendente ? "border-orange-300 bg-orange-50" : "border-slate-200 bg-white")}>
      <div className="flex items-center justify-between mb-1.5 flex-wrap gap-1">
        <span className="text-sm font-medium text-slate-700">{fmtDataBR(appt.data)} {appt.hora} — {profissional?.nome || "—"}</span>
        {pendente ? (
          <span className="text-[10px] font-semibold text-orange-700 bg-orange-100 rounded-full px-2 py-0.5">Pendente</span>
        ) : (
          <span className="text-[10px] font-semibold text-green-700 bg-green-100 rounded-full px-2 py-0.5">Registrada{appt.evolucaoRegistradaEm ? ` em ${fmtDataBR(appt.evolucaoRegistradaEm)}` : ""}</span>
        )}
      </div>
      {editando ? (
        <>
          <textarea rows={3} className={inputCls + " resize-y"} value={texto} onChange={e=>setTexto(e.target.value)}
            placeholder="Como foi a sessão: evolução do quadro, dor, resposta ao tratamento, orientações..." />
          <div className="flex justify-end gap-2 mt-2">
            {appt.evolucaoTexto && <button type="button" onClick={()=>{ setTexto(appt.evolucaoTexto); setEditando(false); }} className="text-xs text-slate-500 hover:underline">Cancelar</button>}
            <button type="button" disabled={!texto.trim()} onClick={()=>{ onSalvar(appt.id, texto.trim()); setEditando(false); }}
              className="px-3 py-1.5 text-xs rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed">Salvar evolução</button>
          </div>
        </>
      ) : (
        <div className="flex items-start justify-between gap-2">
          <p className="text-sm text-slate-600 whitespace-pre-wrap">{appt.evolucaoTexto}</p>
          <button type="button" onClick={()=>setEditando(true)} className="text-xs text-teal-600 hover:underline flex-shrink-0">Editar</button>
        </div>
      )}
    </div>
  );
}

function ClientModal({data, abaInicial, professionals, convenios, produtos, fichas, modelosFicha, appointments, currentUser, onClose, onSave, onSalvarEvolucao}) {
  const [form, setForm] = useState(data);
  const [modalCadastroBiometria, setModalCadastroBiometria] = useState(false);
  const [descontoAutorizado, setDescontoAutorizado] = useState(false);
  const [modalAutorizarDesconto, setModalAutorizarDesconto] = useState(false);
  function toggleProf(id){
    setForm(f => ({...f, profissionaisIds: f.profissionaisIds.includes(id) ? f.profissionaisIds.filter(x=>x!==id) : [...f.profissionaisIds, id]}));
  }
  const convenioSelecionadoId = (convenios||[]).find(c => c.nome === form.convenio)?.id || "";
  const produtoSelecionado = (produtos||[]).find(p => p.id === form.produtoId) || null;
  const descontoMin = produtoSelecionado ? (produtoSelecionado.descontoMinimoPercent||0) : 0;
  const descontoMax = produtoSelecionado ? produtoSelecionado.descontoMaximoPercent : 100;
  const parcelasMax = produtoSelecionado ? produtoSelecionado.parcelasMaximas : 12;
  const valorFinalProduto = produtoSelecionado ? produtoSelecionado.precoBase * (1 - (Number(form.descontoAplicado)||0)/100) : null;
  // Desconto fora da faixa mín.–máx. do produto exige autorização do gestor (senha) antes de poder salvar.
  const descontoForaDaFaixa = !!produtoSelecionado && ((Number(form.descontoAplicado)||0) > descontoMax || (Number(form.descontoAplicado)||0) < descontoMin);
  // Regra pedida explicitamente pelo usuário: usuário "profissional" (fisioterapeuta) não vê pagamentos/valores.
  const podeVerValores = currentUser?.role !== "fisioterapeuta";
  // LGPD (feature nova: link público de cadastro): documentos enviados pelo paciente (pedido médico,
  // carteirinha, RG/CPF) só ficam acessíveis para quem vai de fato usá-los para solicitar a guia —
  // faturamento e o gestor. Minimização de dados: recepção, fisioterapeuta etc. não veem esses anexos.
  const podeVerDocumentosSensiveis = currentUser?.role === "admin" || currentUser?.role === "faturamento";
  const documentosDoCliente = data.documentosAnexados || [];
  // RN pedida explicitamente pelo usuário: mostrar as fichas clínicas do cliente aqui no próprio cadastro
  // (só faz sentido para cliente já existente — um cliente novo ainda não tem ficha nenhuma). Lista somativa
  // e só leitura (criar/editar ficha continua sendo feito pela aba Fichas Clínicas).
  const fichasDoCliente = (data.id && fichas) ? fichas.filter(f=>f.clienteId===data.id).sort((a,b)=>b.data.localeCompare(a.data)) : [];
  // RN pedida explicitamente pelo usuário: aba "Evolução" com as sessões já realizadas deste cliente,
  // cada uma precisando de uma evolução registrada depois — ver EvolucaoRow acima.
  const sessoesAtendidasDoCliente = (data.id && appointments)
    ? appointments.filter(a=>a.clienteId===data.id && a.status==="atendido").sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora))
    : [];
  const evolucoesPendentesCliente = sessoesAtendidasDoCliente.filter(evolucaoPendente).length;

  const abas = [
    {id:"dados", label:"Dados gerais"},
    {id:"observacoes", label:"Observações"},
    ...(data.id ? [{id:"fichas", label:"Fichas clínicas"}] : []),
    ...(data.id ? [{id:"evolucao", label:"Evolução"}] : []),
    ...(data.id && podeVerDocumentosSensiveis ? [{id:"documentos", label:"Documentos"}] : []),
  ];
  const [aba, setAba] = useState(abaInicial && abas.some(a=>a.id===abaInicial) ? abaInicial : "dados");

  return (
    <Modal title={data.id ? "Editar cliente" : "Novo cliente"} onClose={onClose} wide>
      <div className="flex gap-1 bg-slate-100 rounded-lg p-1 mb-4 w-fit">
        {abas.map(a => (
          <button type="button" key={a.id} onClick={()=>setAba(a.id)}
            className={"px-3 py-1.5 rounded-md text-xs font-medium transition " + (aba===a.id ? "bg-white shadow text-teal-700" : "text-slate-500 hover:text-slate-700")}>
            {a.label}
            {a.id==="evolucao" && evolucoesPendentesCliente>0 && (
              <span className="ml-1.5 inline-flex items-center justify-center bg-orange-500 text-white text-[9px] font-semibold rounded-full min-w-[15px] h-[15px] px-1 align-middle">{evolucoesPendentesCliente}</span>
            )}
          </button>
        ))}
      </div>

      {aba === "dados" && (
      <>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Nome completo"><input className={inputCls} value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
        <Field label="Telefone"><input className={inputCls} value={form.telefone} onChange={e=>setForm({...form,telefone:e.target.value})} /></Field>
        <Field label="E-mail"><input type="email" className={inputCls} value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})} /></Field>
        <Field label="Endereço"><input className={inputCls} value={form.endereco} onChange={e=>setForm({...form,endereco:e.target.value})} /></Field>
        <Field label="Data de nascimento"><DateInput value={form.dataNascimento} onChange={v=>setForm({...form,dataNascimento:v})} /></Field>
        <Field label="CPF"><input className={inputCls} value={form.cpf} onChange={e=>setForm({...form,cpf:e.target.value})} /></Field>
        <Field label="Nº carteirinha/matrícula (convênio)"><input className={inputCls} value={form.numeroCarteirinha||""} onChange={e=>setForm({...form,numeroCarteirinha:e.target.value})} placeholder="Necessário para faturamento TISS" /></Field>
        <Field label="Convênio médico">
          <SearchSelect
            placeholder="Digite o nome do convênio e busque..."
            items={(convenios||[]).filter(c=>c.ativo)}
            getLabel={c=>c.nome}
            getSub={c=>c.registroANS ? `ANS ${c.registroANS}` : null}
            value={convenioSelecionadoId}
            onSelect={c=>setForm({...form, convenio:c.nome})}
            onClear={()=>setForm({...form, convenio:""})}
          />
        </Field>
        <Field label="Forma de pagamento">
          <select className={inputCls} value={form.pagamento.tipo} onChange={e=>setForm({...form,pagamento:{...form.pagamento, tipo:e.target.value}})}>
            <option value="convenio">Guia de convênio</option>
            <option value="particular">Particular</option>
            <option value="bolsa">Bolsa</option>
          </select>
        </Field>
        {form.pagamento.tipo==="convenio" && (
          <Field label="Número da guia"><input className={inputCls} value={form.pagamento.numeroGuia||""} onChange={e=>setForm({...form,pagamento:{...form.pagamento, numeroGuia:e.target.value}})} /></Field>
        )}
        <Field label="Médico responsável"><input className={inputCls} value={form.medico} onChange={e=>setForm({...form,medico:e.target.value})} /></Field>
        <Field label="Telefone de emergência"><input className={inputCls} value={form.telefoneEmergencia} onChange={e=>setForm({...form,telefoneEmergencia:e.target.value})} /></Field>
        <Field label="Tratamento"><input className={inputCls} value={form.tratamento} onChange={e=>setForm({...form,tratamento:e.target.value})} /></Field>
        <Field label="Nome do pacote"><input className={inputCls} value={form.pacoteNome} onChange={e=>setForm({...form,pacoteNome:e.target.value})} /></Field>
        <Field label="Total de sessões do pacote"><input type="number" className={inputCls} value={form.sessoesTotal} onChange={e=>setForm({...form,sessoesTotal:Number(e.target.value)})} /></Field>
        {podeVerValores && (
          <Field label="Valor por sessão (R$)"><MoneyInput className={inputCls} value={form.valorSessao} onChange={v=>setForm({...form,valorSessao:v})} /></Field>
        )}
        <Field label="Data de início"><DateInput value={form.dataInicio} onChange={v=>setForm({...form,dataInicio:v})} /></Field>
      </div>

      {podeVerValores && (
      <>
      <div className="border-t border-slate-100 pt-3 mt-1 mb-3">
        <span className="text-sm font-medium text-slate-700 mb-2 block">Produto/serviço vinculado (catálogo de vendas)</span>
        <Field label="">
          <SearchSelect
            placeholder="Digite o nome do pacote/produto e busque..."
            items={(produtos||[]).filter(p=>p.ativo)}
            getLabel={p=>p.nome}
            getSub={p=>fmtBRL(p.precoBase)}
            value={form.produtoId||""}
            onSelect={p=>{ setForm({...form,
              produtoId:p.id,
              pacoteNome:p.nome,
              sessoesTotal:p.sessoesIncluidas||form.sessoesTotal,
              valorSessao:p.sessoesIncluidas>0 ? Math.round((p.precoBase/p.sessoesIncluidas)*100)/100 : p.precoBase,
              descontoAplicado:0, parcelas:1, formaPagamentoProduto:form.formaPagamentoProduto||"cartao_credito",
            }); setDescontoAutorizado(false); }}
            onClear={()=>{ setForm({...form, produtoId:null}); setDescontoAutorizado(false); }}
          />
        </Field>
        {produtoSelecionado && (
          <>
            <div className="grid grid-cols-4 gap-x-4 bg-slate-50 rounded-lg p-3 mt-2">
              <Field label={`Desconto aplicado (% — faixa ${descontoMin}%–${descontoMax}%)`}>
                <input type="number" min="0" className={inputCls} value={form.descontoAplicado||0}
                  onChange={e=>{
                    setForm({...form, descontoAplicado:Number(e.target.value)});
                    setDescontoAutorizado(false);
                  }} />
              </Field>
              <Field label="Forma de pagamento">
                <select className={inputCls} value={form.formaPagamentoProduto||"cartao_credito"} onChange={e=>{
                  const novaForma = e.target.value;
                  setForm({...form, formaPagamentoProduto:novaForma, parcelas: novaForma==="cartao_credito" ? (form.parcelas||1) : 1});
                }}>
                  {Object.entries(FORMAS_PAGAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
                </select>
              </Field>
              {/* Regra pedida explicitamente pelo usuário: número de parcelas só faz sentido/aparece
                  quando a forma de pagamento é cartão de crédito — outras formas ficam "à vista". */}
              {(form.formaPagamentoProduto||"cartao_credito")==="cartao_credito" ? (
                <Field label={`Parcelas (máx. ${parcelasMax}x)`}>
                  <select className={inputCls} value={form.parcelas||1} onChange={e=>setForm({...form, parcelas:Number(e.target.value)})}>
                    {Array.from({length:parcelasMax}, (_,i)=>i+1).map(n => <option key={n} value={n}>{n}x</option>)}
                  </select>
                </Field>
              ) : (
                <Field label="Parcelas">
                  <div className="px-3 py-2 text-sm text-slate-400">À vista</div>
                </Field>
              )}
              <Field label="Valor final">
                <div className="px-3 py-2 text-sm font-semibold text-teal-700">{fmtBRL(valorFinalProduto)}</div>
              </Field>
            </div>
            {descontoForaDaFaixa && (
              <div className={"flex items-center justify-between gap-3 rounded-lg p-3 mt-2 text-xs " + (descontoAutorizado ? "bg-green-50 border border-green-200 text-green-700" : "bg-amber-50 border border-amber-200 text-amber-700")}>
                {descontoAutorizado ? (
                  <span>✓ Desconto fora da faixa autorizado pelo gestor. Pode salvar.</span>
                ) : (
                  <>
                    <span>Desconto fora da faixa permitida ({descontoMin}%–{descontoMax}%) para este produto. É necessária autorização do gestor para salvar.</span>
                    <button type="button" onClick={()=>setModalAutorizarDesconto(true)} className="px-3 py-1.5 rounded-lg bg-amber-600 text-white hover:bg-amber-700 flex-shrink-0 whitespace-nowrap">Solicitar autorização</button>
                  </>
                )}
              </div>
            )}
          </>
        )}
      </div>
      {modalAutorizarDesconto && (
        <AutorizarDescontoModal produtoNome={produtoSelecionado?.nome} descontoSolicitado={Number(form.descontoAplicado)||0} descontoMin={descontoMin} descontoMax={descontoMax} currentUser={currentUser}
          onClose={()=>setModalAutorizarDesconto(false)}
          onAutorizado={()=>{ setDescontoAutorizado(true); setModalAutorizarDesconto(false); }} />
      )}
      </>
      )}

      <Field label="Profissionais que atendem">
        <div className="flex flex-wrap gap-2">
          {professionals.map(p => (
            <button type="button" key={p.id} onClick={()=>toggleProf(p.id)}
              className={"px-3 py-1.5 rounded-full text-xs border " + (form.profissionaisIds.includes(p.id) ? "bg-teal-600 text-white border-teal-600" : "bg-white text-slate-600 border-slate-300")}>
              {p.nome}
            </button>
          ))}
        </div>
      </Field>

      <div className="border-t border-slate-100 pt-3 mt-1">
        <div className="flex items-center justify-between mb-2">
          <span className="text-sm font-medium text-slate-700">Horários fixos (agendamentos recorrentes)</span>
          <button type="button"
            onClick={()=>setForm({...form, horariosFixos:[...(form.horariosFixos||[]), {id:"hf"+Date.now(), ativo:true, profissionalId:form.profissionaisIds[0]||professionals[0]?.id||"", diaSemana:DIAS_SEMANA[0], hora:"09:00", dataTermino:null}]})}
            className="px-2 py-1 text-xs rounded-lg border border-teal-300 text-teal-700 hover:bg-teal-50">+ Adicionar horário fixo</button>
        </div>
        <p className="text-[11px] text-slate-400 mb-2">Um cliente pode ter mais de um horário fixo — inclusive com profissionais diferentes (ex.: Pilates com um profissional e RPG com outro).</p>
        {(form.horariosFixos||[]).length === 0 && (
          <p className="text-xs text-slate-400 italic mb-2">Nenhum horário fixo cadastrado.</p>
        )}
        <div className="space-y-2">
          {(form.horariosFixos||[]).map((hf, idx) => (
            <div key={hf.id||idx} className="grid grid-cols-5 gap-x-3 items-end bg-slate-50 rounded-lg p-3">
              <Field label="Profissional">
                <select className={inputCls} value={hf.profissionalId} onChange={e=>{
                  const atualizados = form.horariosFixos.map((h,i)=> i===idx ? {...h, profissionalId:e.target.value} : h);
                  setForm({...form, horariosFixos:atualizados});
                }}>
                  {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
                </select>
              </Field>
              <Field label="Dia da semana">
                <select className={inputCls} value={hf.diaSemana} onChange={e=>{
                  const atualizados = form.horariosFixos.map((h,i)=> i===idx ? {...h, diaSemana:e.target.value} : h);
                  setForm({...form, horariosFixos:atualizados});
                }}>
                  {DIAS_SEMANA.map(d => <option key={d} value={d}>{d}</option>)}
                </select>
              </Field>
              <Field label="Horário">
                <input type="time" className={inputCls} value={hf.hora} onChange={e=>{
                  const atualizados = form.horariosFixos.map((h,i)=> i===idx ? {...h, hora:e.target.value} : h);
                  setForm({...form, horariosFixos:atualizados});
                }} />
              </Field>
              <Field label="Término (opcional)">
                <DateInput value={hf.dataTermino||""} onChange={v=>{
                  const atualizados = form.horariosFixos.map((h,i)=> i===idx ? {...h, dataTermino:v||null} : h);
                  setForm({...form, horariosFixos:atualizados});
                }} />
              </Field>
              <div className="flex items-center gap-2 pb-2">
                <label className="flex items-center gap-1 text-xs text-slate-600">
                  <input type="checkbox" checked={!!hf.ativo} onChange={e=>{
                    const atualizados = form.horariosFixos.map((h,i)=> i===idx ? {...h, ativo:e.target.checked} : h);
                    setForm({...form, horariosFixos:atualizados});
                  }} /> Ativo
                </label>
                <button type="button" onClick={()=>{
                  const atualizados = form.horariosFixos.filter((h,i)=> i!==idx);
                  setForm({...form, horariosFixos:atualizados});
                }} className="text-red-600 text-xs hover:underline">Remover</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="border-t border-slate-100 pt-3 mt-2 mb-1"><span className="text-sm font-medium text-slate-700">Biometria (confirmação de chegada)</span></div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <Field label="Digital cadastrada">
          {form.biometriaCadastrada ? (
            <div className="flex items-center gap-2 h-[38px]">
              <span className="text-xs text-green-700 bg-green-50 border border-green-200 rounded-lg px-2 py-2 flex-1 text-center">✓ Digital cadastrada</span>
              <button type="button" onClick={()=>setForm({...form, biometriaCadastrada:false})} className="text-[11px] text-red-600 hover:underline flex-shrink-0">Remover</button>
            </div>
          ) : (
            <button type="button" onClick={()=>setModalCadastroBiometria(true)} className="w-full h-[38px] text-xs font-medium rounded-lg border border-teal-300 text-teal-700 bg-teal-50 hover:bg-teal-100">🔒 Cadastrar digital</button>
          )}
        </Field>
      </div>
      <p className="text-[11px] text-slate-400 -mt-2 mb-3">Com a digital cadastrada, o paciente pode confirmar a chegada sozinho no leitor de biometria (mesmo mecanismo do ponto dos profissionais). Pode ser cadastrada pelo computador (simulada) ou pelo leitor biométrico do dispositivo.</p>
      {modalCadastroBiometria && (
        <CadastroBiometriaModal nome={form.nome} onClose={()=>setModalCadastroBiometria(false)}
          onCadastrado={()=>{ setForm({...form, biometriaCadastrada:true}); setModalCadastroBiometria(false); }} />
      )}
      </>
      )}

      {aba === "observacoes" && (
        <Field label="">
          <textarea rows={10} className={inputCls + " resize-y"} value={form.observacoes||""}
            onChange={e=>setForm({...form, observacoes:e.target.value})}
            placeholder="Anotações gerais sobre o paciente: restrições, preferências, alertas, etc." />
        </Field>
      )}

/* ---------------- Perfil do cliente ---------------- */
function calcPerfilCliente(cliente, appointments, professionals, guias, produtos, procedimentosTuss, convenios){
  const apptsCliente = appointments.filter(a=>a.clienteId===cliente.id).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const confirmados = apptsCliente.filter(a=>a.status==="atendido");
  // Regra pedida explicitamente pelo usuário: o valor de cada sessão é o valor vinculado a ela (particular
  // ou guia), não um valor fixo do cadastro atual do cliente — evita que o LTV mude retroativamente se o
  // cadastro (valorSessao/produto) for alterado depois. `precoDaSessao` já faz o fallback para agendamentos
  // antigos sem `valor` gravado.
  const ltv = confirmados.reduce((s,a) => s + precoDaSessao(a, cliente, guias||[], produtos||[], procedimentosTuss||[], convenios||[]).valor, 0);
  const especialidades = [...new Set(apptsCliente.map(a => professionals.find(p=>p.id===a.profissionalId)?.cargo).filter(Boolean))];
  const profissionaisVistos = [...new Set(apptsCliente.map(a => professionals.find(p=>p.id===a.profissionalId)?.nome).filter(Boolean))];
  const hoje = new Date(TODAY + "T00:00:00");
  const inicio = new Date((cliente.dataInicio || TODAY) + "T00:00:00");
  const semanas = Math.max(1, (hoje - inicio) / (7*86400000));
  const frequenciaSemanal = confirmados.length / semanas;
  const faltas = apptsCliente.filter(a=>a.status==="faltou").length;
  const desmarcacoes = apptsCliente.filter(a=>a.status==="desmarcado").length;
  return { apptsCliente, confirmados, ltv, especialidades, profissionaisVistos, frequenciaSemanal, faltas, desmarcacoes };
}

function ProfessionalDashboard({professionals, appointments, clients, fichas}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const mesAtualNum = Number(TODAY.slice(5,7));
  const [ano, setAno] = useState(anoAtual);
  const [mes, setMes] = useState(mesAtualNum); // 0 = compilado (ano todo)
  const anos = [anoAtual-1, anoAtual, anoAtual+1];
  const periodoTipo = mes ? "mes" : "ano";
  const anterior = periodoAnterior(ano, mes);
  const anteriorTipo = anterior.mes ? "mes" : "ano";

  const apptsPeriodoTodos = useMemo(() => appointments.filter(a=>noPeriodo(a.data, periodoTipo, mes, ano)), [appointments, periodoTipo, mes, ano]);
  const totalAgendaClinicaPeriodo = apptsPeriodoTodos.length;

  const linhas = useMemo(() => professionals.map(prof => {
    const apptsProf = appointments.filter(a=>a.profissionalId===prof.id);
    const apptsProfPeriodo = apptsPeriodoTodos.filter(a=>a.profissionalId===prof.id);
    const apptsProfAnterior = apptsProf.filter(a=>noPeriodo(a.data, anteriorTipo, anterior.mes, anterior.ano));
    const confirmadosPeriodo = apptsProfPeriodo.filter(a=>a.status==="atendido");
    const avaliacoesMes = apptsProfPeriodo.filter(a=>(a.tipo||"sessao")==="avaliacao").length;
    const desmarcadosMes = apptsProfPeriodo.filter(a=>a.status==="desmarcado").length;
    const faltasMes = apptsProfPeriodo.filter(a=>a.status==="faltou").length;
    const evolucoesAtraso = apptsProf.filter(a=>isEvolucaoAtrasada(a)).length;
    const pacientesUnicos = new Set(apptsProf.map(a=>a.clienteId)).size;
    const faturamentoMes = confirmadosPeriodo.reduce((s,a) => { const c = clients.find(cl=>cl.id===a.clienteId); return s + (c?.valorSessao||0); }, 0);
    const comissao = prof.comissaoTipo === "fixo"
      ? confirmadosPeriodo.length * (prof.comissaoValorSessao||0)
      : prof.comissaoTipo === "salario"
      ? (prof.salarioFixoMensal||0) + (prof.bonusMensal||0)
      : faturamentoMes * (prof.comissaoPercentual||0) / 100;
    const custoTotal = comissao + (prof.custoFixoMensal||0);
    const roi = custoTotal > 0 ? ((faturamentoMes - custoTotal) / custoTotal) * 100 : null;
    const horasDisponiveisPeriodo = (prof.dias?.length||0) * horasEntre(prof.horaInicio, prof.horaFim) * (mes ? 4.33 : 52);
    const horasOcupadasPeriodo = confirmadosPeriodo.length; // assume ~1h por sessão
    const taxaOcupacao = horasDisponiveisPeriodo > 0 ? (horasOcupadasPeriodo / horasDisponiveisPeriodo) * 100 : 0;
    const percentualAgenda = totalAgendaClinicaPeriodo > 0 ? (apptsProfPeriodo.length / totalAgendaClinicaPeriodo) * 100 : 0;

    const pacientesAtualIds = new Set(apptsProfPeriodo.map(a=>a.clienteId));
    const pacientesAnteriorIds = new Set(apptsProfAnterior.map(a=>a.clienteId));
    const pacientesPerdidos = [...pacientesAnteriorIds].filter(id => !pacientesAtualIds.has(id)).length;

    const altasPeriodo = clients.filter(c => c.alta && c.alta.profissionalId===prof.id && noPeriodo(c.alta.data, periodoTipo, mes, ano)).length;

    return { prof, pacientesUnicos, atendimentosMes: confirmadosPeriodo.length, avaliacoesMes, desmarcadosMes, faltasMes, evolucoesAtraso, faturamentoMes, comissao, custoTotal, roi, taxaOcupacao, percentualAgenda, pacientesPerdidos, altasPeriodo };
  }), [professionals, appointments, apptsPeriodoTodos, clients, fichas, totalAgendaClinicaPeriodo, periodoTipo, mes, ano, anteriorTipo, anterior]);

  return (
    <div>
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <Field label="Ano"><select className={inputCls + " max-w-[110px]"} value={ano} onChange={e=>setAno(Number(e.target.value))}>
          {anos.map(a => <option key={a} value={a}>{a}</option>)}
        </select></Field>
        <Field label="Período"><select className={inputCls + " max-w-[180px]"} value={mes} onChange={e=>setMes(Number(e.target.value))}>

// Sub-aba "Individual": análise focada em um único profissional, incluindo nomes dos pacientes perdidos,
// ROI simples (faturado ÷ custo — distinto do ROI percentual da tabela de Desempenho acima), composição
// particular×convênio e contagem de atendimentos filtrada por plano específico quando selecionado. Gate
// de acesso (role admin/financeiro) é feito no componente pai (ProfissionaisPanel).
function ProfessionalIndividual({professionals, appointments, clients}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const mesAtualNum = Number(TODAY.slice(5,7));
  const [profId, setProfId] = useState(professionals[0]?.id || "");
  const [ano, setAno] = useState(anoAtual);
  const [mes, setMes] = useState(mesAtualNum); // 0 = compilado (ano todo)
  const [plano, setPlano] = useState("todos");
  useEffect(() => { if ((!profId || !professionals.some(p=>p.id===profId)) && professionals.length>0) setProfId(professionals[0].id); }, [professionals, profId]);
  const anos = [anoAtual-1, anoAtual, anoAtual+1];
  const prof = professionals.find(p=>p.id===profId);

  const planosDisponiveis = useMemo(() => [...new Set(clients.filter(c=>c.pagamento?.tipo==="convenio" && c.convenio).map(c=>c.convenio))].sort(), [clients]);

  const dados = useMemo(() => {
    if (!prof) return null;
    const periodoTipo = mes ? "mes" : "ano";
    const anterior = periodoAnterior(ano, mes);
    const anteriorTipo = anterior.mes ? "mes" : "ano";
    const apptsProf = appointments.filter(a=>a.profissionalId===prof.id);
    const apptsPeriodo = apptsProf.filter(a=>noPeriodo(a.data, periodoTipo, mes, ano));
    const apptsAnterior = apptsProf.filter(a=>noPeriodo(a.data, anteriorTipo, anterior.mes, anterior.ano));
    const confirmadosPeriodo = apptsPeriodo.filter(a=>a.status==="atendido");
    const faturado = confirmadosPeriodo.reduce((s,a) => { const c = clients.find(cl=>cl.id===a.clienteId); return s + (c?.valorSessao||0); }, 0);
    const comissao = prof.comissaoTipo === "fixo"
      ? confirmadosPeriodo.length * (prof.comissaoValorSessao||0)
      : prof.comissaoTipo === "salario"
      ? (prof.salarioFixoMensal||0) + (prof.bonusMensal||0)
      : faturado * (prof.comissaoPercentual||0) / 100;
    const custoTotal = comissao + (prof.custoFixoMensal||0);
    const roi = custoTotal > 0 ? (faturado / custoTotal) : null;

    const pacientesAtualIds = new Set(apptsPeriodo.map(a=>a.clienteId));
    const pacientesAnteriorIds = new Set(apptsAnterior.map(a=>a.clienteId));
    const pacientesPerdidosNomes = [...pacientesAnteriorIds]
      .filter(id => !pacientesAtualIds.has(id))
      .map(id => clients.find(c=>c.id===id)?.nome)
      .filter(Boolean)
      .sort();

    const clientesNoPeriodo = [...pacientesAtualIds].map(id => clients.find(c=>c.id===id)).filter(Boolean);
    const numParticulares = clientesNoPeriodo.filter(c => c.pagamento?.tipo !== "convenio").length;
    const numConvenio = clientesNoPeriodo.filter(c => c.pagamento?.tipo === "convenio").length;

    const atendimentosPlano = plano !== "todos"
      ? confirmadosPeriodo.filter(a => { const c = clients.find(cl=>cl.id===a.clienteId); return c?.pagamento?.tipo==="convenio" && c.convenio===plano; }).length
      : null;

    return { faturado, comissao, roi, pacientesPerdidosNomes, numParticulares, numConvenio, atendimentosPlano, anterior, anteriorTipo };
  }, [prof, appointments, clients, ano, mes, plano]);

  return (
    <div>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <Field label="Profissional"><select className={inputCls + " max-w-[220px]"} value={profId} onChange={e=>setProfId(e.target.value)}>
          {professionals.length===0 && <option value="">Nenhum profissional cadastrado</option>}
          {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select></Field>
        <Field label="Ano"><select className={inputCls + " max-w-[110px]"} value={ano} onChange={e=>setAno(Number(e.target.value))}>
          {anos.map(a => <option key={a} value={a}>{a}</option>)}
        </select></Field>
        <Field label="Período"><select className={inputCls + " max-w-[180px]"} value={mes} onChange={e=>setMes(Number(e.target.value))}>
          <option value={0}>Compilado (ano todo)</option>
          {MESES_PT.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
        </select></Field>
        <Field label="Plano (opcional)"><select className={inputCls + " max-w-[200px]"} value={plano} onChange={e=>setPlano(e.target.value)}>
          <option value="todos">Todos</option>
          {planosDisponiveis.map(p => <option key={p} value={p}>{p}</option>)}
        </select></Field>
      </div>

      {!prof && <p className="text-sm text-slate-400">Nenhum profissional cadastrado.</p>}

      {prof && dados && (
        <>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <KpiCard label="Faturado no período" value={fmtBRL(dados.faturado)} tone="teal" />
            <KpiCard label="Comissão (segundo cadastro)" value={fmtBRL(dados.comissao)} tone="default" />
            <KpiCard label="ROI (faturado ÷ custo)" value={dados.roi===null ? "—" : `${dados.roi.toFixed(2)}x`} tone={dados.roi!==null && dados.roi>=1 ? "green" : "amber"} />
            <KpiCard label="Pacientes perdidos" value={dados.pacientesPerdidosNomes.length} tone={dados.pacientesPerdidosNomes.length>0 ? "red" : "default"} />
            <KpiCard label="Pacientes particulares" value={dados.numParticulares} tone="default" />
            <KpiCard label="Pacientes de convênio" value={dados.numConvenio} tone="default" />
            {plano!=="todos" && <KpiCard label={`Atendimentos em ${plano}`} value={dados.atendimentosPlano} tone="teal" />}
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <div className="text-sm font-medium text-slate-700 mb-1">Pacientes perdidos ({dados.pacientesPerdidosNomes.length})</div>
            <p className="text-[11px] text-slate-400 mb-2">Tinham atendimento com {prof.nome} em {dados.anteriorTipo==="mes" ? `${MESES_PT[dados.anterior.mes-1]}/${dados.anterior.ano}` : `${dados.anterior.ano} (compilado)`} e não aparecem mais na agenda dele no período selecionado.</p>
            {dados.pacientesPerdidosNomes.length===0 ? (
              <p className="text-xs text-slate-400">Nenhum paciente perdido nesse período.</p>
            ) : (
              <ul className="text-sm text-slate-600 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-1">
                {dados.pacientesPerdidosNomes.map(n => <li key={n}>• {n}</li>)}
              </ul>
            )}
          </div>
        </>
      )}
    </div>
  );
}

  const [form, setForm] = useState({ preferencias:{fimDeSemana:false, atendeConvenio:true, atendeParticular:true, plantao:false}, especialidadesInteresse:[], ehProfissionalSaude:true, unidadeIds:[], comissaoVendaPercentual:0, ...data });
  const [modalCadastroBiometria, setModalCadastroBiometria] = useState(false);
  const [modalComissaoVenda, setModalComissaoVenda] = useState(false);
  const podeEditarComissaoVenda = currentUser?.role === "admin";
  const cargoEhFixo = CARGOS_COLABORADOR.includes(form.cargo);
  const ehNaoClinico = form.ehProfissionalSaude === false;
  function toggleUnidade(id){
    setForm(f => ({...f, unidadeIds: (f.unidadeIds||[]).includes(id) ? f.unidadeIds.filter(x=>x!==id) : [...(f.unidadeIds||[]), id]}));
  }
  function selecionarCargo(novoCargo){
    setForm(f => {
      const atualizado = {...f, cargo: novoCargo==="Outro" ? "" : novoCargo};
      // administrativo/recepção/financeiro/serviços gerais/faturamento usam salário fixo + bônus por padrão
      // e não têm registro em conselho profissional; "Outro" mantém o que já estava marcado.
      if (novoCargo !== "Outro") {
        atualizado.ehProfissionalSaude = !CARGOS_NAO_CLINICOS.includes(novoCargo);
        if (CARGOS_NAO_CLINICOS.includes(novoCargo)) atualizado.comissaoTipo = "salario";
        else if (f.comissaoTipo === "salario") atualizado.comissaoTipo = "percentual";
      }
      return atualizado;
    });
  }
  function toggleDia(d){
    setForm(f => ({...f, dias: f.dias.includes(d) ? f.dias.filter(x=>x!==d) : [...f.dias, d]}));
  }
  function togglePref(k){
    setForm(f => ({...f, preferencias: {...f.preferencias, [k]: !f.preferencias?.[k]}}));
  }
  function handleFotoUpload(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setForm(f => ({...f, foto: String(ev.target.result)}));
    reader.readAsDataURL(file);
  }
  function handleContratoUpload(e){
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5*1024*1024) { window.alert("Arquivo muito grande para este protótipo (máx. ~5MB)."); return; }
    const reader = new FileReader();
    reader.onload = (ev) => setForm(f => ({...f, contratoArquivo: { nome:file.name, tipo:file.type, dataUpload:TODAY, conteudoBase64:String(ev.target.result) }}));
    reader.readAsDataURL(file);
  }
  function gerarContrato(){
    const html = gerarContratoHTML(form);
    const win = window.open("", "_blank");
    if (win) { win.document.write(html); win.document.close(); }
    setForm(f => ({...f, contratoGeradoEm: TODAY}));
  }

  return (
    <Modal title={data.id ? "Editar profissional" : "Novo profissional"} onClose={onClose} wide>
