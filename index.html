  const [modo, setModo] = useState("mes"); // mes | ano
  const [mesRef, setMesRef] = useState(TODAY.slice(0,7));
  const [anoRef, setAnoRef] = useState(TODAY.slice(0,4));
  // Sub-aba "Por vendedora" (pedida explicitamente pelo usuário: "uma sub aba para ver os resultados de
  // cada vendedora cadastrada — vendas e comissão"). Lista de vendedoras = quem já tem pelo menos uma
  // venda registrada, não todos os profissionais — evita mostrar gente que nunca vendeu nada.
  const vendedorasComVenda = useMemo(() => {
    const map = {};
    (vendas||[]).forEach(v => { const key = v.vendedorId || v.vendedorNome; if (!map[key]) map[key] = { id:key, nome:v.vendedorNome }; });
    return Object.values(map).sort((a,b)=>a.nome.localeCompare(b.nome));
  }, [vendas]);
  const [vendedoraId, setVendedoraId] = useState("");
  useEffect(() => { if (!vendedoraId && vendedorasComVenda.length>0) setVendedoraId(vendedorasComVenda[0].id); }, [vendedorasComVenda]);

  const vendasFiltradas = useMemo(() => {
    let lista = (vendas||[]).filter(v => modo==="ano" ? v.data.slice(0,4)===anoRef : v.data.slice(0,7)===mesRef);
    if (view==="vendedora" && vendedoraId) lista = lista.filter(v => (v.vendedorId || v.vendedorNome) === vendedoraId);
    return lista.sort((a,b) => b.data.localeCompare(a.data));
  }, [vendas, modo, mesRef, anoRef, view, vendedoraId]);

  const totalVendido = vendasFiltradas.reduce((s,v)=>s+v.valorFinal,0);
  const totalComissao = vendasFiltradas.reduce((s,v)=>s+v.comissaoValor,0);
  const ticketMedio = vendasFiltradas.length ? totalVendido/vendasFiltradas.length : 0;

  const porVendedor = useMemo(() => {
    const map = {};
    vendasFiltradas.forEach(v => {
      const key = v.vendedorId || v.vendedorNome;
      if (!map[key]) map[key] = { nome: v.vendedorNome, qtd:0, total:0, comissao:0 };
      map[key].qtd += 1; map[key].total += v.valorFinal; map[key].comissao += v.comissaoValor;
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  }, [vendasFiltradas]);

  return (
    <div>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 className="text-lg font-semibold text-slate-800">Vendas de pacotes/produtos</h2>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
            <button onClick={()=>setModo("mes")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="mes"?"bg-white shadow text-teal-700":"text-slate-500")}>Por mês</button>
            <button onClick={()=>setModo("ano")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="ano"?"bg-white shadow text-teal-700":"text-slate-500")}>Por ano</button>
          </div>
          {modo==="mes" ? (
            <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white" />
          ) : (
            <input type="number" value={anoRef} onChange={e=>setAnoRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white w-24" />
          )}
        </div>
      </div>

      <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1 mb-3 w-fit">
        {[["geral","Geral"],["vendedora","Por vendedora"]].map(([id,label]) => (
          <button key={id} onClick={()=>setView(id)} className={"px-3 py-1.5 rounded-md text-sm font-medium " + (view===id ? "bg-white shadow text-teal-700" : "text-slate-500")}>{label}</button>
        ))}
      </div>

      {view==="vendedora" && (
        <div className="mb-3">
          <Field label="Vendedora"><select className={inputCls + " max-w-sm"} value={vendedoraId} onChange={e=>setVendedoraId(e.target.value)}>
            {vendedorasComVenda.length===0 && <option value="">Nenhuma venda registrada ainda</option>}
            {vendedorasComVenda.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
          </select></Field>
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <KpiCard label="Vendas no período" value={vendasFiltradas.length} tone="teal" />
        <KpiCard label="Total vendido" value={fmtBRL(totalVendido)} tone="green" />
        <KpiCard label="Comissão total" value={fmtBRL(totalComissao)} tone="amber" sub={view==="vendedora" ? "a pagar a essa vendedora" : "a pagar aos vendedores"} />
        <KpiCard label="Ticket médio" value={fmtBRL(ticketMedio)} />
      </div>

      {view==="geral" && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Por vendedor (atendente)</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Vendedor</th><th className="text-right py-1">Vendas</th><th className="text-right py-1">Total vendido</th><th className="text-right py-1">Comissão</th></tr></thead>
            <tbody>
              {porVendedor.length===0 && <tr><td colSpan="4" className="py-3 text-slate-400 text-center">Nenhuma venda no período.</td></tr>}
              {porVendedor.map((v,i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5 font-medium">{v.nome}</td>
                  <td className="py-1.5 text-right">{v.qtd}</td>
                  <td className="py-1.5 text-right">{fmtBRL(v.total)}</td>
                  <td className="py-1.5 text-right text-amber-600 font-medium">{fmtBRL(v.comissao)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="text-sm font-medium text-slate-700 mb-2">{view==="vendedora" ? "Vendas dessa vendedora" : "Vendas individuais"}</div>
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Data</th><th className="text-left py-1">Cliente</th><th className="text-left py-1">Produto/pacote</th><th className="text-left py-1">Forma</th><th className="text-left py-1">Parcelas</th><th className="text-left py-1">Vendedor</th><th className="text-right py-1">Valor</th><th className="text-right py-1">%</th><th className="text-right py-1">Comissão</th></tr></thead>
          <tbody>
            {vendasFiltradas.length===0 && <tr><td colSpan="9" className="py-3 text-slate-400 text-center">Nenhuma venda no período.</td></tr>}
            {vendasFiltradas.map(v => (
              <tr key={v.id} className="border-t border-slate-100">
                <td className="py-1.5">{fmtDataBR(v.data)}</td>
                <td className="py-1.5">{v.clienteNome}</td>
                <td className="py-1.5 text-slate-600">{v.produtoNome}</td>
                <td className="py-1.5 text-slate-500">{FORMAS_PAGAMENTO[v.formaPagamento] || "—"}</td>
                {/* Regra pedida explicitamente pelo usuário: número de parcelas só aparece quando a
                    venda foi no cartão de crédito — outras formas mostram "À vista". */}
                <td className="py-1.5 text-slate-500">{v.formaPagamento==="cartao_credito" ? `${v.parcelas||1}x` : "À vista"}</td>
                <td className="py-1.5">{v.vendedorNome}</td>
                <td className="py-1.5 text-right font-medium">{fmtBRL(v.valorFinal)}</td>
                <td className="py-1.5 text-right text-slate-500">{v.comissaoPercentualAplicada}%</td>
                <td className="py-1.5 text-right text-amber-600 font-medium">{fmtBRL(v.comissaoValor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">Toda venda é gerada automaticamente quando um produto/pacote é vinculado ao cadastro do cliente (aba Clientes) e fica registrada no login do atendente que fez o cadastro. A comissão usa o percentual configurado no cadastro do colaborador (aba Profissionais) no momento da venda.</p>
    </div>
  );
}

function CaixaPanel({lancamentos, fechamentos, currentUser, onNew, onEdit, onFechar, onReabrir}) {
  const [data, setData] = useState(TODAY);
  const [valorContado, setValorContado] = useState("");
  // Lançamento gerencial (pedido explicitamente pelo usuário: "um lançamento manual de forma gerencial
  // onde somente o gestor ou quem tiver acesso pode ver"). Entra normalmente nos totais/KPIs do dia
  // (calcCaixaDia não diferencia gerencial de comum), mas a linha fica mascarada na tabela para quem não
  // tem permissão — só admin/financeiro veem descrição, paciente, forma e valor de verdade.
  const podeVerGerencial = currentUser?.role === "admin" || currentUser?.role === "financeiro";
  const calc = useMemo(() => calcCaixaDia(lancamentos, data), [lancamentos, data]);
  const fechamento = fechamentos[data];
  const fechado = !!fechamento;

  function shiftDate(days){
    const d = new Date(data + "T00:00:00");
    d.setDate(d.getDate()+days);
    setData(d.toISOString().slice(0,10));
  }

  return (
    <div>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <button onClick={()=>shiftDate(-1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">←</button>
        <DateInput value={data} onChange={setData} />
        <button onClick={()=>shiftDate(1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">→</button>
        {fechado ? (
          <span className="text-xs font-medium px-2 py-1 rounded-full bg-slate-200 text-slate-600">🔒 Caixa fechado</span>
        ) : (
          <span className="text-xs font-medium px-2 py-1 rounded-full bg-green-100 text-green-700">Caixa aberto</span>
        )}
        {!fechado && <button onClick={()=>onNew(data)} className="ml-auto px-3 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">+ Novo lançamento</button>}
        {fechado && <button onClick={()=>onReabrir(data)} className="ml-auto px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Reabrir caixa (admin)</button>}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <KpiCard label="Entradas (receitas)" value={fmtBRL(calc.totalReceitas)} tone="green" />
        <KpiCard label="Saídas (despesas + sangrias)" value={fmtBRL(calc.totalDespesas + calc.totalSangrias)} tone="red" />
        <KpiCard label="Reforços" value={fmtBRL(calc.totalReforcos)} tone="teal" />
        <KpiCard label="Resultado do dia" value={fmtBRL(calc.resultadoDia)} tone={calc.resultadoDia>=0?"green":"red"} sub="receitas − despesas" />
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Entradas por forma de pagamento</div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {Object.entries(FORMAS_PAGAMENTO).map(([k,label]) => (
              <div key={k} className="border border-slate-100 rounded-lg p-2">
                <div className="text-[11px] text-slate-400">{label}</div>
                <div className="text-sm font-semibold text-slate-700">{fmtBRL(calc.porForma[k]||0)}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Entradas por origem</div>
          <div className="grid grid-cols-2 gap-3">
            {Object.entries(ORIGENS_PAGAMENTO).map(([k,label]) => (
              <div key={k} className="border border-slate-100 rounded-lg p-2">
                <div className="text-[11px] text-slate-400">{label}</div>
                <div className="text-sm font-semibold text-slate-700">{fmtBRL(calc.porOrigem[k]||0)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto mb-4">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
            <tr><th className="text-left px-4 py-2">Tipo</th><th className="text-left px-4 py-2">Paciente</th><th className="text-left px-4 py-2">Origem</th><th className="text-left px-4 py-2">Forma</th><th className="text-left px-4 py-2">Descrição</th><th className="text-right px-4 py-2">Valor</th><th className="text-right px-4 py-2">Ações</th></tr>
          </thead>
          <tbody>
            {calc.doDia.length===0 && <tr><td colSpan="7" className="text-center py-4 text-slate-400">Nenhum lançamento neste dia.</td></tr>}
            {calc.doDia.map(l => {
              const cfg = TIPO_LANCAMENTO[l.tipo];
              const mascarado = l.gerencial && !podeVerGerencial;
              if (mascarado) {
                return (
                  <tr key={l.id} className="border-t border-slate-100 bg-slate-50/50">
                    <td className="px-4 py-2"><span className={"text-xs font-medium rounded-full px-2 py-1 " + cfg.badge}>{cfg.label}</span></td>
                    <td className="px-4 py-2 text-slate-400 italic" colSpan="4">🔒 Lançamento gerencial — visível só para gestor/financeiro.</td>
                    <td className="px-4 py-2 text-right text-slate-400 italic">•••••</td>
                    <td className="px-4 py-2 text-right"></td>
                  </tr>
                );
              }
              return (
                <tr key={l.id} className="border-t border-slate-100">
                  <td className="px-4 py-2">
                    <span className={"text-xs font-medium rounded-full px-2 py-1 " + cfg.badge}>{cfg.label}</span>
                    {l.gerencial && <span className="ml-1 text-xs" title="Lançamento gerencial">🔒</span>}
                  </td>
                  <td className="px-4 py-2 text-slate-600">{l.clienteNome || "—"}</td>
                  <td className="px-4 py-2 text-slate-500">{l.tipo==="receita" ? (ORIGENS_PAGAMENTO[l.origemPagamento] || "—") : "—"}</td>
                  <td className="px-4 py-2 text-slate-500">{FORMAS_PAGAMENTO[l.formaPagamento] || "—"}</td>
                  <td className="px-4 py-2 text-slate-600">
                    {l.descricao}
                    {/* Observação de competência x caixa (pedida explicitamente pelo usuário: mostrar o mês de
                        produção e o tempo de pagamento quando uma guia de convênio é lançada no caixa). */}
                    {l.mesProducao && (
                      <div className="text-[11px] text-slate-400">Produção {l.mesProducao}{l.prazoPagamentoDias!==null && l.prazoPagamentoDias!==undefined ? ` · pago em ${l.prazoPagamentoDias} dia${l.prazoPagamentoDias===1?"":"s"}` : ""}</div>
                    )}
                  </td>
                  <td className={"px-4 py-2 text-right font-medium " + (cfg.sinal>0?"text-green-600":"text-red-600")}>{cfg.sinal>0?"+":"−"}{fmtBRL(l.valor)}</td>
                  <td className="px-4 py-2 text-right">
                    {!fechado && <button onClick={()=>onEdit(l)} className="text-teal-600 text-xs font-medium hover:underline">Editar</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Fechamento de caixa</div>
        {!fechado ? (
          <div>
            <p className="text-xs text-slate-500 mb-2">Valor esperado em dinheiro pelo sistema: <strong>{fmtBRL(calc.valorSistemaDinheiro)}</strong> (dinheiro recebido + reforços − despesas em dinheiro − sangrias).</p>
            <div className="flex items-end gap-3 flex-wrap">
              <Field label="Valor físico contado na gaveta (R$)">
                <MoneyInput allowEmpty className={inputCls} value={valorContado} onChange={setValorContado} />
              </Field>
              <button
                onClick={()=>{ onFechar(data, Number(valorContado||0), calc.valorSistemaDinheiro); setValorContado(""); }}
                className="mb-3 px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">
                Fechar caixa do dia
              </button>
            </div>
          </div>
        ) : (
          <div className="text-sm text-slate-600 space-y-1">
            <div>Valor sistema: <strong>{fmtBRL(fechamento.valorSistema)}</strong></div>
            <div>Valor contado: <strong>{fmtBRL(fechamento.valorFisico)}</strong></div>
            <div className={fechamento.diferenca===0 ? "text-green-600" : "text-red-600"}>
              Diferença: <strong>{fmtBRL(fechamento.diferenca)}</strong> {fechamento.diferenca===0 ? "(caixa bateu certinho)" : fechamento.diferenca>0 ? "(sobra)" : "(falta)"}
            </div>
            <p className="text-[11px] text-slate-400 mt-2">Caixa travado para novos lançamentos. Reabertura exige confirmação administrativa.</p>
          </div>
        )}
      </div>
    </div>
  );
}

function LancamentoModal({data, unidades, clients, podeVerGerencial, onClose, onSave}) {
  const [form, setForm] = useState({ unidadeId: unidades?.[0]?.id||"", origemPagamento: "particular", ...data });
  const precisaForma = form.tipo === "receita" || form.tipo === "despesa";
  const ehReceita = form.tipo === "receita";
  const ehEdicao = !!data.id;
  // Lançamentos gerados automaticamente por uma venda ou pelo recebimento de guia (descrição começa com
  // "Venda:" ou "Recebimento guia") não têm vínculo de volta ao registro de origem — editar aqui NÃO
  // atualiza a aba Vendas nem a guia correspondente, só o lançamento de caixa em si.
  const ehAutoGerado = ehEdicao && /^(Venda:|Recebimento guia)/.test(data.descricao || "");
  return (
    <Modal title={ehEdicao ? "Editar lançamento de caixa" : "Novo lançamento de caixa"} onClose={onClose}>
      {ehAutoGerado && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-3">
          Este lançamento foi gerado automaticamente por uma venda ou recebimento de guia. Editar aqui altera só o Fluxo de Caixa — não atualiza a aba Vendas nem a guia de origem.
        </div>
      )}
      <Field label="Data"><DateInput value={form.data} onChange={v=>setForm({...form,data:v})} /></Field>
      <Field label="Unidade">
        <select className={inputCls} value={form.unidadeId||""} onChange={e=>setForm({...form,unidadeId:e.target.value})}>
          {(unidades||[]).map(u => <option key={u.id} value={u.id}>{u.nome}</option>)}
        </select>
      </Field>
      <Field label="Tipo de lançamento">
        <select className={inputCls} value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})}>
          {Object.entries(TIPO_LANCAMENTO).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
      </Field>
      {ehReceita && (
        <Field label="Origem">
          <select className={inputCls} value={form.origemPagamento||"particular"} onChange={e=>setForm({...form,origemPagamento:e.target.value})}>
            {Object.entries(ORIGENS_PAGAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
          </select>
        </Field>
      )}
      {/* Paciente que fez o pagamento (pedido explicitamente pelo usuário: mostrar quem pagou, seja
          particular ou convênio, tanto no Fluxo de Caixa quanto nas Vendas). Opcional — nem todo
          lançamento manual de receita está necessariamente ligado a um paciente específico. */}
      {ehReceita && (clients?.length > 0) && (
        <SearchSelect label="Paciente (opcional)" placeholder="Buscar paciente..."
          items={clients} getLabel={c=>c.nome} value={form.clienteId||""}
          onSelect={c=>setForm({...form, clienteId:c.id, clienteNome:c.nome})}
          onClear={()=>setForm({...form, clienteId:null, clienteNome:null})} />
      )}
      {precisaForma && (
        <Field label="Forma de pagamento">
          <select className={inputCls} value={form.formaPagamento} onChange={e=>setForm({...form,formaPagamento:e.target.value})}>
            {Object.entries(FORMAS_PAGAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
          </select>
        </Field>
      )}
      <Field label="Valor (R$)"><MoneyInput className={inputCls} value={form.valor} onChange={v=>setForm({...form,valor:v})} /></Field>
      <Field label="Descrição"><input className={inputCls} value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} /></Field>
      {/* Lançamento gerencial (pedido explicitamente pelo usuário: "um lançamento manual de forma
          gerencial onde somente o gestor ou quem tiver acesso pode ver"). Só quem já tem permissão de ver
          lançamentos gerenciais consegue marcar/desmarcar essa opção — para os demais perfis o campo nem
          aparece, então eles nunca conseguem criar um lançamento oculto. */}
      {podeVerGerencial && (
        <label className="flex items-center gap-2 text-sm text-slate-700 mb-3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
          <input type="checkbox" checked={!!form.gerencial} onChange={e=>setForm({...form,gerencial:e.target.checked})} />
          🔒 Lançamento gerencial (entra nos totais do caixa, mas a linha fica visível só para gestor/financeiro)
        </label>
      )}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={()=>onSave({...form, formaPagamento: precisaForma ? form.formaPagamento : "dinheiro", origemPagamento: ehReceita ? (form.origemPagamento||"particular") : null, clienteId: ehReceita ? (form.clienteId||null) : null, clienteNome: ehReceita ? (form.clienteNome||null) : null, gerencial: podeVerGerencial ? !!form.gerencial : false})} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">{ehEdicao ? "Salvar alterações" : "Lançar"}</button>
      </div>
    </Modal>
  );
}

function VenderProdutoModal({data, produtos, clients, currentUser, onClose, onSave}) {
  const cliente = clients.find(c=>c.id===data.clienteId);
  const produtosAtivos = (produtos||[]).filter(p=>p.ativo);
  const [produtoId, setProdutoId] = useState(produtosAtivos[0]?.id || "");
  const [quantidade, setQuantidade] = useState(1);
  const [desconto, setDesconto] = useState(0);
  const [formaPagamento, setFormaPagamento] = useState("dinheiro");
  const [parcelas, setParcelas] = useState(1);
  const [origemPagamento, setOrigemPagamento] = useState(cliente?.pagamento?.tipo === "convenio" ? "convenio" : "particular");
  const [descontoAutorizado, setDescontoAutorizado] = useState(false);
  const [modalAutorizarDesconto, setModalAutorizarDesconto] = useState(false);

  const produto = produtosAtivos.find(p=>p.id===produtoId);
  const descontoMin = produto?.descontoMinimoPercent || 0;
  const descontoMax = produto?.descontoMaximoPercent || 0;
  const parcelasMax = produto?.parcelasMaximas || 1;
  const valorBruto = (produto?.precoBase||0) * quantidade;
  const valorFinal = valorBruto * (1 - (Number(desconto)||0)/100);
  const descontoForaDaFaixa = !!produto && ((Number(desconto)||0) > descontoMax || (Number(desconto)||0) < descontoMin);

  function confirmar(){
    if (!produto || (descontoForaDaFaixa && !descontoAutorizado)) return;
    onSave({
      data: data.data || TODAY,
      unidadeId: data.unidadeId,
      tipo: "receita",
      formaPagamento,
      origemPagamento,
      valor: Number(valorFinal.toFixed(2)),
      descricao: `Venda: ${produto.nome}${quantidade>1?` (${quantidade}x)`:""} — ${cliente?.nome || "Cliente"}`,
      // Campos extras (RN pedida explicitamente pelo usuário: venda avulsa também deve gerar registro na
      // aba Vendas, com comissão) — usados pelo App para criar a venda além do lançamento de caixa.
      produtoId: produto.id, produtoNome: produto.nome,
      clienteId: cliente?.id || null, clienteNome: cliente?.nome || "Cliente",
      quantidade, descontoAplicado: Number(desconto)||0, parcelas,
      // Campo transiente (removido pelo App antes de persistir o lançamento) — só existe para o App
      // registrar no log de auditoria quando o desconto ficou fora da faixa mín.–máx. do produto.
      _overrideDesconto: descontoForaDaFaixa ? { produtoNome: produto.nome, desconto: Number(desconto)||0, min: descontoMin, max: descontoMax } : null,
    });
  }

  return (
    <Modal title="Vender produto" onClose={onClose}>
      <Field label="Cliente"><div className="text-sm text-slate-700 py-1.5">{cliente?.nome || "—"}</div></Field>
      {produtosAtivos.length===0 ? (
        <div className="text-sm text-slate-500 py-2">Nenhum produto ativo cadastrado no Catálogo.</div>
      ) : (
        <>
          <Field label="Produto">
            <select className={inputCls} value={produtoId} onChange={e=>{setProdutoId(e.target.value); setDesconto(0); setDescontoAutorizado(false);}}>
              {produtosAtivos.map(p => <option key={p.id} value={p.id}>{p.nome} — {fmtBRL(p.precoBase)}</option>)}
            </select>
          </Field>
          <Field label="Quantidade">
            <input type="number" min="1" className={inputCls} value={quantidade} onChange={e=>setQuantidade(Math.max(1, Number(e.target.value)))} />
          </Field>
          <Field label={`Desconto % (faixa ${descontoMin}%–${descontoMax}%)`}>
            <input type="number" min="0" className={inputCls} value={desconto}
              onChange={e=>{ setDesconto(Number(e.target.value)); setDescontoAutorizado(false); }} />
          </Field>
          {descontoForaDaFaixa && (
            <div className={"flex items-center justify-between gap-3 rounded-lg p-3 mb-2 text-xs " + (descontoAutorizado ? "bg-green-50 border border-green-200 text-green-700" : "bg-amber-50 border border-amber-200 text-amber-700")}>
              {descontoAutorizado ? (
                <span>✓ Desconto fora da faixa autorizado pelo gestor. Pode vender.</span>
              ) : (
                <>
                  <span>Fora da faixa permitida ({descontoMin}%–{descontoMax}%). Necessária autorização do gestor.</span>
                  <button type="button" onClick={()=>setModalAutorizarDesconto(true)} className="px-3 py-1.5 rounded-lg bg-amber-600 text-white hover:bg-amber-700 flex-shrink-0 whitespace-nowrap">Solicitar autorização</button>
                </>
              )}
            </div>
          )}
          <Field label="Origem">
            <select className={inputCls} value={origemPagamento} onChange={e=>setOrigemPagamento(e.target.value)}>
              {Object.entries(ORIGENS_PAGAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
            </select>
          </Field>
          <Field label="Forma de pagamento">
            <select className={inputCls} value={formaPagamento} onChange={e=>{ setFormaPagamento(e.target.value); if (e.target.value!=="cartao_credito") setParcelas(1); }}>
              {Object.entries(FORMAS_PAGAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
            </select>
          </Field>
          {/* Regra pedida explicitamente pelo usuário: número de parcelas só aparece no cartão de crédito. */}
          {formaPagamento==="cartao_credito" && (
            <Field label={`Parcelas (máx. ${parcelasMax}x)`}>
              <select className={inputCls} value={parcelas} onChange={e=>setParcelas(Number(e.target.value))}>
                {Array.from({length:parcelasMax}, (_,i)=>i+1).map(n => <option key={n} value={n}>{n}x</option>)}
              </select>
            </Field>
          )}
          <div className="bg-slate-50 rounded-lg p-3 text-sm text-slate-700 my-2">Total: <strong>{fmtBRL(valorFinal)}</strong></div>
        </>
      )}
      {modalAutorizarDesconto && (
        <AutorizarDescontoModal produtoNome={produto?.nome} descontoSolicitado={Number(desconto)||0} descontoMin={descontoMin} descontoMax={descontoMax} currentUser={currentUser}
          onClose={()=>setModalAutorizarDesconto(false)}
          onAutorizado={()=>{ setDescontoAutorizado(true); setModalAutorizarDesconto(false); }} />
      )}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={confirmar} disabled={!produto || (descontoForaDaFaixa && !descontoAutorizado)} title={descontoForaDaFaixa && !descontoAutorizado ? "Solicite autorização do gestor para o desconto fora da faixa" : undefined}
          className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed">Vender e lançar no caixa</button>
      </div>
    </Modal>
  );
}

function getEscalaValue(ficha, modelosFicha){
  const modelo = modelosFicha.find(m=>m.id===ficha.modeloId);
  if (!modelo) return null;
  const pergEscala = modelo.perguntas.find(p=>p.tipo==="escala");
  if (!pergEscala) return null;
  const v = ficha.respostas[pergEscala.id];
  return (v===undefined || v===null || v==="") ? null : Number(v);
}

function FichaTimeline({clients, modelosFicha, fichas, professionals, clienteId, setClienteId}) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const fichasCliente = useMemo(() => fichas.filter(f=>f.clienteId===clienteId && f.status!=="pendente_paciente").sort((a,b)=>a.data.localeCompare(b.data)), [fichas, clienteId]);
  const pontos = useMemo(() => fichasCliente.map(f => ({data:f.data, valor:getEscalaValue(f, modelosFicha)})).filter(p=>p.valor!==null), [fichasCliente, modelosFicha]);

  useEffect(() => {
    if (chartInstance.current) chartInstance.current.destroy();
    if (!chartRef.current || pontos.length===0) return;
    chartInstance.current = new Chart(chartRef.current, {
      type: "line",
      data: { labels: pontos.map(p=>fmtDataBR(p.data)), datasets: [{ label:"Nível de dor (0–10)", data: pontos.map(p=>p.valor), borderColor:"#0d9488", backgroundColor:"#0d948833", tension:0.3, fill:true }] },
      options: { scales:{ y:{ min:0, max:10 } }, plugins:{ legend:{display:false} } }
    });
    return () => chartInstance.current?.destroy();
  }, [pontos]);

  return (
    <div>
      <Field label="Cliente">
        <select className={inputCls + " max-w-sm"} value={clienteId} onChange={e=>setClienteId(e.target.value)}>
          {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
      </Field>

      {pontos.length > 1 && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Evolução do nível de dor</div>
          <canvas ref={chartRef} height="220"></canvas>
        </div>
      )}

      <div className="space-y-3">
        {fichasCliente.length===0 && <div className="text-sm text-slate-400 bg-white rounded-xl border border-slate-200 p-4">Nenhuma ficha preenchida para este cliente ainda.</div>}
        {fichasCliente.map(f => {
          const modelo = modelosFicha.find(m=>m.id===f.modeloId);
          const cfg = FICHA_STATUS[f.status];
          return (
            <div key={f.id} className="bg-white rounded-xl border border-slate-200 p-4">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <div className="text-sm font-semibold text-slate-800">{fmtDataBR(f.data)} — {modelo?.nome}</div>
                  <div className="text-xs text-slate-400">{professionals.find(p=>p.id===f.profissionalId)?.nome}</div>
                </div>
                <span className={"text-xs font-medium border rounded-full px-2 py-1 " + cfg.badge}>{cfg.label}</span>
              </div>
              <dl className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 mt-3 text-sm">
                {(modelo?.perguntas||[]).map(p => {
                  const v = f.respostas[p.id];
                  const texto = p.tipo==="sim_nao" ? (v==="sim"?"Sim":v==="nao"?"Não":"—") : (v ?? "—");
                  return (
                    <div key={p.id}>
                      <dt className="text-[11px] text-slate-400">{p.texto}</dt>
                      <dd className="text-slate-700">{texto}</dd>
                    </div>
                  );
                })}
              </dl>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function FichaModal({data, clients, professionals, modelosFicha, onClose, onSave}) {
  const [form, setForm] = useState(data);
  const modelo = modelosFicha.find(m=>m.id===form.modeloId);
  const mostrarRespostas = form.modo === "presencial" || !!data.id;

  function setResposta(perguntaId, valor){
    setForm(f => ({...f, respostas:{...f.respostas, [perguntaId]:valor}}));
  }

  function computeStatus(){
    if (data.status === "assinada") return "assinada";
    if (form.modo === "remoto") {
      const respondida = Object.values(form.respostas||{}).some(v => v!==undefined && v!==null && v!=="");
      return respondida ? "preenchida" : "pendente_paciente";
    }
    return "preenchida";
  }

  return (
    <Modal title={data.id ? "Editar ficha" : "Nova ficha de avaliação"} onClose={onClose} wide>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Cliente">
          <select className={inputCls} value={form.clienteId} onChange={e=>setForm({...form,clienteId:e.target.value})}>
            {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
        </Field>
        <Field label="Modelo de ficha">
          <select className={inputCls} value={form.modeloId} onChange={e=>setForm({...form,modeloId:e.target.value, respostas:{}})}>
            {modelosFicha.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
          </select>
        </Field>
        <Field label="Profissional">
          <select className={inputCls} value={form.profissionalId} onChange={e=>setForm({...form,profissionalId:e.target.value})}>
            {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </Field>
        <Field label="Data"><DateInput value={form.data} onChange={v=>setForm({...form,data:v})} /></Field>
      </div>
      <Field label="Modo de preenchimento">
        <div className="flex gap-2">
          <button type="button" onClick={()=>setForm({...form,modo:"presencial"})} className={"px-3 py-1.5 rounded-full text-xs border " + (form.modo==="presencial" ? "bg-teal-600 text-white border-teal-600" : "bg-white text-slate-600 border-slate-300")}>Presencial (preencher agora)</button>
          <button type="button" onClick={()=>setForm({...form,modo:"remoto"})} className={"px-3 py-1.5 rounded-full text-xs border " + (form.modo==="remoto" ? "bg-teal-600 text-white border-teal-600" : "bg-white text-slate-600 border-slate-300")}>Remoto (enviar link ao paciente)</button>
        </div>
      </Field>

      {form.modo === "remoto" && !data.id && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-3">
          Um link de preenchimento será enviado por WhatsApp/e-mail para o paciente. A ficha fica "Pendente" até o retorno — depois é só reabrir aqui e registrar as respostas recebidas.
        </div>
      )}

      {mostrarRespostas && modelo && (
        <div className="space-y-3 border-t border-slate-100 pt-3 mt-1">
          {modelo.perguntas.map(p => (
            <Field key={p.id} label={p.texto}>
              {p.tipo === "texto" && <textarea className={inputCls} rows="2" value={form.respostas[p.id]||""} onChange={e=>setResposta(p.id, e.target.value)} />}
              {p.tipo === "escala" && <input type="number" min="0" max="10" className={inputCls} value={form.respostas[p.id]??""} onChange={e=>setResposta(p.id, e.target.value)} />}
              {p.tipo === "sim_nao" && (
                <select className={inputCls} value={form.respostas[p.id]||""} onChange={e=>setResposta(p.id, e.target.value)}>
                  <option value="">—</option>
                  <option value="sim">Sim</option>
                  <option value="nao">Não</option>
                </select>
              )}
            </Field>
          ))}
        </div>
      )}

      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={()=>onSave({...form, status: computeStatus()})} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">
          {form.modo==="remoto" && !data.id ? "Enviar para o paciente" : "Salvar"}
        </button>
      </div>
    </Modal>
  );
}

function ModeloFichaModal({data, onClose, onSave}) {
  const [form, setForm] = useState(data);
  function addPergunta(){
    setForm(f => ({...f, perguntas:[...f.perguntas, {id:"q"+Date.now(), texto:"", tipo:"texto"}]}));
  }
  function updatePergunta(id, patch){
    setForm(f => ({...f, perguntas: f.perguntas.map(p => p.id===id ? {...p, ...patch} : p)}));
  }
  function removePergunta(id){
    setForm(f => ({...f, perguntas: f.perguntas.filter(p=>p.id!==id)}));
  }
  return (
    <Modal title={data.id ? "Editar modelo de ficha" : "Novo modelo de ficha"} onClose={onClose} wide>
      <Field label="Nome do modelo"><input className={inputCls} value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
      <div className="space-y-2">
        {form.perguntas.map(p => (
          <div key={p.id} className="flex items-center gap-2">
            <input className={inputCls} value={p.texto} onChange={e=>updatePergunta(p.id,{texto:e.target.value})} placeholder="Pergunta" />
            <select className={inputCls + " max-w-[160px]"} value={p.tipo} onChange={e=>updatePergunta(p.id,{tipo:e.target.value})}>
              {Object.entries(PERGUNTA_TIPOS).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
            </select>
            <button onClick={()=>removePergunta(p.id)} className="text-red-500 text-xs px-2">Remover</button>
          </div>
        ))}
      </div>
      <button onClick={addPergunta} className="mt-2 text-xs font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-lg px-3 py-1.5">+ Adicionar pergunta</button>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={()=>onSave(form)} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">Salvar modelo</button>
      </div>
    </Modal>
  );
}

// P0-4 (6.1): fonte única de precificação — sessão de convênio usa a tabela TUSS por convênio (guia.procedimentoId);
// sessão particular usa o produto/pacote vinculado ao cliente; cliente.valorSessao só entra como override manual explícito.
function precoDaSessao(appt, cliente, guias, produtos, procedimentosTuss, convenios){
  if (!cliente) return { valor:0, origem:"—" };
  // Regra pedida explicitamente pelo usuário: o valor vinculado ao agendamento no momento em que ele foi
  // criado (seja particular ou de guia — ver AppointmentModal) é o valor real cobrado naquela sessão, e
  // prevalece sobre qualquer cálculo derivado do cadastro atual do cliente/produto/tabela TUSS (que pode
  // ter mudado desde então). Agendamentos antigos, salvos antes dessa regra, não têm `valor` — para esses,
  // mantém o cálculo derivado abaixo como fallback.
  if (Number(appt.valor) > 0) {
    return { valor: Number(appt.valor), origem: appt.guiaId ? "valor vinculado (guia)" : "valor vinculado (particular)" };
  }
  if (cliente.pagamento.tipo === "convenio" && appt.guiaId) {
    const guia = guias.find(g=>g.id===appt.guiaId);
    const procedimento = guia ? procedimentosTuss.find(p=>p.id===guia.procedimentoId) : null;
    if (procedimento) return { valor: getPrecoProcedimento(procedimento, guia.convenio, convenios), origem:"tabela TUSS" };
  }
  if (cliente.produtoId) {
    const produto = produtos.find(p=>p.id===cliente.produtoId);
    if (produto) {
      // Não re-clampa: se o desconto salvo estiver fora da faixa mín.–máx. do produto, já foi
      // autorizado pelo gestor no momento do cadastro (ver saveClient) — reportar o valor real cobrado.
      const descontoFrac = (cliente.descontoAplicado||0)/100;
      const precoComDesconto = produto.precoBase * (1-descontoFrac);
      const porSessao = produto.sessoesIncluidas>0 ? precoComDesconto/produto.sessoesIncluidas : precoComDesconto;
      return { valor: porSessao, origem:"produto/pacote" };
    }
  }
  return { valor: cliente.valorSessao||0, origem:"override manual" };
}

function valorGuiaPendente(guia, procedimentosTuss, convenios){
  const procedimento = procedimentosTuss.find(p=>p.id===guia.procedimentoId);
  const precoUnit = procedimento ? getPrecoProcedimento(procedimento, guia.convenio, convenios) : 0;
  return Math.max(0, precoUnit*guia.quantidadeAutorizada - (guia.valorGlosa||0));
}

function DashboardPainel({clients, appointments, guias, lancamentos, fichas, produtos, convenios, procedimentosTuss, vendas}) {
  const caixaHoje = useMemo(() => calcCaixaDia(lancamentos, TODAY), [lancamentos]);
  const fichasPendentes = fichas.filter(f=>f.status==="pendente_paciente").length;
  const fichasAssinadas = fichas.filter(f=>f.status==="assinada").length;

  const vendasMes = useMemo(() => (vendas||[]).filter(v => v.data.slice(0,7)===TODAY.slice(0,7)), [vendas]);
  const totalVendidoMes = vendasMes.reduce((s,v)=>s+v.valorFinal,0);
  const comissaoVendasMes = vendasMes.reduce((s,v)=>s+v.comissaoValor,0);
  const topVendedoresMes = useMemo(() => {
    const map = {};
    vendasMes.forEach(v => {
      const key = v.vendedorId || v.vendedorNome;
      if (!map[key]) map[key] = { nome: v.vendedorNome, qtd:0, total:0 };
      map[key].qtd += 1; map[key].total += v.valorFinal;
    });
    return Object.values(map).sort((a,b)=>b.total-a.total).slice(0,5);
  }, [vendasMes]);
  const barRef = useRef(null);
  const doughnutRef = useRef(null);
  const barChart = useRef(null);
  const doughnutChart = useRef(null);

  const glosasList = useMemo(() => guias
    .filter(g => g.status==="glosada_parcial" || g.status==="glosada_total")
    .map(g => ({ convenio:g.convenio, numeroGuia:g.numeroGuia, valor:g.valorGlosa||0, motivo:g.motivoGlosa||"—" })), [guias]);

  const guiasProntasParaFaturar = guias.filter(g => g.status==="aberta" && g.quantidadeUtilizada >= g.quantidadeAutorizada).length;

  const guiasVencendo = guias.filter(g => (g.status==="aberta"||g.status==="em_faturamento") && diasParaVencer(g.validade) <= LIMITE_ALERTA_VALIDADE_DIAS);

  const glosasPorConvenio = useMemo(() => {
    const map = {};
    glosasList.forEach(g => { map[g.convenio] = (map[g.convenio]||{valor:0, qtd:0}); map[g.convenio].valor += g.valor; map[g.convenio].qtd += 1; });
    return Object.entries(map).map(([convenio, v]) => ({convenio, ...v})).sort((a,b)=>b.valor-a.valor);
  }, [glosasList]);

  const glosasPorMotivo = useMemo(() => {
    const map = {};
    glosasList.forEach(g => { map[g.motivo] = (map[g.motivo]||{valor:0, qtd:0}); map[g.motivo].valor += g.valor; map[g.motivo].qtd += 1; });
    return Object.entries(map).map(([motivo, v]) => ({motivo, ...v})).sort((a,b)=>b.valor-a.valor);
  }, [glosasList]);

  const stats = useMemo(() => {
    const total = appointments.length;
    const atendidos = appointments.filter(a=>a.status==="atendido").length;
    const desmarcados = appointments.filter(a=>a.status==="desmarcado").length;
    const faltas = appointments.filter(a=>a.status==="faltou").length;
    const avaliacoes = appointments.filter(a=>(a.tipo||"sessao")==="avaliacao").length;
    const novosClientesMes = clients.filter(c => c.dataInicio >= (TODAY.slice(0,7) + "-01")).length;

    const valorPorConvenio = {};
    let valorProduzido = 0;
    let sessoesComOverrideManual = 0;
    appointments.filter(a=>a.status==="atendido").forEach(a => {
      const cliente = clients.find(c=>c.id===a.clienteId);
      if (!cliente) return;
      const { valor, origem } = precoDaSessao(a, cliente, guias, produtos, procedimentosTuss, convenios);
      if (origem === "override manual") sessoesComOverrideManual++;
      valorProduzido += valor;
      const chave = cliente.pagamento.tipo==="convenio" ? cliente.convenio : cliente.pagamento.tipo==="bolsa" ? "Bolsa" : "Particular";
      valorPorConvenio[chave] = (valorPorConvenio[chave]||0) + valor;
    });
    const totalGlosas = glosasList.reduce((s,g)=>s+g.valor,0);
    const valorRecebido = valorProduzido - totalGlosas;

    return { total, atendidos, desmarcados, faltas, avaliacoes, novosClientesMes, valorPorConvenio, valorProduzido, valorRecebido, totalGlosas, sessoesComOverrideManual };
  }, [clients, appointments, glosasList, guias, produtos, procedimentosTuss, convenios]);

  // P0-4 (6.1): Produção (competência, sessões "atendido") vs. Recebimento (caixa: particular na hora +
  // guias efetivamente pagas pelo convênio) vs. A receber de convênio, com aging.
  const competenciaVsCaixa = useMemo(() => {
    const producao = stats.valorProduzido;
    const recebimentoParticular = lancamentos.filter(l=>l.tipo==="receita").reduce((s,l)=>s+l.valor,0);
    const guiasPagas = guias.filter(g=>g.status==="paga");
    const recebimentoConvenio = guiasPagas.reduce((s,g)=>s+valorGuiaPendente(g, procedimentosTuss, convenios), 0);
    const recebimentoTotal = recebimentoParticular + recebimentoConvenio;

    const pendentes = guias.filter(g => g.status==="em_faturamento" || g.status==="glosada_parcial" || g.status==="aberta");
    const buckets = { "0–30 dias":0, "31–60 dias":0, "61–90 dias":0, "Acima de 90 dias":0 };
    let totalAReceber = 0;
    pendentes.forEach(g => {
      const valor = valorGuiaPendente(g, procedimentosTuss, convenios);
      totalAReceber += valor;
      const referencia = g.dataEnvio || g.dataAutorizacao;
      const dias = referencia ? Math.round((new Date(TODAY+"T00:00:00") - new Date(referencia+"T00:00:00"))/86400000) : 0;
      if (dias <= 30) buckets["0–30 dias"] += valor;
      else if (dias <= 60) buckets["31–60 dias"] += valor;
      else if (dias <= 90) buckets["61–90 dias"] += valor;
      else buckets["Acima de 90 dias"] += valor;
    });
    return { producao, recebimentoParticular, recebimentoConvenio, recebimentoTotal, buckets, totalAReceber };
  }, [stats.valorProduzido, lancamentos, guias, procedimentosTuss, convenios]);

  useEffect(() => {
    if (barChart.current) barChart.current.destroy();
    if (doughnutChart.current) doughnutChart.current.destroy();
    const chavesConvenio = Object.keys(stats.valorPorConvenio);
    barChart.current = new Chart(barRef.current, {
      type: "bar",
      data: { labels: chavesConvenio, datasets: [{ label:"Valor produzido (R$)", data: chavesConvenio.map(k=>stats.valorPorConvenio[k]), backgroundColor:"#0d9488" }] },
      options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
    });
    doughnutChart.current = new Chart(doughnutRef.current, {
      type: "doughnut",
      data: {
        labels: ["Atendido","Agendado/Confirmado","Desmarcado","Faltou"],
        datasets: [{ data: [
          appointments.filter(a=>a.status==="atendido").length,
          appointments.filter(a=>a.status==="agendado"||a.status==="confirmado"||a.status==="chegou").length,
          appointments.filter(a=>a.status==="desmarcado").length,
          appointments.filter(a=>a.status==="faltou").length,
        ], backgroundColor:["#16a34a","#2563eb","#d97706","#dc2626"] }]
      },
      options: { plugins:{legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}}} }
    });
    return () => { barChart.current?.destroy(); doughnutChart.current?.destroy(); };
  }, [stats, appointments]);

  return (
    <div>
      <h2 className="text-lg font-semibold text-slate-800 mb-3">Dashboard administrativo</h2>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
        <KpiCard label="Nº de clientes" value={clients.length} />
        <KpiCard label="Atendimentos concluídos" value={stats.atendidos} tone="green" sub={`de ${stats.total} agendamentos carregados`} />
        <KpiCard label="Desmarcações" value={stats.desmarcados} tone="amber" />
        <KpiCard label="Novos clientes (mês)" value={stats.novosClientesMes} tone="teal" />
        <KpiCard label="Faltas (no-show)" value={stats.faltas} tone="red" />
        <KpiCard label="Produção (competência)" value={fmtBRL(stats.valorProduzido)} tone="teal" sub="sessões atendidas × preço da tabela/produto" />
        <KpiCard label="Valor recebido (líquido)" value={fmtBRL(stats.valorRecebido)} tone="green" sub="produzido − glosas" />
        <KpiCard label="Glosas" value={fmtBRL(stats.totalGlosas)} tone="red" sub={`${glosasList.length} guia(s) glosada(s)`} />
        <KpiCard label="Guias prontas p/ faturar" value={guiasProntasParaFaturar} tone="amber" sub="sessões autorizadas 100% realizadas" />
        <KpiCard label="Guias vencendo em breve" value={guiasVencendo.length} tone="amber" sub={`senha/validade em até ${LIMITE_ALERTA_VALIDADE_DIAS} dias`} />
        <KpiCard label="Fichas pendentes (paciente)" value={fichasPendentes} tone="amber" sub="aguardando preenchimento remoto" />
        <KpiCard label="Fichas assinadas" value={fichasAssinadas} tone="green" sub="com termo LGPD aceito" />
        {stats.sessoesComOverrideManual>0 && (
          <KpiCard label="Sessões com preço manual (override)" value={stats.sessoesComOverrideManual} tone="red" sub="sem produto/TUSS vinculado — revisar cadastro" />
        )}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
        <div className="text-sm font-medium text-slate-700 mb-1">Competência × Caixa (P0-4)</div>
        <p className="text-[11px] text-slate-400 mb-3">Produção é o valor gerado pelas sessões atendidas (regime de competência); Recebimento é o que efetivamente entrou no caixa/convênio (regime de caixa). Os dois números não precisam bater no mesmo período.</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <KpiCard label="Produção (competência)" value={fmtBRL(competenciaVsCaixa.producao)} tone="teal" sub="sessões atendidas" />
          <KpiCard label="Recebimento particular" value={fmtBRL(competenciaVsCaixa.recebimentoParticular)} tone="green" sub="lançamentos de receita no caixa" />
          <KpiCard label="Recebimento convênio" value={fmtBRL(competenciaVsCaixa.recebimentoConvenio)} tone="green" sub="guias com status Paga" />
          <KpiCard label="A receber de convênio" value={fmtBRL(competenciaVsCaixa.totalAReceber)} tone="amber" sub="guias enviadas/glosadas ainda não pagas" />
        </div>
        <table className="w-full text-sm mt-3">
          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Faixa (dias desde envio)</th><th className="text-right py-1">Valor a receber</th></tr></thead>
          <tbody>
            {Object.entries(competenciaVsCaixa.buckets).map(([faixa,valor]) => (
              <tr key={faixa} className="border-t border-slate-100">
                <td className="py-1.5 text-slate-600">{faixa}</td>
                <td className="py-1.5 text-right font-medium text-amber-600">{fmtBRL(valor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Valor por convênio</div>
          <canvas ref={barRef} height="220"></canvas>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Agendamentos por status</div>
          <canvas ref={doughnutRef} height="220"></canvas>
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Glosas recentes</div>
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Guia</th><th className="text-left py-1">Convênio</th><th className="text-left py-1">Motivo</th><th className="text-right py-1">Valor</th></tr></thead>
          <tbody>
            {glosasList.length===0 && <tr><td colSpan="4" className="py-3 text-slate-400 text-center">Nenhuma glosa registrada.</td></tr>}
            {glosasList.map((g,i) => (
              <tr key={i} className="border-t border-slate-100">
                <td className="py-1.5">{g.numeroGuia}</td>
                <td className="py-1.5">{g.convenio}</td>
                <td className="py-1.5 text-slate-500">{g.motivo}</td>
                <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Glosas por convênio</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Convênio</th><th className="text-left py-1">Guias glosadas</th><th className="text-right py-1">Total</th></tr></thead>
            <tbody>
              {glosasPorConvenio.length===0 && <tr><td colSpan="3" className="py-3 text-slate-400 text-center">Sem glosas registradas.</td></tr>}
              {glosasPorConvenio.map((g,i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5">{g.convenio}</td>
                  <td className="py-1.5 text-slate-500">{g.qtd}</td>
                  <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Glosas por motivo</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Motivo</th><th className="text-left py-1">Ocorrências</th><th className="text-right py-1">Total</th></tr></thead>
            <tbody>
              {glosasPorMotivo.length===0 && <tr><td colSpan="3" className="py-3 text-slate-400 text-center">Sem glosas registradas.</td></tr>}
              {glosasPorMotivo.map((g,i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5">{g.motivo}</td>
                  <td className="py-1.5 text-slate-500">{g.qtd}</td>
                  <td className="py-1.5 text-right text-red-600 font-medium">{fmtBRL(g.valor)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="text-[11px] text-slate-400 mt-2">Use esse recorte para embasar renegociação com o convênio e priorizar correções que evitam glosas recorrentes.</p>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Resultado de caixa do dia</div>

            <tr className="border-b border-slate-100"><td className="py-1.5 text-slate-600">Entradas de caixa hoje (todas as formas)</td><td className="py-1.5 text-right font-medium text-green-600">{fmtBRL(caixaHoje.totalReceitas)}</td></tr>

          </tbody>
        </table>
        <p className="text-[11px] text-slate-400 mt-2">Sangrias e reforços não entram no resultado (são apenas movimentação física de caixa) — veja o detalhamento na aba Fluxo de Caixa. Para o demonstrativo de resultado por período (DRE), veja a sub-aba "DRE" acima.</p>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
        <div className="text-sm font-medium text-slate-700 mb-3">Vendas de pacotes/produtos — mês atual</div>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-3">
          <KpiCard label="Vendas no mês" value={vendasMes.length} tone="teal" />
          <KpiCard label="Total vendido no mês" value={fmtBRL(totalVendidoMes)} tone="green" />
          <KpiCard label="Comissão de vendas no mês" value={fmtBRL(comissaoVendasMes)} tone="amber" sub="a pagar aos vendedores" />
        </div>

          <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Top vendedores (atendentes)</th><th className="text-right py-1">Vendas</th><th className="text-right py-1">Total vendido</th></tr></thead>
          <tbody>
            {topVendedoresMes.length===0 && <tr><td colSpan="3" className="py-3 text-slate-400 text-center">Nenhuma venda registrada este mês.</td></tr>}
            {topVendedoresMes.map((v,i) => (
              <tr key={i} className="border-t border-slate-100">
                <td className="py-1.5">{v.nome}</td>
                <td className="py-1.5 text-right">{v.qtd}</td>
                <td className="py-1.5 text-right font-medium">{fmtBRL(v.total)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <p className="text-[11px] text-slate-400 mt-2">Vendas geradas ao vincular um produto/pacote no cadastro do cliente, atribuídas ao login do atendente que fez o cadastro. Veja o detalhamento completo na aba Vendas.</p>
      </div>

      {guiasVencendo.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mt-4">
          <div className="text-sm font-medium text-slate-700 mb-2">Guias com senha/validade vencendo em breve</div>
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-400 uppercase"><tr><th className="text-left py-1">Guia</th><th className="text-left py-1">Cliente</th><th className="text-left py-1">Convênio</th><th className="text-right py-1">Validade</th></tr></thead>
            <tbody>
              {guiasVencendo.map(g => {
                const cliente = clients.find(c=>c.id===g.clienteId);
                const d = diasParaVencer(g.validade);
                return (
                  <tr key={g.id} className="border-t border-slate-100">
                    <td className="py-1.5">{g.numeroGuia}</td>
                    <td className="py-1.5">{cliente?.nome}</td>
                    <td className="py-1.5 text-slate-500">{g.convenio}</td>
                    <td className="py-1.5 text-right text-amber-600 font-medium">{fmtDataBR(g.validade)} ({d < 0 ? `venceu há ${Math.abs(d)}d` : d===0 ? "hoje" : `${d}d`})</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Sub-aba "DRE": demonstrativo de resultado gerencial por período (mês dentro do ano, ou compilado/ano
// todo), mais uma tabela de evolução mensal do ano selecionado — espelhando a estrutura da planilha de
// referência (Receita bruta → deduções → custos → despesas → EBITDA → lucro líquido → margens).
function DashboardDRE({appointments, clients, guias, lancamentos, vendas, professionals}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const mesAtualNum = Number(TODAY.slice(5,7));
  const [ano, setAno] = useState(anoAtual);
  const [mes, setMes] = useState(mesAtualNum); // 0 = compilado (ano todo)
  const anos = [anoAtual-1, anoAtual, anoAtual+1];
  const ctx = {appointments, clients, guias, lancamentos, vendas, professionals};

  const dre = useMemo(() => computeDRE(ano, mes, ctx), [appointments, clients, guias, lancamentos, vendas, professionals, ano, mes]);
  const evolucaoMensal = useMemo(() => MESES_PT.map((nome, idx) => ({ nome, ...computeDRE(ano, idx+1, ctx) })), [appointments, clients, guias, lancamentos, vendas, professionals, ano]);

  const linhaDRE = (label, valor, opts={}) => (
    <tr className="border-b border-slate-100">
      <td className={"py-1.5 " + (opts.bold ? "text-slate-800 font-semibold" : "text-slate-600")}>{label}</td>
      <td className={"py-1.5 text-right " + (opts.bold ? "font-bold" : "font-medium") + " " + (opts.tone==="red" ? "text-red-600" : opts.tone==="green" ? "text-green-600" : "text-slate-700")}>{fmtBRL(valor)}</td>
    </tr>
  );

  return (

// Sub-aba "Indicadores Operacionais": atendimentos, comparecimento, ocupação, ticket médio, aquisição e
// possível evasão de pacientes — tudo calculado a partir de dados já existentes no sistema (não modela
// CAC/LTV de marketing pois o app não captura investimento em mídia/aquisição).
function DashboardIndicadores({appointments, clients, professionals}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const mesAtualNum = Number(TODAY.slice(5,7));
  const [ano, setAno] = useState(anoAtual);
  const [mes, setMes] = useState(mesAtualNum); // 0 = compilado (ano todo)
  const anos = [anoAtual-1, anoAtual, anoAtual+1];
  const periodoTipo = mes ? "mes" : "ano";
  const LIMITE_EVASAO_DIAS = 60;

  const indicadores = useMemo(() => {
    const apptsPeriodo = appointments.filter(a => noPeriodo(a.data, periodoTipo, mes, ano));
    const total = apptsPeriodo.length;
    const atendidos = apptsPeriodo.filter(a=>a.status==="atendido").length;
    const desmarcados = apptsPeriodo.filter(a=>a.status==="desmarcado").length;
    const faltas = apptsPeriodo.filter(a=>a.status==="faltou").length;
    const avaliacoes = apptsPeriodo.filter(a=>(a.tipo||"sessao")==="avaliacao").length;
    const taxaComparecimento = total>0 ? (atendidos/total*100) : 0;
    const taxaFaltas = total>0 ? (faltas/total*100) : 0;
    const taxaDesmarcacao = total>0 ? (desmarcados/total*100) : 0;

    const faturamentoPeriodo = apptsPeriodo.filter(a=>a.status==="atendido").reduce((s,a) => { const c = clients.find(cl=>cl.id===a.clienteId); return s + (c?.valorSessao||0); }, 0);
    const ticketMedio = atendidos>0 ? (faturamentoPeriodo/atendidos) : 0;

    const novosClientes = clients.filter(c => c.dataInicio && noPeriodo(c.dataInicio, periodoTipo, mes, ano)).length;
    const altas = clients.filter(c => c.alta && noPeriodo(c.alta.data, periodoTipo, mes, ano)).length;
    const pacientesAtivos = clients.filter(c => !c.alta).length;
    const pacientesUnicosNoPeriodo = new Set(apptsPeriodo.map(a=>a.clienteId)).size;

    const mesesNoPeriodo = mes ? 1 : 12;
    const horasDisponiveisTotais = professionals.reduce((s,prof) => s + (prof.dias?.length||0) * horasEntre(prof.horaInicio, prof.horaFim) * 4.33 * mesesNoPeriodo, 0);
    const taxaOcupacaoMedia = horasDisponiveisTotais>0 ? (atendidos/horasDisponiveisTotais*100) : 0;

    const evasao = clients.filter(c => {
      if (c.alta) return false;
      const apptsCliente = appointments.filter(a=>a.clienteId===c.id && a.status==="atendido");
      if (apptsCliente.length===0) return false;
      const ultima = apptsCliente.reduce((max,a) => a.data>max ? a.data : max, apptsCliente[0].data);
      const dias = Math.round((new Date(TODAY+"T00:00:00") - new Date(ultima+"T00:00:00"))/86400000);
      return dias > LIMITE_EVASAO_DIAS;
    }).length;

    return { total, atendidos, desmarcados, faltas, avaliacoes, taxaComparecimento, taxaFaltas, taxaDesmarcacao, ticketMedio, novosClientes, altas, pacientesAtivos, pacientesUnicosNoPeriodo, taxaOcupacaoMedia, evasao };
  }, [appointments, clients, professionals, ano, mes, periodoTipo]);

  return (
    <div>
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <Field label="Ano"><select className={inputCls + " max-w-[110px]"} value={ano} onChange={e=>setAno(Number(e.target.value))}>
          {anos.map(a => <option key={a} value={a}>{a}</option>)}
        </select></Field>
        <Field label="Período"><select className={inputCls + " max-w-[180px]"} value={mes} onChange={e=>setMes(Number(e.target.value))}>
          <option value={0}>Compilado (ano todo)</option>
          {MESES_PT.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
        </select></Field>
      </div>
      <p className="text-xs text-slate-400 mb-3">Indicadores referentes a {mes ? `${MESES_PT[mes-1]}/${ano}` : `${ano} (compilado)`}. Ocupação assume ~1h por sessão confirmada frente à disponibilidade cadastrada dos profissionais; evasão considera pacientes ativos (sem alta) sem nenhum atendimento há mais de {LIMITE_EVASAO_DIAS} dias.</p>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KpiCard label="Atendimentos realizados" value={indicadores.atendidos} tone="green" sub={`de ${indicadores.total} agendamentos`} />
        <KpiCard label="Taxa de comparecimento" value={`${indicadores.taxaComparecimento.toFixed(0)}%`} tone="teal" />
        <KpiCard label="Taxa de faltas" value={`${indicadores.taxaFaltas.toFixed(0)}%`} tone="red" />
        <KpiCard label="Taxa de desmarcação" value={`${indicadores.taxaDesmarcacao.toFixed(0)}%`} tone="amber" />
        <KpiCard label="Ticket médio por sessão" value={fmtBRL(indicadores.ticketMedio)} tone="teal" />
        <KpiCard label="Taxa de ocupação média" value={`${indicadores.taxaOcupacaoMedia.toFixed(0)}%`} tone={indicadores.taxaOcupacaoMedia>=70?"green":indicadores.taxaOcupacaoMedia>=40?"amber":"red"} />
        <KpiCard label="Pacientes atendidos no período" value={indicadores.pacientesUnicosNoPeriodo} tone="default" />
        <KpiCard label="Avaliações no período" value={indicadores.avaliacoes} tone="default" />
        <KpiCard label="Novos clientes" value={indicadores.novosClientes} tone="teal" />
        <KpiCard label="Altas no período" value={indicadores.altas} tone="green" />
        <KpiCard label="Pacientes ativos (base atual)" value={indicadores.pacientesAtivos} tone="default" />
        <KpiCard label={`Possível evasão (>${LIMITE_EVASAO_DIAS}d sem sessão)`} value={indicadores.evasao} tone={indicadores.evasao>0?"red":"default"} sub="pacientes ativos sem atendimento recente" />
      </div>
    </div>
  );
}

/* ---------------- Usuários e Permissões (lê/edita staff_profiles no Supabase) ---------------- */
function UsuariosPanel({currentUser}) {
  const [usuarios, setUsuarios] = useState(undefined); // undefined = carregando
  const [erro, setErro] = useState("");
  const [salvandoId, setSalvandoId] = useState(null);

  function recarregar(){
    setUsuarios(undefined);
    setErro("");
    if (!sbClient) { setErro("Cliente Supabase não carregou. Verifique sua conexão e recarregue a página."); setUsuarios([]); return; }
    sbClient.from("staff_profiles").select("*").order("nome").then(({data, error}) => {
      if (error) { setErro(error.message); setUsuarios([]); return; }
      setUsuarios(data || []);
    });
  }

  useEffect(() => { recarregar(); }, []);

  async function alterarRole(usuario, novoRole){
    setSalvandoId(usuario.id);
    const { error } = await sbClient.from("staff_profiles").update({ role: novoRole }).eq("id", usuario.id);
    setSalvandoId(null);
    if (error) { window.alert("Não foi possível salvar: " + error.message); return; }
    setUsuarios(list => list.map(u => u.id===usuario.id ? {...u, role:novoRole} : u));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-lg font-semibold text-slate-800">Usuários e permissões</h2>
        <button onClick={recarregar} className="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">Recarregar</button>
      </div>
      <div className="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-4">
        Aqui você troca o cargo/perfil de quem já tem login. Para criar um login novo (primeiro acesso de alguém), essa ação exige uma chave que não pode ficar no navegador por segurança — peça para quem administra o Supabase do projeto enviar o convite.
      </div>
      {erro && <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-3 mb-4">{erro}</div>}
      {usuarios === undefined ? (
        <div className="text-sm text-slate-400 py-8 text-center">Carregando...</div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
              <tr>
                <th className="text-left px-4 py-2">Nome</th>
                <th className="text-left px-4 py-2">Cargo/Perfil</th>
                <th className="text-left px-4 py-2">Criado em</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {usuarios.length===0 && <tr><td colSpan="4" className="text-center py-4 text-slate-400">Nenhum usuário encontrado.</td></tr>}
              {usuarios.map(u => (
                <tr key={u.id} className="border-t border-slate-100">
                  <td className="px-4 py-2 font-medium text-slate-800">
                    {u.nome}
                    {u.id===currentUser?.id && <span className="ml-2 text-[10px] text-teal-600 font-normal">(você)</span>}
                  </td>
                  <td className="px-4 py-2">
                    <select value={u.role} disabled={salvandoId===u.id} onChange={e=>alterarRole(u, e.target.value)}
                      className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
                      {Object.entries(PERMISSOES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                    </select>
                  </td>
                  <td className="px-4 py-2 text-slate-500 text-xs">{u.created_at ? fmtDataBR(String(u.created_at).slice(0,10)) : "—"}</td>
                  <td className="px-4 py-2 text-right text-xs text-slate-400">{salvandoId===u.id ? "Salvando..." : ""}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function SetPasswordScreen({email, onDone}) {
  const [senha, setSenha] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

    e.preventDefault();
    if (senha.length < 6) { setErro("A senha precisa ter pelo menos 6 caracteres."); return; }

  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
