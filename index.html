// ---------------- Link público de cadastro do paciente ----------------
// RN pedida explicitamente pelo usuário: link que o paciente recebe e usa para se cadastrar sozinho,
// enviando os documentos exigidos pelo convênio (variam por plano — ver Convenio.documentosExigidos),
// com o sistema conferindo os dados do pedido médico (CID, data, descrição) antes de aceitar; se faltar
// algo, mostra exatamente o que falta. Se estiver tudo certo: "sobe" o documento (simulado — ver decisão
// abaixo), notifica faturamento ("documento pronto para solicitar guia") e recepção ("novo paciente
// cadastrado").
//
// Limitações assumidas conscientemente neste protótipo (decisões tomadas com o usuário):
// 1) Sem backend próprio: este projeto é só HTML/JS estático (GitHub Pages) + localStorage. Esta tela lê
//    e grava nas MESMAS chaves de localStorage que o App usa ("clients", "log", "convenios") — ou seja,
//    o fluxo completo só sincroniza de fato quando aberto no MESMO navegador/dispositivo do sistema
//    principal. Um paciente abrindo o link no celular dele NÃO vai aparecer automaticamente para a
//    clínica em outro computador — isso exigiria migrar a persistência para um banco compartilhado
//    (Supabase), pendência já documentada e propositalmente adiada para depois desta demonstração.
// 2) "Sobe pro Drive" é simulado: o arquivo fica salvo como anexo do cliente (base64), marcado
//    enviadoDrive:true só para fins de demonstração — não há integração real com a API do Google Drive
//    (exigiria credenciais/backend próprios, fora do escopo de um protótipo estático).
// 3) A "conferência" do pedido médico não lê o conteúdo do arquivo enviado (não há OCR/IA de documento
//    neste protótipo) — o paciente preenche CID, data e descrição em campos de formulário ao lado do
//    upload, e é isso que o sistema valida.
const CID_REGEX = /^[A-Za-z][0-9]{2}(\.[0-9]{1,2})?$/;

function lerArquivoBase64(file){
  return new Promise((resolve, reject) => {
    if (file.size > 8*1024*1024) { reject(new Error("Arquivo muito grande para este protótipo (máx. ~8MB).")); return; }
    const reader = new FileReader();
    reader.onload = (ev) => resolve(String(ev.target.result));
    reader.onerror = () => reject(new Error("Não foi possível ler o arquivo."));
    reader.readAsDataURL(file);
  });
}

function CadastroPublicoPage() {
  const [convenios] = useState(() => loadPersisted("convenios", conveniosIniciais));
  const [tipoPagamento, setTipoPagamento] = useState("convenio"); // "convenio" | "particular" | "bolsa"
  const [convenioNome, setConvenioNome] = useState("");
  const [form, setForm] = useState({ nome:"", telefone:"", email:"", cpf:"", dataNascimento:"", endereco:"", telefoneEmergencia:"", medico:"", numeroCarteirinha:"" });
  const [uploads, setUploads] = useState({}); // { [docId]: {arquivoNome, conteudoBase64, cid, dataPedido, descricaoPedido} }
  const [erros, setErros] = useState([]);
  const [enviando, setEnviando] = useState(false);
  const [sucesso, setSucesso] = useState(null); // nome do paciente após envio

  const conveniosAtivos = useMemo(() => convenios.filter(c => c.ativo && c.nome !== "Particular"), [convenios]);
  const convenioSelecionado = conveniosAtivos.find(c => c.nome === convenioNome) || null;
  const documentosExigidos = tipoPagamento === "convenio" && convenioSelecionado ? (convenioSelecionado.documentosExigidos||[]) : [];

  function atualizarUpload(docId, campo, valor){
    setUploads(u => ({...u, [docId]: {...(u[docId]||{}), [campo]: valor}}));
  }

  async function handleArquivo(docId, file){
    if (!file) return;
    try {
      const base64 = await lerArquivoBase64(file);
      setUploads(u => ({...u, [docId]: {...(u[docId]||{}), conteudoBase64: base64, arquivoNome: file.name}}));
    } catch (e) {
      window.alert(e.message);
    }
  }

  function validar(){
    const problemas = [];
    if (!form.nome.trim()) problemas.push("Nome completo é obrigatório.");
    if (!form.telefone.trim()) problemas.push("Telefone é obrigatório.");
    if (!form.cpf.trim()) problemas.push("CPF é obrigatório.");
    if (!form.dataNascimento) problemas.push("Data de nascimento é obrigatória.");
    if (tipoPagamento === "convenio") {
      if (!convenioNome) problemas.push("Selecione o convênio.");
      if (!form.numeroCarteirinha.trim()) problemas.push("Número da carteirinha do convênio é obrigatório.");
      documentosExigidos.forEach(doc => {
        const up = uploads[doc.id];
        if (!up || !up.conteudoBase64) {
          problemas.push(`Envie o arquivo de "${doc.nome}".`);
          return;
        }
        if (doc.requerDadosPedido) {
          if (!up.cid || !up.cid.trim()) problemas.push(`Informe o CID do pedido médico ("${doc.nome}").`);
          else if (!CID_REGEX.test(up.cid.trim())) problemas.push(`CID do pedido médico ("${doc.nome}") em formato inválido — use o padrão CID-10, ex.: M54.5.`);
          if (!up.dataPedido) problemas.push(`Informe a data do pedido médico ("${doc.nome}").`);
          if (!up.descricaoPedido || !up.descricaoPedido.trim()) problemas.push(`Informe a descrição do pedido médico ("${doc.nome}").`);
        }
      });
    }
    return problemas;
  }

  function handleEnviar(e){
    e.preventDefault();
    const problemas = validar();
    setErros(problemas);
    if (problemas.length > 0) {
      window.scrollTo({top:0, behavior:"smooth"});
      return;
    }
    setEnviando(true);
    const clienteId = "c" + Date.now();
    const documentosAnexados = documentosExigidos.map(doc => {
      const up = uploads[doc.id] || {};
      return {
        id: "doc" + Date.now() + "_" + doc.id,
        nome: doc.nome,
        arquivoNome: up.arquivoNome || "",
        conteudoBase64: up.conteudoBase64 || "",
        dataUpload: TODAY,
        enviadoDrive: true, // simulado — ver nota no topo do arquivo
        cid: doc.requerDadosPedido ? (up.cid||"").trim() : "",
        dataPedido: doc.requerDadosPedido ? (up.dataPedido||"") : "",
        descricaoPedido: doc.requerDadosPedido ? (up.descricaoPedido||"").trim() : "",
      };
    });
    const novoCliente = {
      id: clienteId, nome: form.nome.trim(), telefone: form.telefone.trim(), email: form.email.trim(),
      endereco: form.endereco.trim(), dataNascimento: form.dataNascimento, cpf: form.cpf.trim(),
      numeroCarteirinha: tipoPagamento==="convenio" ? form.numeroCarteirinha.trim() : "",
      convenio: tipoPagamento==="convenio" ? convenioNome : "",
      pagamento: {tipo: tipoPagamento, numeroGuia:""},
      medico: form.medico.trim(), telefoneEmergencia: form.telefoneEmergencia.trim(),
      tratamento:"", pacoteNome:"", sessoesTotal:0, dataInicio: TODAY, profissionaisIds:[], valorSessao:0,
      alta:null, horariosFixos:[], produtoId:null, descontoAplicado:0, parcelas:1, biometriaCadastrada:false,
      observacoes:"", origemCadastro:"link_publico", documentosAnexados,
    };
    const clientesAtuais = loadPersisted("clients", initialClients);
    savePersisted("clients", [...clientesAtuais, novoCliente]);

    // Notificações (RN pedida explicitamente pelo usuário): registradas no mesmo log/canal "Push" já
    // usado no resto do sistema. Como esta tela roda no navegador do PACIENTE (sem login), o disparo real
    // de notificação de navegador (Web Notification API) não faz sentido aqui — só apareceria na tela do
    // paciente, não da equipe. O que fica garantido é o registro no log compartilhado, visível para
    // faturamento/recepção na aba Notificações assim que abrirem o sistema (no mesmo navegador — ver nota
    // de limitação no topo do arquivo).
    const logAtual = loadPersisted("log", []);
    const novasEntradas = [
      {id: Date.now()+1, ts:"agora", canal:"Push", msg: `📎 Documentos de ${novoCliente.nome} prontos para solicitar guia (faturamento).`},
      {id: Date.now()+2, ts:"agora", canal:"Push", msg: `🧾 Novo paciente cadastrado: ${novoCliente.nome} (recepção).`},
    ];
    savePersisted("log", [...novasEntradas, ...logAtual].slice(0,30));

    setEnviando(false);
    setSucesso(novoCliente.nome);
  }

  if (sucesso) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
        <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-8 w-full max-w-md text-center">
          <div className="text-3xl mb-3">✅</div>
          <div className="text-lg font-semibold text-slate-800 mb-2">Cadastro enviado!</div>
          <p className="text-sm text-slate-500 mb-4">Obrigado, {sucesso}. Recebemos seus dados e documentos. Nossa equipe vai revisar e entrar em contato para agendar sua avaliação.</p>
          <p className="text-[11px] text-slate-400">Protótipo de demonstração — este cadastro fica salvo apenas neste navegador.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-100 py-8 px-4">
      <div className="max-w-xl mx-auto">
        <div className="text-center mb-6">
          <div className="text-xl font-bold text-teal-700">PhysioFlow</div>
          <div className="text-sm text-slate-500">Cadastro de paciente</div>
        </div>

        {erros.length > 0 && (
          <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-4 text-sm">
            <div className="font-medium mb-1">Antes de enviar, corrija:</div>
            <ul className="list-disc list-inside space-y-0.5">
              {erros.map((e,i) => <li key={i}>{e}</li>)}
            </ul>
          </div>
        )}

        <form onSubmit={handleEnviar} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
          <div>
            <div className="text-sm font-medium text-slate-700 mb-2">Seus dados</div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Nome completo"><input className={inputCls} value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
              <Field label="Telefone"><input className={inputCls} value={form.telefone} onChange={e=>setForm({...form,telefone:e.target.value})} /></Field>
              <Field label="E-mail"><input type="email" className={inputCls} value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></Field>
              <Field label="CPF"><input className={inputCls} value={form.cpf} onChange={e=>setForm({...form,cpf:e.target.value})} /></Field>
              <Field label="Data de nascimento"><DateInput value={form.dataNascimento} onChange={v=>setForm({...form,dataNascimento:v})} /></Field>
              <Field label="Telefone de emergência"><input className={inputCls} value={form.telefoneEmergencia} onChange={e=>setForm({...form,telefoneEmergencia:e.target.value})} /></Field>
              <div className="col-span-2"><Field label="Endereço"><input className={inputCls} value={form.endereco} onChange={e=>setForm({...form,endereco:e.target.value})} /></Field></div>
              <div className="col-span-2"><Field label="Médico responsável (opcional)"><input className={inputCls} value={form.medico} onChange={e=>setForm({...form,medico:e.target.value})} /></Field></div>
            </div>
          </div>

          <div className="border-t border-slate-100 pt-4">
            <div className="text-sm font-medium text-slate-700 mb-2">Como você paga o tratamento?</div>
            <div className="flex gap-1 bg-slate-100 rounded-lg p-1 w-fit mb-3">
              {[["convenio","Convênio"],["particular","Particular"],["bolsa","Bolsa"]].map(([id,label]) => (
                <button type="button" key={id} onClick={()=>setTipoPagamento(id)} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (tipoPagamento===id ? "bg-white shadow text-teal-700" : "text-slate-500")}>{label}</button>
              ))}
            </div>
            {tipoPagamento === "convenio" && (
              <div className="grid grid-cols-2 gap-3">
                <Field label="Convênio">
                  <select className={inputCls} value={convenioNome} onChange={e=>{setConvenioNome(e.target.value); setUploads({});}}>
                    <option value="">Selecione...</option>
                    {conveniosAtivos.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                  </select>
                </Field>
                <Field label="Nº da carteirinha"><input className={inputCls} value={form.numeroCarteirinha} onChange={e=>setForm({...form,numeroCarteirinha:e.target.value})} /></Field>
              </div>
            )}
          </div>

          {documentosExigidos.length > 0 && (
            <div className="border-t border-slate-100 pt-4">
              <div className="text-sm font-medium text-slate-700 mb-1">Documentos exigidos pelo {convenioNome}</div>
              <p className="text-[11px] text-slate-400 mb-3">Envie uma foto ou PDF de cada documento abaixo.</p>
              <div className="space-y-3">
                {documentosExigidos.map(doc => {
                  const up = uploads[doc.id] || {};
                  return (
                    <div key={doc.id} className="border border-slate-200 rounded-lg p-3">
                      <div className="text-sm font-medium text-slate-700 mb-1">{doc.nome}</div>
                      <input type="file" accept="image/*,application/pdf" onChange={e=>handleArquivo(doc.id, e.target.files[0])} className="text-xs" />
                      {up.arquivoNome && <div className="text-[11px] text-teal-600 mt-1">✓ {up.arquivoNome}</div>}
                      {doc.requerDadosPedido && (
                        <div className="grid grid-cols-2 gap-2 mt-2">
                          <Field label="CID"><input className={inputCls} placeholder="Ex.: M54.5" value={up.cid||""} onChange={e=>atualizarUpload(doc.id,"cid",e.target.value)} /></Field>
                          <Field label="Data do pedido"><DateInput value={up.dataPedido||""} onChange={v=>atualizarUpload(doc.id,"dataPedido",v)} /></Field>
                          <div className="col-span-2"><Field label="Descrição do pedido"><input className={inputCls} value={up.descricaoPedido||""} onChange={e=>atualizarUpload(doc.id,"descricaoPedido",e.target.value)} /></Field></div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <button type="submit" disabled={enviando} className="w-full px-4 py-2.5 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-50 font-medium">
            {enviando ? "Enviando..." : "Enviar cadastro"}
          </button>
          <p className="text-[11px] text-slate-400 text-center">Seus dados e documentos são usados apenas para o atendimento na clínica, conforme a LGPD.</p>
        </form>
      </div>
    </div>
  );
}

function AuthGate() {
  // Link público de cadastro (RN pedida explicitamente pelo usuário): ?cadastro=1 bypassa totalmente o
  // login — é a página que o paciente abre a partir do link compartilhado pela recepção/gestão.
  const modoCadastroPublico = useMemo(() => new URLSearchParams(window.location.search).get("cadastro") === "1", []);
  if (modoCadastroPublico) {
    return <CadastroPublicoPage />;
  }
  const [session, setSession] = useState(undefined); // undefined = carregando, null = deslogado
  const [profile, setProfile] = useState(undefined); // undefined = carregando, null = sem perfil, obj = ok
  const [erroPerfil, setErroPerfil] = useState("");
  // Detecta, já na primeira renderização (antes do supabase-js consumir o hash da URL),
  // se o usuário veio de um link de convite ou de recuperação de senha — nesses casos
  // ele ainda não tem senha própria definida (ou está redefinindo) e precisa passar por essa etapa.
  const [precisaDefinirSenha, setPrecisaDefinirSenha] = useState(() => {
    const hash = window.location.hash || "";
    return hash.includes("type=invite") || hash.includes("type=recovery");
  });

  useEffect(() => {
    if (!sbClient) { setSession(null); return; }
    sbClient.auth.getSession().then(({data}) => setSession(data.session || null));
    const { data: listener } = sbClient.auth.onAuthStateChange((_event, s) => setSession(s || null));
    return () => listener?.subscription?.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(session === null ? null : undefined); return; }
    setProfile(undefined);
    setErroPerfil("");
    sbClient.from("staff_profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({data, error}) => {
        if (error) { setErroPerfil(error.message); setProfile(null); return; }
        setProfile(data || null);
      });
  }, [session]);

  function handleLogout(){
    if (sbClient) sbClient.auth.signOut();
    setSession(null);
    setProfile(undefined);
  }

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">Carregando...</div>;
  }
  if (session === null) {
    return <LoginScreen onLoggedIn={setSession} />;
  }
  if (precisaDefinirSenha) {
    return <SetPasswordScreen email={session.user.email} onDone={() => {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
      setPrecisaDefinirSenha(false);
    }} />;
  }
  if (profile === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">Carregando perfil...</div>;
  }
  if (profile === null) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
        <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-8 w-full max-w-sm text-center">
          <div className="text-sm font-medium text-slate-700 mb-2">Login feito, mas sem perfil de acesso</div>
          <div className="text-xs text-slate-500 mb-1">Sua conta ({session.user.email}) foi autenticada, mas ainda não existe um perfil (staff_profiles) associado a ela.</div>
          {erroPerfil && <div className="text-[11px] text-red-500 mb-3">{erroPerfil}</div>}
          <div className="text-xs text-slate-500 mb-4">Peça para o gestor da clínica cadastrar seu usuário.</div>
          <button onClick={handleLogout} className="text-xs text-teal-700 underline">Sair</button>
        </div>
      </div>
    );
  }
  const currentUser = { id: profile.id, nome: profile.nome || session.user.email, role: profile.role, email: session.user.email };
  return <App currentUser={currentUser} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);
</script>
</body>
