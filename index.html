function getWeekdayLabel(dataIso){
  const d = new Date(dataIso + "T00:00:00");
  return DIAS_SEMANA_JS[d.getDay()];
}
function horasEntre(inicio, fim){
  if (!inicio || !fim) return 0;
  const [h1,m1] = inicio.split(":").map(Number);
  const [h2,m2] = fim.split(":").map(Number);
  return Math.max(0, (h2 + m2/60) - (h1 + m1/60));
}
function getInicioSemana(dataIso){ // segunda-feira da semana que contém dataIso
  const d = new Date(dataIso + "T00:00:00");
  const dia = d.getDay(); // 0=Dom..6=Sáb
  d.setDate(d.getDate() + (dia===0 ? -6 : 1-dia));
  return d.toISOString().slice(0,10);
}
function getFimSemana(dataIso){
  const d = new Date(getInicioSemana(dataIso) + "T00:00:00");
  d.setDate(d.getDate()+6);
  return d.toISOString().slice(0,10);
}

function formatarRemuneracao(prof){
  if (prof.comissaoTipo === "salario") return `${fmtBRL(prof.salarioFixoMensal||0)} salário${prof.bonusMensal ? ` + ${fmtBRL(prof.bonusMensal)} bônus` : ""}/mês`;
  if (prof.comissaoTipo === "fixo") return `${fmtBRL(prof.comissaoValorSessao||0)}/sessão`;
  return `${prof.comissaoPercentual??0}% sobre faturamento`;
}
function fmtDataBR(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }

// ---- Ponto eletrônico / banco de horas / fechamento mensal ----
const TOLERANCIA_HORA_EXTRA_MIN = 10; // minutos de tolerância antes de considerar hora extra
function minutosEntre(isoInicio, isoFim){ return (new Date(isoFim) - new Date(isoInicio)) / 60000; }
function calcularJornadaEsperadaMin(prof){
  if (!prof || !prof.horaInicio || !prof.horaFim) return 0;
  const [hi,mi] = prof.horaInicio.split(":").map(Number);
  const [hf,mf] = prof.horaFim.split(":").map(Number);
  return Math.max(0, (hf*60+mf) - (hi*60+mi));
}
// Junta as marcações do dia em pares entrada→saída e soma os minutos efetivamente trabalhados.
function minutosTrabalhadosNoDia(profissionalId, dataDia, pontoRegistros){
  const doDia = pontoRegistros.filter(r=>r.profissionalId===profissionalId && r.timestamp.slice(0,10)===dataDia).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  let total = 0;
  for (let i=0; i<doDia.length-1; i+=2) {
    if (doDia[i].tipo==="entrada" && doDia[i+1]?.tipo==="saida") total += minutosEntre(doDia[i].timestamp, doDia[i+1].timestamp);
  }
  return total;
}
function diasComPontoNoMes(profissionalId, mes, ano, pontoRegistros){
  const dias = new Set();
  pontoRegistros.filter(r=>r.profissionalId===profissionalId).forEach(r=>{
    const [y,m] = r.timestamp.slice(0,7).split("-").map(Number);
    if (y===ano && m===mes) dias.add(r.timestamp.slice(0,10));
  });
  return Array.from(dias).sort();
}
// Saldo do banco de horas: déficits (trabalhou menos que o esperado) entram sozinhos; excedentes só entram
// depois que o gestor liberar com a própria senha (RN pedida pelo usuário) — senão ficam de fora do saldo.
function calcularSaldoBancoHoras(profissionalId, professionals, pontoRegistros, horasExtras){
  const prof = professionals.find(p=>p.id===profissionalId);
  if (!prof) return 0;
  const jornadaMin = calcularJornadaEsperadaMin(prof);
  const dias = new Set(pontoRegistros.filter(r=>r.profissionalId===profissionalId).map(r=>r.timestamp.slice(0,10)));
  let saldoMin = 0;
  dias.forEach(dia => {
    const trabalhadoMin = minutosTrabalhadosNoDia(profissionalId, dia, pontoRegistros);
    if (trabalhadoMin <= 0) return;
    const delta = trabalhadoMin - jornadaMin;
    if (delta <= 0) { saldoMin += delta; return; }
    const extra = horasExtras.find(h=>h.profissionalId===profissionalId && h.data===dia);
    if (extra && extra.status==="aprovada") saldoMin += delta;
  });
  return saldoMin;
}
function formatarSaldoHoras(minutos){
  const sinal = minutos < 0 ? "-" : "";
  const abs = Math.round(Math.abs(minutos));
  const h = Math.floor(abs/60), m = abs%60;
  return `${sinal}${h}h${String(m).padStart(2,"0")}`;
}
// Fechamento mensal: dias com ponto batido, horas totais, saldo do banco de horas e o valor de
// pagamento + vale-transporte + vale-alimentação a pagar no mês seguinte, por profissional.
function gerarFechamentoMensal(professionals, pontoRegistros, horasExtras, mes, ano){
  return professionals.map(prof => {
    const dias = diasComPontoNoMes(prof.id, mes, ano, pontoRegistros);
    const minutosTotais = dias.reduce((s,d)=>s+minutosTrabalhadosNoDia(prof.id, d, pontoRegistros), 0);
    const saldoBancoHoras = calcularSaldoBancoHoras(prof.id, professionals, pontoRegistros, horasExtras);
    const diasTrabalhados = dias.length;
    const valorVT = diasTrabalhados * (prof.valorValeTransporteDia||0);
    const valorVA = diasTrabalhados * (prof.valorValeAlimentacaoDia||0);
    const valorSalario = prof.comissaoTipo === "salario" ? (prof.salarioFixoMensal||0) + (prof.bonusMensal||0) : 0;
    return { profissional: prof, diasTrabalhados, minutosTotais, saldoBancoHoras, valorVT, valorVA, valorSalario, valorTotal: valorSalario + valorVT + valorVA };
  });
}

}

/* ---------------- Sinalização do agendamento (pagamento, última sessão, evolução) ---------------- */
// Avaliação não exige pagamento vinculado (é o primeiro contato do cliente).
function pagamentoOk(appt, cliente){
  if (!cliente) return true;
  if ((appt.tipo||"sessao") === "avaliacao") return true;
  if (cliente.pagamento.tipo === "bolsa") return true;
  if (cliente.pagamento.tipo === "convenio") return !!appt.guiaId;
  return !!appt.pagamentoVinculado;
}

// Nº da sessão auto-computado (P0-3, RN-3.2.4): conta quantos atendimentos já concluídos ("atendido")
// existem antes deste, para o mesmo cliente + mesma guia (ou mesmo "balde" particular quando não há guia).
function getSessaoAtual(appt, appointments){
  const mesmoBalde = a => a.clienteId===appt.clienteId && (a.tipo||"sessao")!=="avaliacao" && ((appt.guiaId||"") === (a.guiaId||""));
  const atendidasAntes = appointments.filter(a =>
    a.id!==appt.id && mesmoBalde(a) && a.status==="atendido" &&
    (a.data < appt.data || (a.data===appt.data && a.hora < appt.hora))
  ).length;
  return atendidasAntes + 1;
}

function isUltimaSessao(appt, cliente, guias, appointments){
  if (!cliente || (appt.tipo||"sessao") === "avaliacao") return false;
  let total = cliente.sessoesTotal;
  if (cliente.pagamento.tipo === "convenio" && appt.guiaId) {
    const guia = guias.find(g=>g.id===appt.guiaId);
    if (guia) total = guia.quantidadeAutorizada;
  }
  const sessaoAtual = appointments ? getSessaoAtual(appt, appointments) : appt.sessaoAtual;
  return sessaoAtual >= total;
}

function isEvolucaoAtrasada(appt, fichas){
  if (appt.status !== "atendido") return false;
  if (appt.data >= TODAY) return false;
  return !fichas.some(f => f.clienteId===appt.clienteId && f.data===appt.data && f.status!=="pendente_paciente");
}

const SINALIZACAO_CONFIG = {
  vermelha: { dot:"bg-red-500",    label:"Sem pagamento vinculado" },
  verde:    { dot:"bg-green-500",  label:"Avaliação" },
  amarela:  { dot:"bg-amber-400",  label:"Última sessão do pacote/guia" },
  laranja:  { dot:"bg-orange-500", label:"Evolução em atraso" },
  guia:     { dot:"bg-pink-500",   label:"Guia com saldo baixo ou vencendo" },
};

function getSinalizacao(appt, cliente, guias, fichas, appointments){
  if ((appt.tipo||"sessao") === "avaliacao") return "verde";
  if (!pagamentoOk(appt, cliente)) return "vermelha";
  const guiaVinculada = appt.guiaId ? (guias||[]).find(g=>g.id===appt.guiaId) : null;
  if (guiaVinculada && guiaAlertaSaldoOuValidade(guiaVinculada)) return "guia";
  if (isUltimaSessao(appt, cliente, guias, appointments)) return "amarela";
  if (isEvolucaoAtrasada(appt, fichas)) return "laranja";
  return null;
}

/* ---------------- P0-2: Bloqueio de saldo/validade de guia (RN-5.1) ---------------- */
// Bloqueia (com possibilidade de exceção consciente/registrada) marcar uma sessão de convênio como
// atendida quando a guia não tem saldo de sessões ou já venceu. Nunca "clampa" silenciosamente o saldo.
function avaliarBloqueioGuia(guia){
  if (!guia) return null;
  if (guia.quantidadeUtilizada >= guia.quantidadeAutorizada) {
    return { motivo:`Guia ${guia.numeroGuia} sem sessões disponíveis (${guia.quantidadeUtilizada}/${guia.quantidadeAutorizada} já utilizadas).` };
  }
  if (guia.validade && guia.validade < TODAY) {
    return { motivo:`Guia ${guia.numeroGuia} vencida em ${fmtDataBR(guia.validade)}.` };
  }
  return null;
}

// Alerta (não bloqueante) exibido no card da Agenda quando a guia está perto do limite.
function guiaAlertaSaldoOuValidade(guia){
  if (!guia) return null;
  const restantes = guia.quantidadeAutorizada - guia.quantidadeUtilizada;
  const dias = diasParaVencer(guia.validade);
  if (restantes <= 3) return `Restam ${Math.max(restantes,0)} sessão(ões) na guia`;
  if (dias <= 7) return `Guia vence em ${dias < 0 ? "—" : dias===0 ? "hoje" : dias+"d"}`;
  return null;
}

/* ---------------- P0-3: Detecção de conflitos de agenda (RN-3.1) ---------------- */
function horariosSobrepoem(hora1, dur1, hora2, dur2){
  const toMin = h => { const [hh,mm]=(h||"00:00").split(":").map(Number); return hh*60+mm; };
  const ini1=toMin(hora1), fim1=ini1+(dur1||50);
  const ini2=toMin(hora2), fim2=ini2+(dur2||50);
  return ini1 < fim2 && ini2 < fim1;
}

function apptFimHora(appt){
  const [h,m] = appt.hora.split(":").map(Number);
  const total = h*60+m+(appt.duracaoMin||50);
  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
}

// Retorna a lista de conflitos encontrados para o agendamento `appt` frente aos demais `appointments`.
// tipo:"expediente" é aviso (soft-block, exige confirmação consciente); os demais são bloqueio duro.
function detectarConflitos(appt, appointments, professionals, clients, permitirForaExpediente){
  const conflitos = [];
  const outros = (appointments||[]).filter(a => a.id!==appt.id && a.data===appt.data && a.status!=="remarcado" && a.status!=="desmarcado");
  const nomeCliente = id => clients.find(c=>c.id===id)?.nome || "cliente";
  const nomeProf = id => professionals.find(p=>p.id===id)?.nome || "profissional";

  outros.filter(a=>a.profissionalId===appt.profissionalId).forEach(a => {
    if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
      conflitos.push({ tipo:"profissional", msg:`${nomeProf(appt.profissionalId)} já tem um atendimento às ${a.hora} com ${nomeCliente(a.clienteId)}.`, apptConflitante:a });
    }
  });

  outros.filter(a=>a.clienteId===appt.clienteId).forEach(a => {
    if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
      conflitos.push({ tipo:"cliente", msg:`${nomeCliente(appt.clienteId)} já tem outro atendimento agendado às ${a.hora} com ${nomeProf(a.profissionalId)}.`, apptConflitante:a });
    }
  });

  const prof = professionals.find(p=>p.id===appt.profissionalId);
  if (prof?.sala) {
    outros.filter(a=>{
      const p2 = professionals.find(pp=>pp.id===a.profissionalId);
      return p2?.sala === prof.sala && a.profissionalId !== appt.profissionalId;
    }).forEach(a => {
      if (horariosSobrepoem(appt.hora, appt.duracaoMin, a.hora, a.duracaoMin)) {
        conflitos.push({ tipo:"sala", msg:`Sala "${prof.sala}" já está ocupada às ${a.hora} por ${nomeProf(a.profissionalId)}.`, apptConflitante:a });
      }
    });
  }

  if (prof && !permitirForaExpediente) {
    const diaSemana = getWeekdayLabel(appt.data);
    const dentroDoDia = (prof.dias||[]).includes(diaSemana);
    const dentroDoHorario = appt.hora >= prof.horaInicio && apptFimHora(appt) <= prof.horaFim;
    if (!dentroDoDia || !dentroDoHorario) {
      conflitos.push({ tipo:"expediente", msg:`Horário fora do expediente cadastrado de ${prof.nome} (${(prof.dias||[]).join(", ")}, ${prof.horaInicio}–${prof.horaFim}).` });
    }
  }

  return conflitos;
}

// Sugere até 3 horários livres mais próximos para o mesmo profissional/dia, dentro do expediente cadastrado.
function sugerirHorariosLivres(profissionalId, data, appointments, professionals, duracaoMin){
  const prof = professionals.find(p=>p.id===profissionalId);
  if (!prof || !prof.horaInicio || !prof.horaFim) return [];
  const ocupados = (appointments||[]).filter(a=>a.profissionalId===profissionalId && a.data===data && a.status!=="remarcado" && a.status!=="desmarcado");
  const sugestoes = [];
  const [hIni,mIni] = prof.horaInicio.split(":").map(Number);
  const [hFim,mFim] = prof.horaFim.split(":").map(Number);
  let cursor = hIni*60+mIni;
  const fimExpediente = hFim*60+mFim;
  let guarda = 0;
  while (cursor + (duracaoMin||50) <= fimExpediente && sugestoes.length < 3 && guarda < 200) {
    guarda++;
    const horaStr = String(Math.floor(cursor/60)).padStart(2,"0")+":"+String(cursor%60).padStart(2,"0");
    const livre = !ocupados.some(a => horariosSobrepoem(horaStr, duracaoMin, a.hora, a.duracaoMin));
    if (livre) sugestoes.push(horaStr);
    cursor += 15;
  }
  return sugestoes;
}

/* ---------------- App ---------------- */
function App({currentUser, onLogout}) {

  const [professionals, setProfessionals] = useState(() => loadPersisted("professionals", initialProfessionals));
  const [clients, setClients] = useState(() => loadPersisted("clients", initialClients));
  const [appointments, setAppointments] = useState(() => loadPersisted("appointments", initialAppointments));
  const [guias, setGuias] = useState(() => loadPersisted("guias", guiasIniciais));
  const [lancamentos, setLancamentos] = useState(() => loadPersisted("lancamentos", lancamentosIniciais));
  const [fechamentos, setFechamentos] = useState(() => loadPersisted("fechamentos", {})); // { "2026-07-22": {valorFisico, valorSistema, diferenca, ts} }
  const [modelosFicha, setModelosFicha] = useState(() => loadPersisted("modelosFicha", modelosFichaIniciais));
  const [fichas, setFichas] = useState(() => loadPersisted("fichas", fichasIniciais));
  const [convenios, setConvenios] = useState(() => loadPersisted("convenios", conveniosIniciais));
  const [produtos, setProdutos] = useState(() => loadPersisted("produtos", produtosIniciais));
  const [unidades, setUnidades] = useState(() => loadPersisted("unidades", unidadesIniciais));
  const [procedimentosTuss, setProcedimentosTuss] = useState(() => loadPersisted("procedimentosTuss", procedimentosTussIniciais));
  // Ponto eletrônico: marcações de entrada/saída (biometria simulada) e solicitações de hora extra
  // que ficam pendentes até o gestor liberar com a própria senha (RN pedida pelo usuário).
  const [pontoRegistros, setPontoRegistros] = useState(() => loadPersisted("pontoRegistros", []));
  const [horasExtras, setHorasExtras] = useState(() => loadPersisted("horasExtras", []));
  const [selectedDate, setSelectedDate] = useState(TODAY);
  const [unidadeFiltro, setUnidadeFiltro] = useState(() => loadPersisted("unidadeFiltro", "todas")); // P0-1: dimensão global de unidade
  const [notifyEnabled, setNotifyEnabled] = useState(() => loadPersisted("notifyEnabled", true));
  const [log, setLog] = useState(() => loadPersisted("log", [
    { id:1, ts:"22/07 08:12", canal:"WhatsApp", msg:"Confirmação enviada para Ana Beatriz Lima — sessão hoje às 08:30 com Dra. Marina Alves." },
    { id:2, ts:"22/07 07:05", canal:"E-mail", msg:"Lembrete enviado para Bruno Cardoso — sessão hoje às 07:30 com Dr. Rafael Souza." },
  ]));

  useEffect(()=>{ savePersisted("professionals", professionals); }, [professionals]);
  useEffect(()=>{ savePersisted("clients", clients); }, [clients]);
  useEffect(()=>{ savePersisted("appointments", appointments); }, [appointments]);
  useEffect(()=>{ savePersisted("guias", guias); }, [guias]);
  useEffect(()=>{ savePersisted("lancamentos", lancamentos); }, [lancamentos]);
  useEffect(()=>{ savePersisted("fechamentos", fechamentos); }, [fechamentos]);
  useEffect(()=>{ savePersisted("modelosFicha", modelosFicha); }, [modelosFicha]);
  useEffect(()=>{ savePersisted("fichas", fichas); }, [fichas]);
  useEffect(()=>{ savePersisted("convenios", convenios); }, [convenios]);
  useEffect(()=>{ savePersisted("produtos", produtos); }, [produtos]);
  useEffect(()=>{ savePersisted("unidades", unidades); }, [unidades]);
  useEffect(()=>{ savePersisted("procedimentosTuss", procedimentosTuss); }, [procedimentosTuss]);
  useEffect(()=>{ savePersisted("pontoRegistros", pontoRegistros); }, [pontoRegistros]);
  useEffect(()=>{ savePersisted("horasExtras", horasExtras); }, [horasExtras]);
  useEffect(()=>{ savePersisted("unidadeFiltro", unidadeFiltro); }, [unidadeFiltro]);
  useEffect(()=>{ savePersisted("notifyEnabled", notifyEnabled); }, [notifyEnabled]);
  useEffect(()=>{ savePersisted("log", log); }, [log]);

  const [modal, setModal] = useState(null); // {type:'appt'|'client'|'prof', data:...}

  function resetParaDadosDeExemplo(){
    if (!window.confirm("Isso vai apagar todos os dados salvos neste navegador e restaurar os dados de exemplo. Continuar?")) return;
    clearPersisted();
    window.location.reload();
  }

  function pushLog(canal, msg){
    setLog(l => [{id: Date.now(), ts: "agora", canal, msg}, ...l].slice(0,30));
  }

  function addOrUpdateAppointment(appt){
    setAppointments(list => {
      const exists = list.some(a=>a.id===appt.id);
      return exists ? list.map(a=>a.id===appt.id?appt:a) : [...list, appt];
    });
  }

  // P0-3: máquina de status. A baixa/estorno de sessão na guia acontece só na transição de/para "atendido"
  // (nunca em "confirmado", que agora é apenas "paciente confirmou presença" — um passo anterior ao atendimento).
  // "Remarcado" é tratado à parte por handleRemarcar (cria um novo agendamento vinculado, não muda status in-place aqui).
  function handleStatusChange(appt, novoStatus, opts={}){
    if (novoStatus === "remarcado") { handleRemarcar(appt); return; }

    const eraAtendido = appt.status === "atendido";
    const seraAtendido = novoStatus === "atendido";

    // P0-2 (RN-5.1): bloqueia marcar como Atendido sessão de convênio cuja guia está sem saldo/vencida,
    // exceto exceção consciente e registrada em log.
    if (seraAtendido && !eraAtendido && appt.guiaId) {
      const guia = guias.find(g=>g.id===appt.guiaId);
      const bloqueio = guia ? avaliarBloqueioGuia(guia) : null;
      if (bloqueio && !opts.forcarOverride) {
        const confirmar = window.confirm(`⚠ ${bloqueio.motivo}\n\nDeseja confirmar mesmo assim? Esta exceção fica registrada no log.`);
        if (!confirmar) return;
        pushLog("Override", `Sessão de ${fmtDataBR(appt.data)} ${appt.hora} marcada como Atendido mesmo com a guia ${guia.numeroGuia} bloqueada (${bloqueio.motivo}).`);
      }
    }

    const updated = {...appt, status: novoStatus};
    addOrUpdateAppointment(updated);
    const cliente = clients.find(c=>c.id===appt.clienteId);
    const prof = professionals.find(p=>p.id===appt.profissionalId);
    if (notifyEnabled && cliente && prof) {
      if (novoStatus === "confirmado") pushLog("WhatsApp", `Confirmação de presença registrada: ${cliente.nome}, sessão com ${prof.nome} às ${appt.hora}.`);
      if (novoStatus === "chegou") pushLog("Interno", `${cliente.nome} chegou para a sessão com ${prof.nome} (${appt.hora}).`);
      if (novoStatus === "atendido") pushLog("Interno", `Atendimento concluído: ${cliente.nome} com ${prof.nome} (${appt.hora}).`);
      if (novoStatus === "desmarcado") pushLog("WhatsApp", `${cliente.nome} desmarcou a sessão de ${appt.hora} com ${prof.nome}.`);
      if (novoStatus === "faltou") pushLog("Interno", `Falta registrada: ${cliente.nome} não compareceu (${appt.hora}, ${prof.nome}).`);
    }

    // Baixa automática de sessão na guia de convênio vinculada — só na entrada em "atendido"
    if (appt.guiaId && seraAtendido && !eraAtendido) {
      consumeSessionFromGuia(appt.guiaId);
    }
    // Estorno automático — se o status regride e a sessão já estava atendida (correção de lançamento)
    if (appt.guiaId && !seraAtendido && eraAtendido) {
      estornarSessaoGuia(appt.guiaId);
    }
  }

  // ---- Ponto eletrônico (biometria simulada) ----
  // Detecta sozinho se a marcação é de entrada ou saída olhando a última marcação do profissional no dia
  // (mesma lógica de qualquer relógio de ponto: alterna entrada/saída a cada leitura).
  function registrarPonto(profissionalId, dataHoraISO){
    const dataDia = dataHoraISO.slice(0,10);
    const doDia = pontoRegistros.filter(r => r.profissionalId===profissionalId && r.timestamp.slice(0,10)===dataDia).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
    const ultimo = doDia[doDia.length-1];
    const tipo = (!ultimo || ultimo.tipo==="saida") ? "entrada" : "saida";
    const novo = { id:"pt"+Date.now()+Math.random().toString(36).slice(2,6), profissionalId, tipo, timestamp:dataHoraISO };
    setPontoRegistros(list => [...list, novo]);
    const prof = professionals.find(p=>p.id===profissionalId);
    pushLog("Interno", `Ponto eletrônico: ${prof?.nome||"Profissional"} registrou ${tipo==="entrada"?"entrada":"saída"} às ${dataHoraISO.slice(11,16)} (digital simulada).`);
    // Ao fechar o par entrada→saída do dia, confere se ultrapassou o horário cadastrado (RN pedida pelo
    // usuário: hora extra só entra no banco de horas depois que o gestor liberar com a própria senha).
    if (tipo === "saida" && ultimo && prof) {
      const jornadaMin = calcularJornadaEsperadaMin(prof);
      const trabalhadoMin = minutosEntre(ultimo.timestamp, dataHoraISO);
      const excedenteMin = trabalhadoMin - jornadaMin;
      if (excedenteMin > TOLERANCIA_HORA_EXTRA_MIN) {
        const jaExiste = horasExtras.some(h => h.profissionalId===profissionalId && h.data===dataDia);
        if (!jaExiste) {
          setHorasExtras(list => [...list, { id:"he"+Date.now()+Math.random().toString(36).slice(2,6), profissionalId, data:dataDia, minutos:Math.round(excedenteMin), status:"pendente", aprovadoPor:null, aprovadoEm:null }]);
          pushLog("Interno", `Hora extra detectada: ${prof.nome} trabalhou ${Math.round(excedenteMin)} min a mais em ${fmtDataBR(dataDia)} — aguardando liberação do gestor.`);
        }
      }
    }
    return novo;
  }

  // Aprovação de hora extra exige a senha do próprio gestor logado (reautentica no Supabase Auth como
  // dupla confirmação — só quem tem a senha da conta admin consegue liberar).
  async function aprovarHoraExtra(horaExtra, senhaGestor){
    if (!sbClient || !currentUser?.email) return { ok:false, erro:"Sessão inválida." };
    const { error } = await sbClient.auth.signInWithPassword({ email: currentUser.email, password: senhaGestor });
    if (error) return { ok:false, erro:"Senha do gestor incorreta." };
    setHorasExtras(list => list.map(h => h.id===horaExtra.id ? {...h, status:"aprovada", aprovadoPor:currentUser.nome||currentUser.email, aprovadoEm:new Date().toISOString()} : h));
    const prof = professionals.find(p=>p.id===horaExtra.profissionalId);
    pushLog("Interno", `Hora extra de ${prof?.nome||"Profissional"} (${fmtDataBR(horaExtra.data)}, ${horaExtra.minutos} min) liberada por ${currentUser.nome||currentUser.email}.`);
    return { ok:true };
  }

  function recusarHoraExtra(horaExtra){
    setHorasExtras(list => list.map(h => h.id===horaExtra.id ? {...h, status:"recusada", aprovadoPor:currentUser?.nome||currentUser?.email, aprovadoEm:new Date().toISOString()} : h));
  }

  // Confirmação de chegada do paciente reaproveita o mesmo mecanismo de biometria simulada do ponto.
  function confirmarChegadaPaciente(appt){
    handleStatusChange(appt, "chegou");
  }

  // Remarcação (RN-3.2.6): não sobrescreve o agendamento original — cria um novo, vinculado via remarcadoDeId,
  // e move o original para o status "remarcado" (histórico preservado).
  function handleRemarcar(appt){
    const novaData = window.prompt("Nova data para remarcar (AAAA-MM-DD):", appt.data);
    if (!novaData) return;
    const novaHora = window.prompt("Novo horário (HH:MM):", appt.hora);
    if (!novaHora) return;
    if (appt.status === "atendido" && appt.guiaId) estornarSessaoGuia(appt.guiaId);
    const novoId = "a" + Date.now();
    const { id, ...resto } = appt;
    const novoAppt = { ...resto, id: novoId, data: novaData, hora: novaHora, status: "agendado", remarcadoDeId: appt.id };
    addOrUpdateAppointment(novoAppt);
    setAppointments(list => list.map(a => a.id===appt.id ? {...a, status:"remarcado"} : a));
    const cliente = clients.find(c=>c.id===appt.clienteId);
    pushLog("Interno", `Sessão de ${cliente?.nome||"cliente"} remarcada: ${fmtDataBR(appt.data)} ${appt.hora} → ${fmtDataBR(novaData)} ${novaHora}.`);
  }

  function handleMoveProfessional(apptId, novoProfId){
    setAppointments(list => list.map(a => a.id===apptId ? {...a, profissionalId: novoProfId} : a));
  }

  /* ---- Guias de convênio ---- */
  // P0-2 (RN-5.1): não "clampa" mais silenciosamente o saldo — se ultrapassar o autorizado (via exceção consciente),
  // o excesso fica registrado explicitamente no log em vez de ser descartado sem rastro.
  function consumeSessionFromGuia(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const novaQtd = guia.quantidadeUtilizada + 1;
    const excedeu = novaQtd > guia.quantidadeAutorizada;
    setGuias(list => list.map(g => g.id===guiaId ? {...g, quantidadeUtilizada: novaQtd} : g));
    pushLog(excedeu ? "Override" : "Interno", excedeu
      ? `⚠ Sessão descontada da guia ${guia.numeroGuia} ACIMA do saldo autorizado (${novaQtd}/${guia.quantidadeAutorizada}) — exceção registrada.`
      : `Sessão descontada da guia ${guia.numeroGuia} (${guia.convenio}) — ${novaQtd}/${guia.quantidadeAutorizada}.`);
  }

  function estornarSessaoGuia(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const novaQtd = Math.max(0, guia.quantidadeUtilizada - 1);
    setGuias(list => list.map(g => g.id===guiaId ? {...g, quantidadeUtilizada: novaQtd} : g));
    pushLog("Interno", `Estorno: sessão devolvida à guia ${guia.numeroGuia} (${guia.convenio}) — ${novaQtd}/${guia.quantidadeAutorizada}.`);
  }

  function saveGuia(form){
    setGuias(list => {
      const exists = list.some(g=>g.id===form.id);
      return exists ? list.map(g=>g.id===form.id?form:g) : [...list, {...form, id:"g"+Date.now()}];
    });
    setModal(null);
  }

  function enviarGuiaParaFaturamento(guiaId){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status:"em_faturamento", dataEnvio: g.dataEnvio || TODAY} : g));
    const guia = guias.find(g=>g.id===guiaId);
    if (guia) pushLog("Interno", `Guia ${guia.numeroGuia} incluída em lote de faturamento TISS.`);
  }

  function marcarGuiaPaga(guiaId){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status:"paga", valorGlosa:0, motivoGlosa:"", dataPagamento: g.dataPagamento || TODAY} : g));
    const guia = guias.find(g=>g.id===guiaId);
    if (guia) pushLog("Interno", `Guia ${guia.numeroGuia} paga pelo convênio — lançada no Financeiro.`);
  }

  function registrarGlosa(guiaId, tipo, valor, motivo){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status: tipo, valorGlosa: valor, motivoGlosa: motivo} : g));
    const guia = guias.find(g=>g.id===guiaId);
    if (guia) pushLog("Interno", `Glosa registrada na guia ${guia.numeroGuia}: ${motivo} (${fmtBRL(valor)}).`);
    setModal(null);
  }

  function reabrirGuia(guiaId){
    setGuias(list => list.map(g => g.id===guiaId ? {...g, status:"aberta", valorGlosa:0, motivoGlosa:""} : g));
  }

  function solicitarAutorizacaoEletronica(guiaId){
    const guia = guias.find(g=>g.id===guiaId);
    if (!guia) return;
    const protocolo = "PROT-" + Math.floor(100000 + Math.random()*899999);
    setGuias(list => list.map(g => g.id===guiaId ? {...g, protocoloEletronico: protocolo} : g));
    pushLog("Sistema", `Autorização solicitada eletronicamente no portal ${guia.convenio} (guia ${guia.numeroGuia}) — protocolo ${protocolo}.`);
  }

  function vincularCodigoBarras(guiaId, codigo){
    const conflito = guias.find(g=>g.codigoBarras===codigo && g.id!==guiaId);
    if (conflito) return { ok:false, msg:`Este código já está vinculado à guia ${conflito.numeroGuia}.` };
    setGuias(list => list.map(g => g.id===guiaId ? {...g, codigoBarras: codigo} : g));
    const guia = guias.find(g=>g.id===guiaId);
    pushLog("Interno", `Código de barras ${codigo} vinculado à guia ${guia?.numeroGuia}.`);
    return { ok:true };
  }

  function registrarEnvioPorCodigo(codigo){
    const guia = guias.find(g=>g.codigoBarras===codigo);
    if (!guia) {
      pushLog("Sistema", `Leitura de código de barras "${codigo}" não corresponde a nenhuma guia vinculada.`);
      return { ok:false, guia:null };
    }
    if (guia.status !== "aberta") {
      return { ok:false, guia, jaEnviada:true };
    }
    setGuias(list => list.map(g => g.id===guia.id ? {...g, status:"em_faturamento", dataEnvio: g.dataEnvio || TODAY} : g));
    pushLog("Interno", `Envio registrado via leitura de código de barras: guia ${guia.numeroGuia} (${guia.convenio}).`);
    return { ok:true, guia };
  }

  /* ---- Fluxo de caixa ---- */
  function addLancamento(form){
    if (fechamentos[form.data]) { alert("O caixa deste dia já está fechado. Reabra o caixa para lançar novos itens."); return; }
    setLancamentos(list => [...list, {...form, id:"l"+Date.now()}]);
    setModal(null);
  }

  function fecharCaixa(data, valorFisicoContado, valorSistema){
    const diferenca = valorFisicoContado - valorSistema;
    setFechamentos(f => ({...f, [data]: { valorFisico: valorFisicoContado, valorSistema, diferenca, ts: "agora" }}));
    pushLog("Interno", `Caixa de ${fmtDataBR(data)} fechado. Sistema: ${fmtBRL(valorSistema)} · Contado: ${fmtBRL(valorFisicoContado)} · Diferença: ${fmtBRL(diferenca)}.`);
  }

  function reabrirCaixa(data){
    if (!window.confirm(`Reabrir o caixa de ${fmtDataBR(data)}? Esta ação deve ser feita apenas por um administrador.`)) return;
    setFechamentos(f => { const n = {...f}; delete n[data]; return n; });
    pushLog("Interno", `Caixa de ${fmtDataBR(data)} reaberto manualmente (ação administrativa).`);
  }

  /* ---- Fichas de avaliação ---- */
  function saveModeloFicha(form){
    setModelosFicha(list => {
      const exists = list.some(m=>m.id===form.id);
      return exists ? list.map(m=>m.id===form.id?form:m) : [...list, {...form, id:"m"+Date.now()}];
    });
    setModal(null);
  }

  function saveFicha(form){
    const isNew = !form.id;
    const ficha = isNew ? {...form, id:"f"+Date.now()} : form;
    setFichas(list => isNew ? [...list, ficha] : list.map(f=>f.id===ficha.id?ficha:f));
    const cliente = clients.find(c=>c.id===ficha.clienteId);
    if (isNew && ficha.modo === "remoto" && notifyEnabled && cliente) {
      pushLog("WhatsApp", `Link de preenchimento remoto enviado para ${cliente.nome}: ficha "${modelosFicha.find(m=>m.id===ficha.modeloId)?.nome}".`);
    }
    if (isNew && ficha.modo === "presencial" && notifyEnabled && cliente) {
      pushLog("Interno", `Relatório de avaliação gerado automaticamente no prontuário de ${cliente.nome}.`);
    }
    setModal(null);
  }

  function assinarFicha(fichaId){
    const protocolo = "ASSIN-" + Math.floor(100000 + Math.random()*899999);
    const agora = "agora";
    setFichas(list => list.map(f => f.id===fichaId ? {...f, status:"assinada", aceiteLGPD:true, assinadoEm:agora, protocoloAssinatura:protocolo} : f));
    const ficha = fichas.find(f=>f.id===fichaId);
    const cliente = clients.find(c=>c.id===ficha?.clienteId);
    pushLog("Sistema", `Ficha assinada eletronicamente por ${cliente?.nome} (termo de consentimento LGPD aceito) — protocolo ${protocolo}.`);
  }

  function exportarPdfFicha(ficha){
    const cliente = clients.find(c=>c.id===ficha.clienteId);
    const prof = professionals.find(p=>p.id===ficha.profissionalId);
    const modelo = modelosFicha.find(m=>m.id===ficha.modeloId);
    const linhas = (modelo?.perguntas||[]).map(p => {
      const v = ficha.respostas[p.id];
      const texto = p.tipo==="sim_nao" ? (v==="sim"?"Sim":v==="nao"?"Não":"—") : (v ?? "—");
      return `<tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;width:40%;">${p.texto}</td><td style="padding:6px 8px;border:1px solid #ddd;">${texto}</td></tr>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ficha - ${cliente?.nome}</title></head>
      <body style="font-family:Arial,sans-serif;padding:32px;color:#1e293b;">
      <h2 style="margin-bottom:0;">${modelo?.nome || "Ficha de Avaliação"}</h2>
      <p style="color:#64748b;margin-top:4px;">PhysioFlow — prontuário eletrônico</p>
      <table style="border-collapse:collapse;width:100%;margin-top:12px;font-size:14px;">
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;width:40%;">Cliente</td><td style="padding:6px 8px;border:1px solid #ddd;">${cliente?.nome||""}</td></tr>
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Data</td><td style="padding:6px 8px;border:1px solid #ddd;">${fmtDataBR(ficha.data)}</td></tr>
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Profissional</td><td style="padding:6px 8px;border:1px solid #ddd;">${prof?.nome||""} (${prof?.conselho||""})</td></tr>
        ${linhas}
        <tr><td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;">Assinatura eletrônica</td><td style="padding:6px 8px;border:1px solid #ddd;">${ficha.status==="assinada" ? `Assinada em ${ficha.assinadoEm} — protocolo ${ficha.protocoloAssinatura} — termo LGPD aceito` : "Não assinada"}</td></tr>
      </table>
      <p style="color:#94a3b8;font-size:11px;margin-top:24px;">Documento gerado eletronicamente para compor o prontuário do paciente.</p>
      <script>window.onload = () => window.print();<\/script>
      </body></html>`;
    const win = window.open("", "_blank");
    if (win) { win.document.write(html); win.document.close(); }
    pushLog("Interno", `PDF da ficha de ${cliente?.nome} (${fmtDataBR(ficha.data)}) exportado para o prontuário.`);
  }

  function createAppointment(form){
    const { repetirFixo, semanasRepetir, permitirForaExpediente, confirmarExcecaoGuia, ...base } = form;
    const id = "a" + Date.now();
    const appt = {...base, id};
    addOrUpdateAppointment(appt);
    const cliente = clients.find(c=>c.id===form.clienteId);
    const prof = professionals.find(p=>p.id===form.profissionalId);
    if (notifyEnabled && cliente && prof) {
      pushLog("WhatsApp", `Confirmação automática enviada para ${cliente.nome}: sessão em ${fmtDataBR(form.data)} às ${form.hora} com ${prof.nome}.`);
    }
    if (confirmarExcecaoGuia && form.guiaId) {
      const guia = guias.find(g=>g.id===form.guiaId);
      pushLog("Override", `Sessão agendada mesmo com a guia ${guia?.numeroGuia||form.guiaId} bloqueada (saldo/validade) — exceção autorizada manualmente.`);
    }
    if (permitirForaExpediente) {
      pushLog("Override", `Sessão de ${cliente?.nome||"cliente"} agendada fora do expediente cadastrado de ${prof?.nome||""} — exceção autorizada manualmente.`);
    }

    if (repetirFixo) {
      const semanas = Number(semanasRepetir) || 8;
      const geradas = [];
      for (let i = 1; i <= semanas; i++) {
        const dataGerada = addDays(base.data, 7 * i);
        const geradaId = "a" + (Date.now() + i);
        geradas.push({
          ...base,
          id: geradaId,
          data: dataGerada,
          status: "agendado",
        });
      }
      geradas.forEach(g => addOrUpdateAppointment(g));

      if (cliente) {
        const diaSemanaFixo = getWeekdayLabel(base.data);
        const novoHorarioFixo = { id:"hf"+Date.now(), ativo:true, profissionalId: base.profissionalId, diaSemana: diaSemanaFixo, hora: base.hora, dataTermino: null };
        setClients(list => list.map(c => {
          if (c.id !== cliente.id) return c;
          const existentes = c.horariosFixos || [];
          // evita duplicar o mesmo profissional/dia/hora — atualiza em vez de duplicar
          const jaExiste = existentes.some(h => h.profissionalId===novoHorarioFixo.profissionalId && h.diaSemana===novoHorarioFixo.diaSemana && h.hora===novoHorarioFixo.hora);
          const atualizados = jaExiste
            ? existentes.map(h => (h.profissionalId===novoHorarioFixo.profissionalId && h.diaSemana===novoHorarioFixo.diaSemana && h.hora===novoHorarioFixo.hora) ? {...h, ativo:true} : h)
            : [...existentes, novoHorarioFixo];
          return { ...c, horariosFixos: atualizados };
        }));
      }
      pushLog("Interno", `Horário fixo criado para ${cliente?.nome || "cliente"}: ${semanas} sessões geradas automaticamente (${prof?.nome || ""}, ${base.hora}).`);
    }

    setModal(null);
  }

  // Sugestão de produto por especialidade (NOVO): vincula um produto ao cliente sem fechar a

  function vincularProdutoAoCliente(clienteId, produto){
    setClients(list => list.map(c => c.id===clienteId ? {
      ...c,
      produtoId: produto.id,
      pacoteNome: produto.nome,
      sessoesTotal: produto.sessoesIncluidas || c.sessoesTotal,
      valorSessao: produto.sessoesIncluidas>0 ? Math.round((produto.precoBase/produto.sessoesIncluidas)*100)/100 : produto.precoBase,
      descontoAplicado: 0, parcelas: 1,
    } : c));
    pushLog("Interno", `Produto "${produto.nome}" vinculado ao cliente via sugestão de especialidade na Agenda.`);
  }

  function importarClientesLote(registros){
    setClients(list => {
      const atualizado = [...list];
      registros.forEach((r, i) => {
        const idx = r.cpf ? atualizado.findIndex(c => c.cpf && c.cpf === r.cpf) : -1;
        const base = idx >= 0 ? atualizado[idx] : {
          id: "c" + Date.now() + i, nome:"", telefone:"", email:"", endereco:"", dataNascimento:"", cpf:"",
          numeroCarteirinha:"", convenio:"", pagamento:{tipo:"particular", numeroGuia:""}, medico:"", telefoneEmergencia:"",
          tratamento:"", pacoteNome:"", sessoesTotal:0, dataInicio:TODAY, profissionaisIds:[], valorSessao:0,
          alta:null, horariosFixos:[], produtoId:null, descontoAplicado:0, parcelas:1,
        };
        const registroAtualizado = {
          ...base,
          nome: r.nome || base.nome,
          cpf: r.cpf || base.cpf,
          convenio: r.convenio || base.convenio,
          email: r.email || base.email,
          telefone: r.telefone || base.telefone,
          // se veio convênio preenchido e o cliente ainda estava marcado como particular, assume pagamento por convênio
          pagamento: (r.convenio && base.pagamento?.tipo === "particular") ? {...base.pagamento, tipo:"convenio"} : base.pagamento,
        };
        if (idx >= 0) atualizado[idx] = registroAtualizado; else atualizado.push(registroAtualizado);
      });
      return atualizado;
    });
    pushLog("Interno", `Importação em lote de pacientes: ${registros.length} registro(s) processado(s).`);
  }

  function importarProcedimentosTuss(linhas){
    setProcedimentosTuss(list => {
      const atualizado = [...list];
      linhas.forEach(({codigoTUSS, nomeProcedimento, nomeConvenio, valor}) => {
        let idx = atualizado.findIndex(p=>p.codigoTUSS===codigoTUSS);
        if (idx === -1) {
          atualizado.push({ id:"pt"+Date.now()+Math.random().toString(36).slice(2,6), nome:nomeProcedimento||codigoTUSS, codigoTUSS, valorPadrao:0, precosPorConvenio:{}, ativo:true });
          idx = atualizado.length - 1;
        }
        const proc = {...atualizado[idx], precosPorConvenio:{...(atualizado[idx].precosPorConvenio||{})}};
        if (nomeProcedimento) proc.nome = nomeProcedimento;
        if (!nomeConvenio) {
          proc.valorPadrao = valor;
        } else {
          const convenioObj = convenios.find(c => c.nome.toLowerCase() === nomeConvenio.toLowerCase());
          if (convenioObj) proc.precosPorConvenio[convenioObj.id] = valor;
        }
        atualizado[idx] = proc;
      });
      return atualizado;
    });
    pushLog("Interno", `Importação em lote da tabela TUSS: ${linhas.length} linha(s) processada(s).`);
  }

  // P0-1 (2.1): unidade como dimensão global — filtra Agenda/Caixa/Dashboard sem afetar a detecção de conflitos

        )}
        {tab === "notificacoes" && (
          <NotificationsPanel log={log} notifyEnabled={notifyEnabled} setNotifyEnabled={setNotifyEnabled} />
        )}
      </main>

      {modal?.type === "appt" && (
        <AppointmentModal data={modal.data} clients={clients} professionals={professionals} guias={guias}
          appointments={appointments} unidades={unidades} produtos={produtos}
          onClose={()=>setModal(null)} onSave={createAppointment} onVincularProduto={vincularProdutoAoCliente} />
      )}
      {modal?.type === "client" && (
        <ClientModal data={modal.data} professionals={professionals} convenios={convenios} produtos={produtos} onClose={()=>setModal(null)} onSave={saveClient} />
      )}
      {modal?.type === "importClientes" && (
        <ImportClientesModal onClose={()=>setModal(null)} onImportar={importarClientesLote} />
      )}
      {modal?.type === "prof" && (
        <ProfessionalModal data={modal.data} unidades={unidades} onClose={()=>setModal(null)} onSave={saveProfessional} />
      )}
      {modal?.type === "convenio" && (
        <ConvenioModal data={modal.data} onClose={()=>setModal(null)} onSave={saveConvenio} />
      )}
      {modal?.type === "produto" && (
        <ProdutoModal data={modal.data} onClose={()=>setModal(null)} onSave={saveProduto} />
      )}
      {modal?.type === "guia" && (
        <GuiaModal data={modal.data} clients={clients} professionals={professionals} unidades={unidades} procedimentosTuss={procedimentosTuss} onClose={()=>setModal(null)} onSave={saveGuia} />
      )}
      {modal?.type === "unidade" && (
        <UnidadeModal data={modal.data} onClose={()=>setModal(null)} onSave={saveUnidade} />
      )}
      {modal?.type === "procedimentoTuss" && (
        <ProcedimentoTussModal data={modal.data} convenios={convenios} onClose={()=>setModal(null)} onSave={saveProcedimentoTuss} />
      )}
      {modal?.type === "glosa" && (
        <GlosaModal guia={modal.data} onClose={()=>setModal(null)} onSave={registrarGlosa} />
      )}
      {modal?.type === "lancamento" && (
        <LancamentoModal data={modal.data} unidades={unidades} onClose={()=>setModal(null)} onSave={addLancamento} />
      )}
      {modal?.type === "venderProduto" && (
        <VenderProdutoModal data={modal.data} produtos={produtos} clients={clients} onClose={()=>setModal(null)} onSave={addLancamento} />
      )}
      {modal?.type === "ficha" && (
        <FichaModal data={modal.data} clients={clients} professionals={professionals} modelosFicha={modelosFicha}
          onClose={()=>setModal(null)} onSave={saveFicha} />
      )}
      {modal?.type === "modeloFicha" && (
        <ModeloFichaModal data={modal.data} onClose={()=>setModal(null)} onSave={saveModeloFicha} />
      )}
      {modal?.type === "clientProfile" && (
        <ClientProfileModal cliente={modal.data} clients={clients} appointments={appointments} professionals={professionals}
          guias={guias} fichas={fichas} modelosFicha={modelosFicha}
          onClose={()=>setModal(null)} onEdit={(c)=>setModal({type:"client", data:c})}
          onRegistrarAlta={registrarAlta} onReverterAlta={reverterAlta} />
      )}
      {modal?.type === "profProfile" && (
        <ProfessionalProfileModal profissional={modal.data} professionals={professionals} clients={clients} appointments={appointments}
          onClose={()=>setModal(null)} onEdit={(p)=>setModal({type:"prof", data:p})}
          onViewCliente={(c)=>setModal({type:"clientProfile", data:c})} />
      )}
    </div>
  );
}

    {id:"agenda", label:"Agenda"},
    {id:"clientes", label:"Clientes"},
    {id:"profissionais", label:"Profissionais"},
    {id:"guias", label:"Guias de Convênio"},
    {id:"catalogo", label:"Planos & Produtos"},
    {id:"caixa", label:"Fluxo de Caixa"},
    {id:"ponto", label:"Ponto Eletrônico"},
    {id:"fichas", label:"Fichas Clínicas"},
    {id:"dashboard", label:"Dashboard"},

          <div className="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold">P</div>
          <span className="font-semibold text-slate-800">PhysioFlow — Agendamento</span>
        </div>
        <nav className="flex gap-1 bg-slate-100 rounded-lg p-1">
          {tabs.map(t => (
            <button key={t.id} onClick={()=>setTab(t.id)}
              className={"px-3 py-1.5 rounded-md text-sm font-medium transition " + (tab===t.id ? "bg-white shadow text-teal-700" : "text-slate-500 hover:text-slate-700")}>

          <button onClick={()=>setModalLeitor(true)} title="Reconhece sozinho se é profissional (ponto) ou paciente (chegada)"
            className="px-3 py-1.5 rounded-lg text-xs font-medium bg-teal-600 text-white hover:bg-teal-700 flex items-center gap-1.5">
            🔒 Leitor de Biometria
          </button>
          <button onClick={onReset} className="text-[11px] text-slate-400 hover:text-red-500 underline">Restaurar dados de exemplo</button>
          {currentUser && (

                <div className="text-xs font-medium text-slate-700">{currentUser.nome}</div>
                <div className="text-[10px] text-slate-400">{perms?.label}</div>

        <LeitorBiometricoModal
          professionals={professionals||[]} clients={clients||[]} appointments={appointments||[]}

/* ---------------- Agenda Kanban ---------------- */
function Agenda({professionals, clients, appointments, guias, fichas, selectedDate, setSelectedDate, onStatusChange, onMoveProfessional, onNewAppointment, onVenderProduto, onConfirmarChegada}) {
  const dragItem = useRef(null);
  const [apptChegadaBiometria, setApptChegadaBiometria] = useState(null);
  const [visao, setVisao] = useState("dia"); // "dia" (kanban) | "semana" (agenda individual por profissional)
  const [profissionalSemanaId, setProfissionalSemanaId] = useState(() => professionals[0]?.id || "");
  useEffect(() => {
    if (!professionals.some(p=>p.id===profissionalSemanaId)) setProfissionalSemanaId(professionals[0]?.id || "");
  }, [professionals, profissionalSemanaId]);
  const profissionalDaSemana = professionals.find(p=>p.id===profissionalSemanaId);

  const apptsByProf = useMemo(() => {
    const map = {};
    professionals.forEach(p => map[p.id] = []);
    appointments.filter(a=>a.data===selectedDate).forEach(a => {
      if (!map[a.profissionalId]) map[a.profissionalId] = [];
      map[a.profissionalId].push(a);
    });
    Object.values(map).forEach(arr => arr.sort((x,y)=>x.hora.localeCompare(y.hora)));
    return map;
  }, [appointments, professionals, selectedDate]);

  const diaSemana = getWeekdayLabel(selectedDate);
  // Mostra só quem atende nesse dia da semana; mantém visível quem já tem agendamento
  // remanescente naquele dia mesmo fora da disponibilidade cadastrada (não esconde dados).
  const profissionaisDoDia = useMemo(() => professionals.filter(p =>
    (p.dias||[]).includes(diaSemana) || (apptsByProf[p.id]||[]).length > 0
  ), [professionals, diaSemana, apptsByProf]);

  function shiftDate(days){
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate()+days);
    setSelectedDate(d.toISOString().slice(0,10));
  }

  const placar = useMemo(() => {
    const inicioSemana = getInicioSemana(TODAY);
    const fimSemana = getFimSemana(TODAY);
    const mesAtual = TODAY.slice(0,7);
    const apptsMes = appointments.filter(a => a.data.startsWith(mesAtual));
    const atendimentosSemana = appointments.filter(a => a.status==="atendido" && a.data>=inicioSemana && a.data<=fimSemana).length;
    const atendimentosMes = apptsMes.filter(a => a.status==="atendido").length;
    const desmarcadosMes = apptsMes.filter(a => a.status==="desmarcado").length;
    const percentualDesmarcacao = apptsMes.length>0 ? (desmarcadosMes/apptsMes.length*100) : 0;
    const horasDisponiveisMes = professionals.reduce((s,p) => s + (p.dias?.length||0)*horasEntre(p.horaInicio,p.horaFim)*4.33, 0);
    const taxaOcupacao = horasDisponiveisMes>0 ? (atendimentosMes/horasDisponiveisMes*100) : 0;
    const pacientesAtivos = clients.filter(c=>!c.alta).length;
    const contagemSemanaPorCliente = {};
    appointments.filter(a => a.data>=inicioSemana && a.data<=fimSemana && (a.tipo||"sessao")!=="avaliacao").forEach(a => {
      contagemSemanaPorCliente[a.clienteId] = (contagemSemanaPorCliente[a.clienteId]||0) + 1;
    });
    const pacientes2xSemana = clients.filter(c => !c.alta && contagemSemanaPorCliente[c.id]===2).length;
    return { atendimentosSemana, atendimentosMes, taxaOcupacao, percentualDesmarcacao, pacientesAtivos, pacientes2xSemana };
  }, [appointments, professionals, clients]);

  return (
    <div>
      <div className="bg-gradient-to-r from-teal-600 to-teal-800 text-white rounded-2xl p-5 mb-4 shadow-md">
        <div className="text-xs uppercase tracking-wide text-teal-100 mb-3">Placar da clínica</div>
        <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
          <div>
            <div className="text-3xl font-bold">{placar.atendimentosSemana}</div>
            <div className="text-xs text-teal-100 mt-1">Atendimentos na semana</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.atendimentosMes}</div>
            <div className="text-xs text-teal-100 mt-1">Atendimentos no mês</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.taxaOcupacao.toFixed(0)}%</div>
            <div className="text-xs text-teal-100 mt-1">Taxa de ocupação (mês)</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.percentualDesmarcacao.toFixed(0)}%</div>
            <div className="text-xs text-teal-100 mt-1">Desmarcação (mês)</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.pacientesAtivos}</div>
            <div className="text-xs text-teal-100 mt-1">Pacientes ativos</div>
          </div>
          <div>
            <div className="text-3xl font-bold">{placar.pacientes2xSemana}</div>
            <div className="text-xs text-teal-100 mt-1">Pacientes com 2x/semana</div>
          </div>
        </div>
      </div>
      <div className="flex items-center gap-2 mb-3">
        <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
          <button onClick={()=>setVisao("dia")} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (visao==="dia"?"bg-white shadow text-teal-700":"text-slate-500")}>Kanban do dia</button>
          <button onClick={()=>setVisao("semana")} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (visao==="semana"?"bg-white shadow text-teal-700":"text-slate-500")}>Agenda individual (semana)</button>
        </div>
        {visao==="semana" && (
          <select value={profissionalSemanaId} onChange={e=>setProfissionalSemanaId(e.target.value)}
            className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white font-medium text-slate-700">
            {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        )}
      </div>

      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <button onClick={()=>shiftDate(visao==="semana"?-7:-1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">←</button>
        <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white" />
        <button onClick={()=>shiftDate(visao==="semana"?7:1)} className="px-2 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm">→</button>
        {visao==="dia" ? (
          <>
            <span className="text-sm text-slate-500">{fmtDataBR(selectedDate)}</span>
            <button onClick={()=>onNewAppointment((profissionaisDoDia[0]||professionals[0])?.id)} className="px-3 py-2 text-sm font-medium rounded-lg bg-teal-600 text-white hover:bg-teal-700">+ Novo agendamento</button>
            <span className="text-xs text-slate-400">{profissionaisDoDia.length} de {professionals.length} profissionais atendem {fmtDataBR(selectedDate)} ({diaSemana})</span>
          </>
        ) : (
          <span className="text-sm text-slate-500">Semana de {fmtDataBR(getInicioSemana(selectedDate))} a {fmtDataBR(getFimSemana(selectedDate))}</span>
        )}
        <div className="ml-auto flex items-center gap-3 text-xs text-slate-500 flex-wrap">
          {Object.entries(STATUS_CONFIG).map(([k,v]) => (
            <span key={k} className="flex items-center gap-1"><span className={"w-2 h-2 rounded-full "+v.dot}></span>{v.label}</span>
          ))}
        </div>
      </div>

      {visao === "semana" && (
        profissionalDaSemana ? (
          <AgendaSemanalProfissional professional={profissionalDaSemana} appointments={appointments} clients={clients}
            weekStart={getInicioSemana(selectedDate)} onStatusChange={onStatusChange} onNewAppointment={onNewAppointment} />
        ) : (
          <div className="text-center text-sm text-slate-400 bg-white rounded-xl border border-slate-200 p-8">Nenhum profissional cadastrado.</div>
        )
      )}

      {visao === "dia" && (
      <>
      {profissionaisDoDia.length === 0 && (
        <div className="text-center text-sm text-slate-400 bg-white rounded-xl border border-slate-200 p-8">Nenhum profissional atende neste dia da semana ({diaSemana}).</div>
      )}

      <div className="flex gap-4 overflow-x-auto pb-4">
        {profissionaisDoDia.map(prof => (
          <div key={prof.id} className="kanban-col bg-slate-200/60 rounded-xl flex flex-col"
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{ e.preventDefault(); if(dragItem.current) onMoveProfessional(dragItem.current, prof.id); dragItem.current=null; }}>
            <div className="px-3 py-3 border-b border-slate-300">
              <div className="font-semibold text-slate-800 text-sm">{prof.nome}</div>
              <div className="text-xs text-slate-500">{prof.cargo} · {prof.conselho}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">{prof.dias.join(", ")} · {prof.horaInicio}–{prof.horaFim}</div>
              <button onClick={()=>onNewAppointment(prof.id)} className="mt-2 w-full text-xs font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-lg py-1.5">+ Novo agendamento</button>
            </div>
            <div className="p-2 flex flex-col gap-2 min-h-[200px]">
              {(apptsByProf[prof.id]||[]).length===0 && <div className="text-center text-xs text-slate-400 py-6">Sem agendamentos</div>}
              {(apptsByProf[prof.id]||[]).map(appt => {
                const cliente = clients.find(c=>c.id===appt.clienteId);
                const cfg = STATUS_CONFIG[appt.status];
                const sinal = getSinalizacao(appt, cliente, guias, fichas, appointments);
                const sinalCfg = sinal ? SINALIZACAO_CONFIG[sinal] : null;
                const guiaVinculada = appt.guiaId ? guias.find(g=>g.id===appt.guiaId) : null;
                const alertaGuia = guiaVinculada ? guiaAlertaSaldoOuValidade(guiaVinculada) : null;
                const totalSessoes = guiaVinculada ? guiaVinculada.quantidadeAutorizada : cliente?.sessoesTotal;
                const sessaoAtual = getSessaoAtual(appt, appointments);
                const opcoesStatus = STATUS_TRANSICOES[appt.status] || Object.keys(STATUS_CONFIG);
                return (
                  <div key={appt.id} draggable
                    onDragStart={()=>{dragItem.current = appt.id;}}
                    className="bg-white rounded-lg shadow-sm border border-slate-200 p-3 cursor-grab active:cursor-grabbing">
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-800">{appt.hora}</span>
                      <span className="text-[11px] text-slate-400">{cliente ? `${sessaoAtual}/${totalSessoes ?? "-"}` : ""}</span>
                    </div>
                    <div className="text-sm text-slate-700 mt-0.5 truncate flex items-center gap-1.5">
                      {sinalCfg && <span title={sinalCfg.label} className={"inline-block w-2 h-2 rounded-full flex-shrink-0 " + sinalCfg.dot}></span>}
                      <span className="truncate">{cliente?.nome || "Cliente removido"}</span>
                      {(appt.tipo||"sessao")!=="sessao" && <span className="text-[9px] uppercase font-semibold text-purple-600 bg-purple-50 border border-purple-200 rounded px-1 flex-shrink-0">{TIPOS_AGENDAMENTO[appt.tipo]}</span>}
                    </div>
                    {guiaVinculada && (
                      <div className="text-[10px] text-slate-400 truncate mt-0.5" title={`Guia ${guiaVinculada.numeroGuia} — ${guiaVinculada.convenio}`}>
                        📋 {guiaVinculada.numeroGuia} · {guiaVinculada.convenio}
                      </div>
                    )}
                    {alertaGuia && (
                      <div className="text-[10px] text-pink-600 font-medium truncate mt-0.5">⚠ {alertaGuia}</div>
                    )}
                    <select value={appt.status} onChange={e=>onStatusChange(appt, e.target.value)}
                      className={"mt-2 w-full text-xs font-medium border rounded-md px-2 py-1 " + cfg.badge}>
                      {opcoesStatus.map(k => <option key={k} value={k}>{STATUS_CONFIG[k].label}</option>)}
                    </select>
                    {cliente && onConfirmarChegada && opcoesStatus.includes("chegou") && appt.status !== "chegou" && (
                      <button onClick={()=>setApptChegadaBiometria(appt)}
                        className="mt-1.5 w-full text-[11px] font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-md py-1">
                        🔒 Confirmar chegada (digital)
                      </button>
                    )}
                    {cliente && onVenderProduto && (
                      <button onClick={()=>onVenderProduto(appt)}
                        className="mt-1.5 w-full text-[11px] font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-md py-1">
                        💰 Vender produto
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-4 text-[11px] text-slate-500 mt-2 flex-wrap">
        {Object.entries(SINALIZACAO_CONFIG).map(([k,v]) => (
          <span key={k} className="flex items-center gap-1"><span className={"w-2 h-2 rounded-full "+v.dot}></span>{v.label}</span>
        ))}
      </div>
      <p className="text-xs text-slate-400 mt-2">Dica: arraste um cartão para outra coluna para trocar o profissional responsável pela sessão.</p>
      </>
      )}
      {apptChegadaBiometria && (
        <BiometriaCaptureModal
          titulo="Confirmar chegada"
          subtitulo={`${clients.find(c=>c.id===apptChegadaBiometria.clienteId)?.nome || "Paciente"} — confirme a chegada com a digital.`}
          onClose={()=>setApptChegadaBiometria(null)}
          onConfirm={()=>{ onConfirmarChegada(apptChegadaBiometria); setApptChegadaBiometria(null); }}
        />
      )}
    </div>
  );
}

/* ---------------- Agenda individual semanal por profissional ---------------- */
function AgendaSemanalProfissional({professional, appointments, clients, weekStart, onStatusChange, onNewAppointment}) {
  const dias = Array.from({length:7}, (_,i) => addDays(weekStart, i));
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-3 mb-4">
      <div className="text-sm font-semibold text-slate-800 mb-0.5">{professional.nome}</div>
      <div className="text-xs text-slate-500 mb-3">{professional.cargo} · {(professional.dias||[]).join(", ")} · {professional.horaInicio}–{professional.horaFim}</div>
      <div className="grid grid-cols-1 md:grid-cols-7 gap-2">
        {dias.map(dia => {
          const diaSemana = getWeekdayLabel(dia);
          const atende = (professional.dias||[]).includes(diaSemana);
          const apptsDoDia = appointments.filter(a=>a.profissionalId===professional.id && a.data===dia).sort((a,b)=>a.hora.localeCompare(b.hora));
          return (
            <div key={dia} className={"rounded-lg border p-2 flex flex-col min-h-[180px] " + (atende ? "bg-slate-50 border-slate-200" : "bg-slate-100/60 border-slate-100")}>
              <div className="text-xs font-semibold text-slate-700">{diaSemana}</div>
              <div className="text-[10px] text-slate-400 mb-2">{fmtDataBR(dia)}</div>
              {!atende && apptsDoDia.length===0 && <div className="text-[10px] text-slate-400 text-center mt-6">Não atende</div>}
              <div className="flex-1 flex flex-col gap-1.5">
                {apptsDoDia.map(appt => {
                  const cliente = clients.find(c=>c.id===appt.clienteId);
                  const cfg = STATUS_CONFIG[appt.status];
                  const opcoesStatus = STATUS_TRANSICOES[appt.status] || Object.keys(STATUS_CONFIG);
                  return (
                    <div key={appt.id} className="bg-white rounded-md border border-slate-200 p-1.5">
                      <div className="text-[11px] font-medium text-slate-700 truncate">{appt.hora} · {cliente?.nome || "Cliente removido"}</div>
                      <select value={appt.status} onChange={e=>onStatusChange(appt, e.target.value)}
                        className={"mt-1 w-full text-[10px] font-medium border rounded px-1 py-0.5 " + cfg.badge}>
                        {opcoesStatus.map(k => <option key={k} value={k}>{STATUS_CONFIG[k].label}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
              <button onClick={()=>onNewAppointment(professional.id, dia)} className="mt-2 w-full text-[10px] font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded py-1">+ agendar</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Appointment Modal ---------------- */
function AppointmentModal({data, clients, professionals, guias, appointments, unidades, produtos, onClose, onSave, onVincularProduto}) {
  const [form, setForm] = useState({ tipo:"sessao", duracaoMin:50, unidadeId:unidades?.[0]?.id||"", permitirForaExpediente:false, confirmarExcecaoGuia:false, ...data });
  const clienteSelecionado = clients.find(c=>c.id===form.clienteId);
  const guiasDoCliente = guias.filter(g => g.clienteId===form.clienteId && g.status==="aberta" && g.quantidadeUtilizada < g.quantidadeAutorizada);
  const ehAvaliacao = (form.tipo||"sessao") === "avaliacao";
  const tipoPagamento = clienteSelecionado?.pagamento.tipo;
  const profissionalSelecionado = professionals.find(p=>p.id===form.profissionalId);
  const unidadesDoProfissional = (unidades||[]).filter(u => (profissionalSelecionado?.unidadeIds||[]).includes(u.id));

  // NOVO: sugestão automática de produto por especialidade do profissional — só sugere se o cliente
  // ainda não tem esse mesmo produto vinculado; nunca aplica sozinho, sempre exige clique manual.
  const [produtoSugeridoDispensado, setProdutoSugeridoDispensado] = useState(false);
  const produtoSugerido = useMemo(() => {
    if (!profissionalSelecionado?.cargo || !clienteSelecionado) return null;
    const cargo = profissionalSelecionado.cargo.toLowerCase();
    const match = (produtos||[]).find(p => p.ativo && p.especialidade && cargo.includes(p.especialidade.toLowerCase()));
    if (!match || clienteSelecionado.produtoId === match.id) return null;
    return match;
  }, [profissionalSelecionado, clienteSelecionado, produtos]);

  let pagamentoValido = true;
  let motivoInvalido = "";
  if (!ehAvaliacao && clienteSelecionado) {
    if (tipoPagamento === "convenio") {
      pagamentoValido = !!form.guiaId;
      motivoInvalido = "Selecione uma guia de convênio com sessões disponíveis para vincular o pagamento.";
    } else if (tipoPagamento === "particular") {
      pagamentoValido = !!form.pagamentoVinculado;
      motivoInvalido = "Confirme o pagamento da sessão/pacote antes de agendar (ou marque o tipo como Avaliação).";
    }
    // bolsa: sempre válido, sem cobrança
  }

  // P0-2 (RN-5.1): guia sem saldo/vencida — aviso não bloqueia o agendamento em si (só o "Atendido"),
  // mas exige uma confirmação consciente aqui para evitar surpresa mais tarde.
  const guiaSelecionada = form.guiaId ? guias.find(g=>g.id===form.guiaId) : null;
  const bloqueioGuia = guiaSelecionada ? avaliarBloqueioGuia(guiaSelecionada) : null;

  // P0-3 (RN-3.1): detecção de conflitos — sobreposição de profissional/cliente/sala é bloqueio duro;
  // fora do expediente é aviso com caminho de confirmação consciente.
  const conflitos = useMemo(() => form.profissionalId && form.data && form.hora
    ? detectarConflitos(form, appointments||[], professionals, clients, form.permitirForaExpediente)
    : [], [form.profissionalId, form.data, form.hora, form.duracaoMin, form.permitirForaExpediente, appointments, professionals, clients]);
  const conflitosDuros = conflitos.filter(c=>c.tipo!=="expediente");
  const conflitoExpediente = conflitos.find(c=>c.tipo==="expediente");
  const sugestoes = conflitosDuros.length>0 ? sugerirHorariosLivres(form.profissionalId, form.data, appointments||[], professionals, form.duracaoMin) : [];

  const podeSalvar = pagamentoValido && conflitosDuros.length===0 && (!bloqueioGuia || form.confirmarExcecaoGuia);

  function salvar(){
    if (!podeSalvar) return;
    onSave(form);
  }

  return (
    <Modal title="Novo agendamento" onClose={onClose}>
      <Field label="Cliente">
        <select className={inputCls} value={form.clienteId} onChange={e=>setForm({...form, clienteId:e.target.value, guiaId:"", pagamentoVinculado:false})}>
          {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
      </Field>
      <Field label="Profissional">
        <select className={inputCls} value={form.profissionalId} onChange={e=>{
          const novoProf = professionals.find(p=>p.id===e.target.value);
          const novaUnidade = (novoProf?.unidadeIds||[]).includes(form.unidadeId) ? form.unidadeId : (novoProf?.unidadeIds?.[0]||form.unidadeId);
          setForm({...form, profissionalId:e.target.value, unidadeId:novaUnidade});
        }}>
          {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </Field>
      {produtoSugerido && !produtoSugeridoDispensado && (
        <div className="bg-teal-50 border border-teal-200 text-teal-800 text-xs rounded-lg p-2 mb-3 flex items-center justify-between gap-2 flex-wrap">
          <span>💡 Sugestão de produto para <strong>{profissionalSelecionado.cargo}</strong>: <strong>{produtoSugerido.nome}</strong> ({fmtBRL(produtoSugerido.precoBase)})</span>
          <div className="flex gap-2">
            <button type="button" onClick={()=>{ onVincularProduto(clienteSelecionado.id, produtoSugerido); setProdutoSugeridoDispensado(true); }}
              className="px-2 py-1 rounded-md bg-teal-600 text-white font-medium hover:bg-teal-700">Vincular ao cliente</button>
            <button type="button" onClick={()=>setProdutoSugeridoDispensado(true)} className="px-2 py-1 rounded-md border border-teal-300 hover:bg-teal-100">Ignorar</button>
          </div>
        </div>
      )}
      <div className="grid grid-cols-2 gap-3">
        <Field label="Tipo de agendamento">
          <select className={inputCls} value={form.tipo||"sessao"} onChange={e=>setForm({...form, tipo:e.target.value})}>
            {Object.entries(TIPOS_AGENDAMENTO).map(([k,label]) => <option key={k} value={k}>{label}</option>)}
          </select>
        </Field>
        <Field label="Unidade">
          <select className={inputCls} value={form.unidadeId||""} onChange={e=>setForm({...form, unidadeId:e.target.value})}>
            {(unidadesDoProfissional.length ? unidadesDoProfissional : (unidades||[])).map(u => <option key={u.id} value={u.id}>{u.nome}</option>)}
          </select>
        </Field>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <Field label="Data"><input type="date" className={inputCls} value={form.data} onChange={e=>setForm({...form, data:e.target.value})} /></Field>
        <Field label="Hora"><input type="time" className={inputCls} value={form.hora} onChange={e=>setForm({...form, hora:e.target.value})} /></Field>
        <Field label="Duração (min)"><input type="number" min="10" step="5" className={inputCls} value={form.duracaoMin||50} onChange={e=>setForm({...form, duracaoMin:Number(e.target.value)})} /></Field>
      </div>
      <div className="text-[11px] text-slate-400 -mt-2 mb-3">Nº da sessão: calculado automaticamente pelo sistema com base no histórico de atendimentos concluídos — não é digitado manualmente.</div>

      {conflitosDuros.length>0 && (
        <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-2 mb-3 space-y-1">
          {conflitosDuros.map((c,i) => <div key={i}>⛔ {c.msg}</div>)}
          {sugestoes.length>0 && (
            <div className="pt-1">Horários livres mais próximos para este profissional: {sugestoes.map(h => (
              <button key={h} type="button" onClick={()=>setForm({...form, hora:h})} className="ml-1 underline font-medium hover:text-red-900">{h}</button>
            ))}</div>
          )}
        </div>
      )}
      {conflitoExpediente && (
        <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs rounded-lg p-2 mb-3">
          <div>⚠ {conflitoExpediente.msg}</div>
          <label className="flex items-center gap-2 mt-1 font-medium">
            <input type="checkbox" checked={!!form.permitirForaExpediente} onChange={e=>setForm({...form, permitirForaExpediente:e.target.checked})} />
            Confirmar agendamento fora do expediente (exceção consciente)
          </label>
        </div>
      )}

      {!ehAvaliacao && tipoPagamento === "convenio" && (
        <Field label="Guia de convênio vinculada (obrigatória)">
          <select className={inputCls} value={form.guiaId||""} onChange={e=>setForm({...form, guiaId:e.target.value, confirmarExcecaoGuia:false})}>
            <option value="">Selecione uma guia...</option>
            {guiasDoCliente.map(g => <option key={g.id} value={g.id}>{g.numeroGuia} — {g.convenio} · {g.especialidades} — {g.quantidadeUtilizada}/{g.quantidadeAutorizada} sessões</option>)}
          </select>
          {guiasDoCliente.length>1 && <span className="text-[11px] text-amber-600">Este cliente tem {guiasDoCliente.length} guias abertas — confira qual guia corresponde a este atendimento antes de salvar.</span>}
          {guiasDoCliente.length===0 && <span className="text-[11px] text-red-600">Nenhuma guia aberta com sessões disponíveis para este cliente — cadastre/renove a guia antes de agendar.</span>}
        </Field>
      )}

      {bloqueioGuia && (
        <div className="bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg p-2 mb-3">
          <div>⛔ {bloqueioGuia.motivo}</div>
          <label className="flex items-center gap-2 mt-1 font-medium">
            <input type="checkbox" checked={!!form.confirmarExcecaoGuia} onChange={e=>setForm({...form, confirmarExcecaoGuia:e.target.checked})} />
            Confirmar mesmo assim (exceção autorizada — fica registrada no log)
          </label>
        </div>
      )}

      {!ehAvaliacao && tipoPagamento === "particular" && (
        <label className="flex items-center gap-2 text-sm text-slate-700 mb-3">
          <input type="checkbox" checked={!!form.pagamentoVinculado} onChange={e=>setForm({...form, pagamentoVinculado:e.target.checked})} />

      {!ehAvaliacao && tipoPagamento === "bolsa" && (
        <div className="bg-blue-50 border border-blue-200 text-blue-700 text-xs rounded-lg p-2 mb-3">Atendimento via bolsa — sem cobrança, pagamento não exigido.</div>

// KPIs de clientes por período: ativos ao fim do período (começou até lá e não teve alta até lá),
// convênio vs particular entre os ativos, novos (dataInicio no período) e churn (alta no período).
function calcKpisClientes(clients, periodoInicio, periodoFim){
  const ativos = clients.filter(c => {
    const inicio = c.dataInicio || TODAY;
    if (inicio > periodoFim) return false;
    return !(c.alta && c.alta.data && c.alta.data <= periodoFim);
  });
  const pacientesConvenio = ativos.filter(c=>c.pagamento?.tipo==="convenio").length;
  const pacientesParticulares = ativos.filter(c=>c.pagamento?.tipo!=="convenio").length;
  const novosPacientes = clients.filter(c => c.dataInicio && c.dataInicio>=periodoInicio && c.dataInicio<=periodoFim).length;
  const churnClientes = clients.filter(c => c.alta && c.alta.data && c.alta.data>=periodoInicio && c.alta.data<=periodoFim).length;
  const baseInicioPeriodo = clients.filter(c => (c.dataInicio||TODAY) < periodoInicio && !(c.alta && c.alta.data && c.alta.data < periodoInicio)).length;
  const churnPercent = baseInicioPeriodo>0 ? (churnClientes/baseInicioPeriodo*100) : 0;
  return { pacientesAtivos: ativos.length, pacientesConvenio, pacientesParticulares, novosPacientes, churnClientes, churnPercent };
}

function ClientesKpiHeader({clients}) {
  const [modo, setModo] = useState("mes"); // mes | ano
  const [mesRef, setMesRef] = useState(TODAY.slice(0,7));
  const [anoRef, setAnoRef] = useState(TODAY.slice(0,4));

  const { periodoInicio, periodoFim } = useMemo(() => {
    if (modo === "ano") {
      return { periodoInicio: `${anoRef}-01-01`, periodoFim: `${anoRef}-12-31` };
    }
    const [ano, mes] = mesRef.split("-");
    const ultimoDia = new Date(Number(ano), Number(mes), 0).getDate();
    return { periodoInicio: `${mesRef}-01`, periodoFim: `${mesRef}-${String(ultimoDia).padStart(2,"0")}` };
  }, [modo, mesRef, anoRef]);

  const kpis = useMemo(() => calcKpisClientes(clients, periodoInicio, periodoFim), [clients, periodoInicio, periodoFim]);

  return (
    <div className="mb-4">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
          <button onClick={()=>setModo("mes")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="mes"?"bg-white shadow text-teal-700":"text-slate-500")}>Por mês</button>
          <button onClick={()=>setModo("ano")} className={"px-3 py-1 rounded-md text-xs font-medium " + (modo==="ano"?"bg-white shadow text-teal-700":"text-slate-500")}>Por ano</button>
        </div>
        {modo==="mes" ? (
          <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white" />
        ) : (
          <input type="number" value={anoRef} onChange={e=>setAnoRef(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white w-24" />
        )}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <KpiCard label="Pacientes ativos" value={kpis.pacientesAtivos} tone="teal" />
        <KpiCard label="Pacientes de convênio" value={kpis.pacientesConvenio} />
        <KpiCard label="Pacientes particulares" value={kpis.pacientesParticulares} />
        <KpiCard label="Novos pacientes" value={kpis.novosPacientes} tone="green" />
        <KpiCard label="Churn" value={kpis.churnClientes} tone={kpis.churnClientes>0?"red":"default"} sub={`${kpis.churnPercent.toFixed(1)}% da base do período`} />
      </div>
    </div>
  );
}

Maria da Silva,123.456.789-00,Amil,maria.silva@email.com,(11) 91234-5678
,,,,`;

function ImportClientesModal({onClose, onImportar}) {
  const [registros, setRegistros] = useState([]);
  const [erro, setErro] = useState("");
  const [nomeArquivo, setNomeArquivo] = useState("");
  const [mostrarTexto, setMostrarTexto] = useState(false);
  const [copiado, setCopiado] = useState(false);
  const textareaRef = useRef(null);

  function baixarModelo(){
    baixarArquivo("modelo_importacao_pacientes.csv", MODELO_CLIENTES_CSV, "text/csv");
  }

  function copiarModelo(){
    const ta = textareaRef.current;
    if (ta) {
      ta.focus(); ta.select();
      try { document.execCommand("copy"); setCopiado(true); setTimeout(()=>setCopiado(false), 2000); }
      catch (e) { window.alert("Não foi possível copiar automaticamente — selecione o texto manualmente (Cmd+A, Cmd+C)."); }
    }
  }

  function handleFile(e){
    const file = e.target.files[0];
    if (!file) return;
    setNomeArquivo(file.name);
    const reader = new FileReader();
    reader.onload = (ev) => {
      const { erro: err, registros: regs } = parseClientesCSV(String(ev.target.result || ""));
      if (err) { setErro(err); setRegistros([]); }
      else if (regs.length === 0) { setErro("Nenhuma linha com nome preenchido foi encontrada no arquivo."); setRegistros([]); }
      else { setErro(""); setRegistros(regs); }
    };
    reader.readAsText(file, "UTF-8");
  }

  return (
    <Modal title="Importar pacientes em lote (CSV)" onClose={onClose} wide>
      <div className="bg-slate-50 rounded-lg p-3 mb-3 text-xs text-slate-600">
        <p className="mb-2">Baixe o modelo CSV, preencha nome, CPF, convênio, e-mail e telefone para cada paciente (uma linha por pessoa) e envie o arquivo preenchido de volta aqui. Pacientes com CPF já cadastrado são atualizados; os demais são criados.</p>
        <div className="flex flex-wrap gap-2 items-center">
          <button type="button" onClick={baixarModelo} className="px-3 py-1.5 text-xs rounded-lg border border-teal-300 text-teal-700 hover:bg-teal-50">Baixar modelo CSV</button>
          <button type="button" onClick={()=>setMostrarTexto(v=>!v)} className="px-3 py-1.5 text-xs rounded-lg border border-slate-300 text-slate-600 hover:bg-white">{mostrarTexto ? "Ocultar" : "Não abriu? Ver/copiar o texto do modelo"}</button>
        </div>

/* ---------------- Perfil do cliente ---------------- */
function calcPerfilCliente(cliente, appointments, professionals){
  const apptsCliente = appointments.filter(a=>a.clienteId===cliente.id).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const confirmados = apptsCliente.filter(a=>a.status==="atendido");
  const ltv = confirmados.length * (cliente.valorSessao||0);
  const especialidades = [...new Set(apptsCliente.map(a => professionals.find(p=>p.id===a.profissionalId)?.cargo).filter(Boolean))];
  const profissionaisVistos = [...new Set(apptsCliente.map(a => professionals.find(p=>p.id===a.profissionalId)?.nome).filter(Boolean))];
  const hoje = new Date(TODAY + "T00:00:00");
  const inicio = new Date((cliente.dataInicio || TODAY) + "T00:00:00");
  const semanas = Math.max(1, (hoje - inicio) / (7*86400000));
  const frequenciaSemanal = confirmados.length / semanas;
  const faltas = apptsCliente.filter(a=>a.status==="faltou").length;
  const desmarcacoes = apptsCliente.filter(a=>a.status==="desmarcado").length;
  return { apptsCliente, confirmados, ltv, especialidades, profissionaisVistos, frequenciaSemanal, faltas, desmarcacoes };
}
