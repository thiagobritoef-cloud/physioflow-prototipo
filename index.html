        <div className="w-16 h-16 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xl font-semibold overflow-hidden flex-shrink-0">
          {form.foto ? <img src={form.foto} alt="Foto" className="w-full h-full object-cover" /> : (form.nome||"?").trim().charAt(0).toUpperCase()}
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-600 mb-1">Foto de perfil</label>
          <input type="file" accept="image/*" onChange={handleFotoUpload} className="text-xs" />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Nome"><input className={inputCls} value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
        <Field label="Tipo de vínculo">
          <select className={inputCls} value={form.tipoVinculo||TIPOS_VINCULO[0]} onChange={e=>setForm({...form,tipoVinculo:e.target.value})}>
            {TIPOS_VINCULO.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </Field>
      </div>

      <div className="border-t border-slate-100 pt-3 mt-2 mb-1"><span className="text-sm font-medium text-slate-700">Dados pessoais</span></div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="CPF"><input className={inputCls} value={form.cpf||""} onChange={e=>setForm({...form,cpf:e.target.value})} /></Field>
        <Field label="RG"><input className={inputCls} value={form.rg||""} onChange={e=>setForm({...form,rg:e.target.value})} /></Field>
        <Field label="Data de nascimento"><DateInput value={form.dataNascimento||""} onChange={v=>setForm({...form,dataNascimento:v})} /></Field>

        <Field label="Telefone pessoal"><input className={inputCls} value={form.telefonePessoal||""} onChange={e=>setForm({...form,telefonePessoal:e.target.value})} /></Field>
        <Field label="E-mail"><input type="email" className={inputCls} value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})} /></Field>
      </div>

        <button onClick={()=>onSave(form)} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700">Salvar</button>
      </div>
    </Modal>
  );

/* ---------------- Cadastro de biometria (computador OU leitor biométrico real) ---------------- */
// Usado tanto no cadastro do profissional quanto no do paciente. Duas formas de cadastrar:
// 1) "Pelo computador" — simulado, um clique (mesma lógica já usada no resto do protótipo).
// 2) "Com leitor biométrico" — tenta de verdade a API WebAuthn do dispositivo (Windows Hello, Touch ID,
//    leitor de digital do notebook/celular), quando o navegador/dispositivo suporta.
function CadastroBiometriaModal({nome, onClose, onCadastrado}) {
  const [metodo, setMetodo] = useState(null); // "simulado" | "leitor"
  const [status, setStatus] = useState("idle"); // idle | lendo | erro
  const [erro, setErro] = useState("");
  const suportaLeitor = typeof window !== "undefined" && !!window.PublicKeyCredential;

  function cadastrarSimulado(){
    setMetodo("simulado"); setStatus("lendo"); setErro("");
    setTimeout(() => { onCadastrado({ metodo: "simulado" }); }, 900);
  }

  async function cadastrarComLeitor(){
    setMetodo("leitor"); setStatus("lendo"); setErro("");
    try {
      const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
      const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: "PhysioFlow — Biometria" },
          user: { id: userId, name: nome || "usuario", displayName: nome || "Usuário" },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
          authenticatorSelection: { userVerification: "required" },
          timeout: 30000,
          attestation: "none",
        }
      });
      const credencialId = cred ? btoa(String.fromCharCode(...new Uint8Array(cred.rawId))) : null;
      onCadastrado({ metodo: "leitor", credencialId });
    } catch (e) {
      setStatus("erro");
      setErro("Não foi possível usar o leitor biométrico deste dispositivo (" + (e?.message || "cancelado") + "). Você pode cadastrar pelo computador.");
    }
  }

  return (
    <Modal title="Cadastrar biometria" onClose={onClose}>
      <p className="text-sm text-slate-600 mb-4">Escolha como {nome ? <strong>{nome}</strong> : "a pessoa"} vai cadastrar a digital.</p>
      <div className="grid grid-cols-1 gap-2 mb-1">
        <button type="button" onClick={cadastrarSimulado} disabled={status==="lendo"}
          className="px-4 py-3 rounded-lg border border-teal-300 bg-teal-50 hover:bg-teal-100 text-sm font-medium text-teal-700 text-left disabled:opacity-60">
          💻 Cadastrar pelo computador
          <div className="text-[11px] font-normal text-teal-600 mt-0.5">Simulado — um clique confirma a digital neste protótipo.</div>
        </button>
        <button type="button" onClick={cadastrarComLeitor} disabled={status==="lendo" || !suportaLeitor}
          className="px-4 py-3 rounded-lg border border-indigo-300 bg-indigo-50 hover:bg-indigo-100 text-sm font-medium text-indigo-700 text-left disabled:opacity-50">
          🔒 Cadastrar com leitor biométrico
          <div className="text-[11px] font-normal text-indigo-600 mt-0.5">
            {suportaLeitor ? "Usa a digital/rosto do próprio computador ou celular (Windows Hello, Touch ID, leitor de digital)." : "Não disponível neste navegador/dispositivo."}
          </div>
        </button>
      </div>
      {status==="lendo" && metodo==="simulado" && <p className="text-xs text-slate-500 text-center mt-3">Lendo digital...</p>}
      {status==="lendo" && metodo==="leitor" && <p className="text-xs text-slate-500 text-center mt-3">Siga as instruções do seu dispositivo...</p>}
      {erro && <p className="text-xs text-red-600 mt-3">{erro}</p>}
      <div className="flex justify-end mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
      </div>
    </Modal>
  );
}

/* ---------------- Leitor de biometria unificado (reconhece profissional ou paciente sozinho) ---------------- */
// Pensado para ficar disponível em qualquer tela (botão fixo no TopBar): a pessoa faz a leitura da digital
// (simulada ou pelo leitor do dispositivo) e o sistema identifica, pelo cadastro, se é profissional ou
// paciente — sem precisar escolher isso antes. Profissional: registra entrada/saída no ponto. Paciente:
// confirma a chegada se houver agendamento hoje, ou avisa que não há marcação.
function LeitorBiometricoModal({professionals, clients, appointments, onRegistrarPonto, onConfirmarChegada, onClose}) {
  const [status, setStatus] = useState("aguardando"); // aguardando | lendo | identificar | resultado
  const [metodo, setMetodo] = useState(null);
  const [busca, setBusca] = useState("");
  const suportaLeitor = typeof window !== "undefined" && !!window.PublicKeyCredential;
  const [resultado, setResultado] = useState(null); // {tipo:'sucesso'|'aviso', texto}

  const cadastrados = useMemo(() => {
    const profs = professionals.filter(p => p.biometriaCadastrada).map(p => ({ id: p.id, nome: p.nome, tipo: "profissional" }));
    const pacientes = clients.filter(c => c.biometriaCadastrada).map(c => ({ id: c.id, nome: c.nome, tipo: "paciente" }));
    return [...profs, ...pacientes];
  }, [professionals, clients]);

  const sugestoes = busca.trim().length >= 2
    ? cadastrados.filter(p => p.nome.toLowerCase().includes(busca.trim().toLowerCase())).slice(0, 6)
    : [];

  function processarIdentidade(pessoa){
    if (pessoa.tipo === "profissional") {
      const registro = onRegistrarPonto(pessoa.id, new Date().toISOString());
      setResultado({ tipo: "sucesso", texto: `${pessoa.nome} — ${registro.tipo === "entrada" ? "entrada registrada" : "saída registrada"} às ${registro.timestamp.slice(11,16)}.` });
    } else {
      const marcacoesHoje = appointments.filter(a => a.clienteId === pessoa.id && a.data === TODAY && !["desmarcado","remarcado","faltou"].includes(a.status));
      if (marcacoesHoje.length === 0) {
        setResultado({ tipo: "aviso", texto: `${pessoa.nome} não tem marcação para hoje.` });
      } else {
        const proxima = marcacoesHoje.sort((a,b)=>a.hora.localeCompare(b.hora))[0];
        onConfirmarChegada(proxima);
        setResultado({ tipo: "sucesso", texto: `Chegada de ${pessoa.nome} confirmada — sessão das ${proxima.hora}.` });
      }
    }
    setStatus("resultado");
  }

  function lerSimulado(){
    setMetodo("simulado"); setStatus("lendo");
    setTimeout(() => { setStatus("identificar"); }, 800);
  }

  async function lerComLeitor(){
    setMetodo("leitor"); setStatus("lendo");
    try {
      const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
      await navigator.credentials.get({ publicKey: { challenge, userVerification: "required", timeout: 30000 } });
    } catch (e) {
      // Mesmo sem credencial cadastrada neste navegador, segue para a identificação por nome
      // (protótipo não tem banco de digitais real — a leitura confirma presença física).
    }
    setStatus("identificar");
  }

  function reiniciar(){
    setStatus("aguardando"); setMetodo(null); setBusca(""); setResultado(null);
  }

  return (
    <Modal title="Leitor de Biometria" onClose={onClose}>
      {status === "aguardando" && (
        <div className="flex flex-col items-center py-2">
          <div className="w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center text-4xl mb-4">👆</div>
          <p className="text-sm text-slate-600 text-center mb-4">Toque a digital para registrar ponto (profissional) ou confirmar chegada (paciente). O sistema reconhece sozinho quem é.</p>
          <div className="flex flex-col gap-2 w-full">
            <button onClick={lerSimulado} className="px-4 py-2.5 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700">💻 Simular leitura pelo computador</button>
            <button onClick={lerComLeitor} disabled={!suportaLeitor} className="px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:opacity-50">🔒 Usar leitor biométrico do dispositivo</button>
          </div>
        </div>
      )}
      {status === "lendo" && (
        <div className="flex flex-col items-center py-6">
          <div className="w-20 h-20 rounded-full bg-teal-100 animate-pulse flex items-center justify-center text-4xl mb-3">👆</div>
          <p className="text-sm text-slate-500">Lendo digital...</p>
        </div>
      )}
      {status === "identificar" && (
        <div>
          <p className="text-sm text-slate-600 mb-2">Digital lida. Confirme o nome para concluir:</p>
          <input autoFocus value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Digite o nome..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          {sugestoes.length > 0 && (
            <div className="mt-2 border border-slate-200 rounded-lg divide-y divide-slate-100 max-h-48 overflow-y-auto">
              {sugestoes.map(p => (
                <button key={p.tipo + p.id} type="button" onClick={() => processarIdentidade(p)}
                  className="w-full text-left px-3 py-2 text-sm hover:bg-slate-50 flex items-center justify-between">
                  <span>{p.nome}</span>
                  <span className={"text-[10px] uppercase font-semibold px-1.5 py-0.5 rounded " + (p.tipo === "profissional" ? "bg-teal-50 text-teal-700" : "bg-indigo-50 text-indigo-700")}>{p.tipo}</span>
                </button>
              ))}
            </div>
          )}
          {busca.trim().length >= 2 && sugestoes.length === 0 && <p className="text-xs text-slate-400 mt-2">Nenhuma digital cadastrada com esse nome.</p>}
        </div>
      )}
      {status === "resultado" && resultado && (
        <div className="flex flex-col items-center py-4">
          <div className={"w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-3 " + (resultado.tipo === "sucesso" ? "bg-green-100" : "bg-amber-100")}>
            {resultado.tipo === "sucesso" ? "✅" : "⚠️"}
          </div>
          <p className="text-sm text-slate-700 text-center mb-4">{resultado.texto}</p>
          <button onClick={reiniciar} className="px-4 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700">Ler outra digital</button>
        </div>
      )}
      <p className="text-[11px] text-slate-400 mt-4 text-center">Biometria simulada neste protótipo (ou leitor do próprio dispositivo, quando disponível).</p>
    </Modal>
  );
}

/* ---------------- Aprovação de hora extra (senha do gestor) ---------------- */
function AprovarHoraExtraModal({horaExtra, professionals, onClose, onAprovar}) {
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [enviando, setEnviando] = useState(false);
  const prof = professionals.find(p => p.id === horaExtra.profissionalId);
  async function confirmar(){
    if (!senha) { setErro("Digite a senha do gestor."); return; }
    setEnviando(true); setErro("");
    const res = await onAprovar(horaExtra, senha);
    setEnviando(false);
    if (!res.ok) setErro(res.erro || "Não foi possível liberar.");
  }
  return (
    <Modal title="Liberar hora extra" onClose={onClose}>
      <p className="text-sm text-slate-700 mb-1"><strong>{prof?.nome || "Profissional"}</strong> — {fmtDataBR(horaExtra.data)}</p>
      <p className="text-sm text-slate-500 mb-4">Excedente de <strong>{formatarSaldoHoras(horaExtra.minutos)}</strong> sobre o horário cadastrado. Só entra no banco de horas depois de liberado.</p>
      <label className="block text-xs font-medium text-slate-600 mb-1">Senha do gestor</label>
      <input type="password" autoFocus value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter" && confirmar()}
        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-1" placeholder="••••••••" />
      {erro && <p className="text-xs text-red-600 mb-2">{erro}</p>}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={confirmar} disabled={enviando} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-60">
          {enviando ? "Verificando..." : "Liberar hora extra"}
        </button>
      </div>
    </Modal>
  );
}

function AprovarComissaoVendaModal({nomeProfissional, valorAtual, currentUser, onClose, onAprovado}) {
  const [novoValor, setNovoValor] = useState(valorAtual ?? 0);
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [enviando, setEnviando] = useState(false);
  async function confirmar(){
    if (!senha) { setErro("Digite a senha do gestor."); return; }
    if (!sbClient || !currentUser?.email) { setErro("Sessão inválida."); return; }
    setEnviando(true); setErro("");
    const { error } = await sbClient.auth.signInWithPassword({ email: currentUser.email, password: senha });
    setEnviando(false);
    if (error) { setErro("Senha do gestor incorreta."); return; }
    onAprovado(Number(novoValor)||0);

  return (
    <Modal title="Editar comissão sobre vendas" onClose={onClose}>
      <p className="text-sm text-slate-500 mb-3">Alterar o percentual de comissão sobre vendas de <strong>{nomeProfissional || "colaborador"}</strong> exige confirmação com a senha do gestor.</p>

      <input type="number" min="0" max="100" step="0.1" autoFocus value={novoValor} onChange={e=>setNovoValor(e.target.value)}

      <label className="block text-xs font-medium text-slate-600 mb-1">Senha do gestor</label>
      <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter" && confirmar()}
        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-1" placeholder="••••••••" />
      {erro && <p className="text-xs text-red-600 mb-2">{erro}</p>}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={confirmar} disabled={enviando} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-60">
          {enviando ? "Verificando..." : "Salvar comissão"}
        </button>
      </div>
    </Modal>
  );
}

/* ---------------- Ponto Eletrônico ---------------- */
function PontoEletronico({professionals, pontoRegistros, horasExtras, vendas, currentUser, perms, onRegistrarPonto, onAprovarHoraExtra, onRecusarHoraExtra}) {
  const souFisioterapeuta = !!perms.agendaSomenteProprio;
  const meuProfissional = souFisioterapeuta ? professionals.find(p => p.nome === currentUser?.nome) : null;
  const [profissionalId, setProfissionalId] = useState(() => meuProfissional?.id || professionals[0]?.id || "");
  const [modalBiometria, setModalBiometria] = useState(false);
  const [horaExtraSelecionada, setHoraExtraSelecionada] = useState(null);
  const hoje = new Date();
  const [mesFiltro, setMesFiltro] = useState(hoje.getMonth()+1);
  const [anoFiltro, setAnoFiltro] = useState(hoje.getFullYear());

  const podeAprovar = currentUser?.role === "admin";
  const profissionalAtual = professionals.find(p => p.id === profissionalId);
  const registrosHoje = pontoRegistros.filter(r => r.profissionalId===profissionalId && r.timestamp.slice(0,10)===TODAY).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  const ultimoRegistro = registrosHoje[registrosHoje.length-1];
  const proximaMarcacao = (!ultimoRegistro || ultimoRegistro.tipo==="saida") ? "entrada" : "saida";
  const minutosHoje = minutosTrabalhadosNoDia(profissionalId, TODAY, pontoRegistros);

  const pendentes = horasExtras.filter(h => h.status === "pendente");
  const fechamento = useMemo(() => gerarFechamentoMensal(professionals, pontoRegistros, horasExtras, vendas, mesFiltro, anoFiltro), [professionals, pontoRegistros, horasExtras, vendas, mesFiltro, anoFiltro]);
  const totalGeral = fechamento.reduce((acc,f) => ({ salario: acc.salario+f.valorSalario, vt: acc.vt+f.valorVT, va: acc.va+f.valorVA, comissaoVendas: acc.comissaoVendas+f.valorComissaoVendas, total: acc.total+f.valorTotal }), {salario:0, vt:0, va:0, comissaoVendas:0, total:0});

  return (
    <div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <h2 className="text-lg font-semibold text-slate-800">Ponto Eletrônico</h2>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div className="bg-white rounded-xl border border-slate-200 p-4 lg:col-span-1">
          <div className="text-sm font-medium text-slate-700 mb-2">Bater ponto</div>
          {!souFisioterapeuta && (
            <select value={profissionalId} onChange={e=>setProfissionalId(e.target.value)} className={inputCls + " mb-3"}>
              {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
            </select>
          )}
          {souFisioterapeuta && <div className="text-sm text-slate-600 mb-3">{profissionalAtual?.nome}</div>}
          {profissionalAtual && !profissionalAtual.biometriaCadastrada ? (
            <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">Este profissional ainda não tem digital cadastrada. Cadastre em Profissionais → editar.</p>
          ) : (
            <button onClick={()=>setModalBiometria(true)} disabled={!profissionalId}
              className="w-full py-2.5 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700 disabled:opacity-50">
              🔒 Registrar {proximaMarcacao === "entrada" ? "entrada" : "saída"}
            </button>
          )}
          <div className="text-xs text-slate-500 mt-3">
            {registrosHoje.length === 0 ? "Nenhuma marcação hoje." : (
              <>
                <div className="font-medium text-slate-600 mb-1">Marcações de hoje</div>
                {registrosHoje.map(r => <div key={r.id}>{r.tipo==="entrada" ? "→ Entrada" : "← Saída"} às {r.timestamp.slice(11,16)}</div>)}
                {minutosHoje > 0 && <div className="mt-1 text-slate-600">Trabalhado hoje: <strong>{formatarSaldoHoras(minutosHoje)}</strong></div>}

        <div className="bg-white rounded-xl border border-slate-200 p-4 lg:col-span-2">
          <div className="text-sm font-medium text-slate-700 mb-2">Banco de horas</div>

              <thead className="text-slate-400 uppercase"><tr><th className="text-left py-1">Profissional</th><th className="text-right py-1">Saldo</th></tr></thead>

          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="text-slate-400 uppercase">
                <tr>
                  <th className="text-left py-1.5">Profissional</th>
                  <th className="text-right py-1.5">Dias trabalhados</th>

        </div>

      {modalBiometria && (
        <BiometriaCaptureModal
          titulo={proximaMarcacao === "entrada" ? "Registrar entrada" : "Registrar saída"}
          subtitulo={`${profissionalAtual?.nome || ""} — confirme com a digital para bater o ponto.`}
          onClose={()=>setModalBiometria(false)}

      {horaExtraSelecionada && (

        />
      )}
    </div>
  );
}

    <div className="relative">
      {label && <span className="block text-xs font-medium text-slate-600 mb-1">{label}</span>}
      <div className="flex gap-2">
        <input
          className={inputCls}
          placeholder={placeholder || "Digite o nome e busque..."}
          value={query}
          onChange={e=>{ setQuery(e.target.value); setOpen(true); }}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false), 150)}
          onKeyDown={e=>{ if (e.key==="Enter") { e.preventDefault(); setOpen(true); } }}
        />
        <button type="button" onClick={()=>setOpen(true)} className="px-3 py-2 text-xs rounded-lg border border-slate-300 bg-white hover:bg-slate-50 flex-shrink-0">Buscar</button>
      </div>
      {open && (
        <div className="absolute z-20 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg max-h-52 overflow-y-auto">
          {filtered.length===0 && <div className="px-3 py-2 text-xs text-slate-400">Nenhum resultado para "{query}".</div>}
          {filtered.map(i => (
            <button type="button" key={i.id}
              onMouseDown={e=>e.preventDefault()}
              onClick={()=>{ onSelect(i); setQuery(""); setOpen(false); }}
              className="w-full text-left px-3 py-2 text-sm hover:bg-teal-50 border-b border-slate-50 last:border-0">
              {getLabel(i)}{getSub ? <span className="text-xs text-slate-400"> — {getSub(i)}</span> : null}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Busca rápida por nome (pedida explicitamente pelo usuário): digitar o primeiro nome ou algumas letras
// mostra uma caixa de diálogo com os nomes semelhantes; clicar num resultado abre a informação
// correspondente daquela aba (perfil do cliente/profissional, linha do tempo, edição do produto, etc.).
// Reaproveitada nas abas Agenda, Clientes, Fichas Clínicas, Profissionais e Produtos.
function BuscaRapidaBar({placeholder, items, getLabel, getSub, onSelect, className}) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const resultados = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return items.filter(i => getLabel(i).toLowerCase().includes(q)).slice(0, 8);
  }, [items, query, getLabel]);

  return (
    <div className={"relative " + (className||"w-full sm:w-80")}>
      <input
        type="text"
        className="w-full border border-slate-300 rounded-lg pl-8 pr-3 py-2 text-sm bg-white"
        placeholder={placeholder || "Buscar por nome..."}
        value={query}
        onChange={e=>{ setQuery(e.target.value); setOpen(true); }}
        onFocus={()=>setOpen(true)}
        onBlur={()=>setTimeout(()=>setOpen(false), 150)}
      />
      <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">🔍</span>
      {open && query.trim().length > 0 && (
        <div className="absolute z-20 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg max-h-64 overflow-y-auto">
          {resultados.length===0 && <div className="px-3 py-2 text-xs text-slate-400">Nenhum resultado para "{query}".</div>}
          {resultados.map((i, idx) => (
            <button type="button" key={idx}
              onMouseDown={e=>e.preventDefault()}
              onClick={()=>{ onSelect(i); setQuery(""); setOpen(false); }}
              className="w-full text-left px-3 py-2 text-sm hover:bg-teal-50 border-b border-slate-50 last:border-0">
              <div className="font-medium text-slate-800">{getLabel(i)}</div>
              {getSub && <div className="text-xs text-slate-400">{getSub(i)}</div>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Autorização de desconto fora da faixa (mín.–máx.) cadastrada no produto/pacote — pedida explicitamente
// pelo usuário: nenhum desconto pode sair da faixa sem a senha do gestor confirmando a liberação.
// Reaproveitada tanto no vínculo de produto ao cliente (ClientModal) quanto na venda avulsa (VenderProdutoModal).
function AutorizarDescontoModal({produtoNome, descontoSolicitado, descontoMin, descontoMax, currentUser, onClose, onAutorizado}) {
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [enviando, setEnviando] = useState(false);
  async function confirmar(){
    if (!senha) { setErro("Digite a senha do gestor."); return; }
    if (!sbClient || !currentUser?.email) { setErro("Sessão inválida."); return; }
    setEnviando(true); setErro("");
    const { error } = await sbClient.auth.signInWithPassword({ email: currentUser.email, password: senha });
    setEnviando(false);
    if (error) { setErro("Senha do gestor incorreta."); return; }
    onAutorizado();
  }
  return (
    <Modal title="Autorizar desconto fora da faixa" onClose={onClose}>
      <p className="text-sm text-slate-700 mb-1">Desconto de <strong>{descontoSolicitado}%</strong> em <strong>{produtoNome || "produto"}</strong></p>
      <p className="text-sm text-slate-500 mb-4">Fora da faixa permitida ({descontoMin}%–{descontoMax}%) cadastrada no Catálogo. Confirme com a senha do gestor para liberar.</p>
      <label className="block text-xs font-medium text-slate-600 mb-1">Senha do gestor</label>
      <input type="password" autoFocus value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==="Enter" && confirmar()}
        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-1" placeholder="••••••••" />
      {erro && <p className="text-xs text-red-600 mb-2">{erro}</p>}
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">Cancelar</button>
        <button onClick={confirmar} disabled={enviando} className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-60">
          {enviando ? "Verificando..." : "Autorizar desconto"}
        </button>
      </div>
    </Modal>
  );
}

/* ---------------- Guias de Convênio ---------------- */
const MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function getBucketCliente(c){ return c.pagamento.tipo==="convenio" ? c.convenio : c.pagamento.tipo==="bolsa" ? "Bolsa" : "Particular"; }

function getDataReferenciaGuia(g){ return g.dataPagamento || g.dataEnvio || g.validade; }

function noPeriodo(dataIso, periodoTipo, mes, ano){
  if (!dataIso) return false;
  const [y,m] = dataIso.split("-").map(Number);
  if (periodoTipo === "ano") return y === ano;
  return y === ano && m === mes;
}

// mes === 0 significa "compilado" (ano todo). Usado nos painéis de desempenho de profissionais para
// permitir comparar o período selecionado com o período imediatamente anterior (mês anterior, ou ano
// anterior quando o próprio período selecionado já é o compilado do ano).
function periodoAnterior(ano, mes){
  if (!mes) return { ano: ano-1, mes: 0 };
  if (mes === 1) return { ano: ano-1, mes: 12 };
  return { ano, mes: mes-1 };
}

function valorBucketPeriodo(appointments, clients, bucket, ano, mes){
  return appointments.filter(a => {
    if (a.status !== "atendido") return false;
    const [y,m] = a.data.split("-").map(Number);
    if (y !== ano) return false;
    if (mes && m !== mes) return false;
    const c = clients.find(cl=>cl.id===a.clienteId);
    return c && getBucketCliente(c) === bucket;
  }).reduce((s,a) => { const c = clients.find(cl=>cl.id===a.clienteId); return s + (c?.valorSessao||0); }, 0);
}

// DRE gerencial simplificado para um período (mes=0 → compilado/ano todo). Função pura reutilizada tanto
// para o período selecionado quanto para montar a tabela de evolução mensal (12 meses) no Dashboard → DRE.
// Reaproveita as mesmas fórmulas já usadas em outras abas (comissão por cadastro do profissional, valor
// produzido por bucket de convênio/particular, valor de glosa real registrado na guia) para manter os
// números consistentes com o resto do sistema.
function computeDRE(ano, mes, {appointments, clients, guias, lancamentos, vendas, professionals}){
  const periodoTipo = mes ? "mes" : "ano";
  const bucketsPresentes = [...new Set(clients.map(getBucketCliente))];
  const receitaBruta = bucketsPresentes.reduce((s,b) => s + valorBucketPeriodo(appointments, clients, b, ano, mes), 0);

  const glosasPeriodo = guias.filter(g => (g.status==="glosada_parcial"||g.status==="glosada_total") && g.dataEnvio && noPeriodo(g.dataEnvio, periodoTipo, mes, ano));
  const deducoes = glosasPeriodo.reduce((s,g) => s + (g.valorGlosa||0), 0);
  const receitaLiquida = receitaBruta - deducoes;

  const mesesNoPeriodo = mes ? 1 : 12;
  const custosProfissionais = (professionals||[]).reduce((s, prof) => {
    const apptsProfPeriodo = appointments.filter(a => a.profissionalId===prof.id && a.status==="atendido" && noPeriodo(a.data, periodoTipo, mes, ano));
    const faturamentoProf = apptsProfPeriodo.reduce((ss,a) => { const c = clients.find(cl=>cl.id===a.clienteId); return ss + (c?.valorSessao||0); }, 0);
    const comissao = prof.comissaoTipo === "fixo"
      ? apptsProfPeriodo.length * (prof.comissaoValorSessao||0)
      : prof.comissaoTipo === "salario"
      ? ((prof.salarioFixoMensal||0) + (prof.bonusMensal||0)) * mesesNoPeriodo
      : faturamentoProf * (prof.comissaoPercentual||0) / 100;
    return s + comissao + (prof.custoFixoMensal||0) * mesesNoPeriodo;
  }, 0);

  const vendasPeriodo = (vendas||[]).filter(v => v.data && noPeriodo(v.data, periodoTipo, mes, ano));
  const custosComissaoVendas = vendasPeriodo.reduce((s,v) => s + (v.comissaoValor||0), 0);
  const custosTotais = custosProfissionais + custosComissaoVendas;
  const lucroBruto = receitaLiquida - custosTotais;

  // Despesas de caixa contam integralmente aqui, inclusive lançamentos gerenciais (o valor entra nos
  // totais mesmo quando a linha fica oculta/mascarada na aba Fluxo de Caixa para quem não tem permissão).
  const despesasOperacionais = lancamentos.filter(l => l.tipo==="despesa" && noPeriodo(l.data, periodoTipo, mes, ano)).reduce((s,l) => s + l.valor, 0);
  const resultadoOperacional = lucroBruto - despesasOperacionais;
  const lucroLiquido = resultadoOperacional; // protótipo não modela impostos/depreciação

  const margemBruta = receitaLiquida > 0 ? (lucroBruto / receitaLiquida * 100) : 0;
  const margemLiquida = receitaBruta > 0 ? (lucroLiquido / receitaBruta * 100) : 0;

  return { receitaBruta, deducoes, receitaLiquida, custosProfissionais, custosComissaoVendas, custosTotais, lucroBruto, despesasOperacionais, resultadoOperacional, lucroLiquido, margemBruta, margemLiquida };
}

function calcTempoMedioPagamento(guias, convenio){
  const pagas = guias.filter(g => g.convenio===convenio && g.dataEnvio && g.dataPagamento);
  if (pagas.length===0) return null;
  const totalDias = pagas.reduce((s,g) => {
    const d1 = new Date(g.dataEnvio+"T00:00:00"), d2 = new Date(g.dataPagamento+"T00:00:00");
    return s + Math.round((d2-d1)/86400000);
  }, 0);
  return totalDias / pagas.length;
}

function LeitorCodigoBarras({guias, onVincular, onRegistrarEnvio}) {
  const [codigoEnvio, setCodigoEnvio] = useState("");
  const [guiaParaVincular, setGuiaParaVincular] = useState("");
  const [codigoVincular, setCodigoVincular] = useState("");
  const [historico, setHistorico] = useState([]);
  const inputEnvioRef = useRef(null);
  const bufferRef = useRef("");

  useEffect(() => { inputEnvioRef.current?.focus(); }, []);

  function finalizarLeitura(codigoBruto){
    const codigo = codigoBruto.trim();
    if (!codigo) return;
    if (guiaParaVincular) {
      const resultado = onVincular(guiaParaVincular, codigo);
      setHistorico(h => [{ts:"agora", codigo, tipo:"vinculo", ...resultado}, ...h].slice(0,10));
      if (resultado.ok) { setGuiaParaVincular(""); setCodigoVincular(""); }
    } else {
      const resultado = onRegistrarEnvio(codigo);
      setHistorico(h => [{ts:"agora", codigo, tipo:"envio", ...resultado}, ...h].slice(0,10));
      setCodigoEnvio("");
    }
  }

  // Captura leituras mesmo quando nenhum campo está com foco (ex.: usuário clicou em outro
  // lugar da tela). Leitores de código de barras USB/Bluetooth funcionam como teclado: digitam
  // os caracteres rapidamente e terminam com Enter (ou Tab). Se um input/select nosso já está
  // focado, deixamos o comportamento normal do campo cuidar disso, sem duplicar a leitura.
  useEffect(() => {
    function handleGlobalKeydown(e){
      const ativo = document.activeElement;
      const campoProprioFocado = ativo && ["INPUT","SELECT","TEXTAREA"].includes(ativo.tagName);
      if (campoProprioFocado) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        const codigo = bufferRef.current;
        bufferRef.current = "";
        finalizarLeitura(codigo);
        return;
      }
      if (e.key.length === 1) {
        bufferRef.current += e.key;
        if (guiaParaVincular) setCodigoVincular(bufferRef.current); else setCodigoEnvio(bufferRef.current);
      }
    }
    document.addEventListener("keydown", handleGlobalKeydown);
    return () => document.removeEventListener("keydown", handleGlobalKeydown);
  }, [guiaParaVincular, onVincular, onRegistrarEnvio]);

  function handleScanEnvio(e){
    e.preventDefault();
    finalizarLeitura(codigoEnvio);
  }

  function handleVincular(e){
    e.preventDefault();
    if (!guiaParaVincular || !codigoVincular.trim()) return;
    finalizarLeitura(codigoVincular);
  }

  const guiasSemCodigo = guias.filter(g => !g.codigoBarras);

  return (
    <div className="space-y-4 max-w-2xl">
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="text-sm font-medium text-slate-700 mb-1">Registrar envio por código de barras</div>
        <p className="text-xs text-slate-400 mb-3">Na hora de enviar a guia ao convênio, basta ler o código impresso nela — a data de envio é registrada automaticamente e a guia entra em faturamento.</p>
        <form onSubmit={handleScanEnvio} className="flex gap-2">
          <input ref={inputEnvioRef} autoFocus className={inputCls} placeholder="Aguardando leitura do código de barras..." value={codigoEnvio} onChange={e=>setCodigoEnvio(e.target.value)} />
          <button type="submit" className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 whitespace-nowrap">Registrar envio</button>
        </form>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="text-sm font-medium text-slate-700 mb-1">Vincular código de barras a uma guia</div>
        <p className="text-xs text-slate-400 mb-3">Ao lançar a guia na clínica, selecione-a aqui e leia o código de barras da etiqueta para vinculá-lo — depois é só usar esse código para rastrear a guia.</p>
        <form onSubmit={handleVincular} className="flex gap-2 flex-wrap">
          <select className={inputCls + " max-w-xs"} value={guiaParaVincular} onChange={e=>setGuiaParaVincular(e.target.value)}>
            <option value="">Selecione a guia...</option>
            {guiasSemCodigo.map(g => <option key={g.id} value={g.id}>{g.numeroGuia} — {g.convenio}</option>)}
          </select>
          <input className={inputCls} placeholder="Aguardando leitura..." value={codigoVincular} onChange={e=>setCodigoVincular(e.target.value)} />
          <button type="submit" className="px-4 py-2 text-sm rounded-lg bg-teal-600 text-white hover:bg-teal-700 whitespace-nowrap">Vincular</button>
        </form>
        {guiasSemCodigo.length===0 && <p className="text-[11px] text-slate-400 mt-2">Todas as guias já têm um código vinculado.</p>}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="text-sm font-medium text-slate-700 mb-2">Últimas leituras</div>
        {historico.length===0 && <div className="text-xs text-slate-400">Nenhuma leitura ainda.</div>}
        <ul className="text-xs space-y-1">
          {historico.map((h,i) => (
            <li key={i} className={h.ok ? "text-green-600" : "text-red-600"}>
              <span className="font-mono">{h.codigo}</span> —{" "}
              {h.tipo === "vinculo"
                ? (h.ok ? "vinculado com sucesso" : h.msg)
                : (h.ok ? `envio registrado para a guia ${h.guia?.numeroGuia}` : h.jaEnviada ? `guia ${h.guia?.numeroGuia} já estava com envio registrado` : "código não vinculado a nenhuma guia")}
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

function GuiasResumo({guias, clients, appointments, procedimentosTuss, convenios}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const mesAtual = Number(TODAY.slice(5,7));
  const [periodoTipo, setPeriodoTipo] = useState("mes");
  const [mes, setMes] = useState(mesAtual);
  const [ano, setAno] = useState(anoAtual);

  // Indicadores por status (pedido explicitamente pelo usuário: "trazer indicadores com Em aberto,
  // enviadas, pagas, glosadas, tanto na quantidade quanto no valor"). Valor usa o mesmo cálculo já
  // padronizado no resto do sistema (valorGuiaPendente = preço do procedimento TUSS pelo convênio ×
  // sessões autorizadas, menos glosa) para enviadas/abertas/pagas; glosadas usa o valor de glosa
  // efetivamente registrado (guia.valorGlosa), que é o dado real de perda, não uma estimativa.
  const contagens = useMemo(() => {
    const enviadasList = guias.filter(g => g.dataEnvio && noPeriodo(g.dataEnvio, periodoTipo, mes, ano));
    const abertasList = guias.filter(g => g.status==="aberta" && noPeriodo(g.validade, periodoTipo, mes, ano));
    const pagasList = guias.filter(g => g.dataPagamento && noPeriodo(g.dataPagamento, periodoTipo, mes, ano));
    const glosadasList = guias.filter(g => (g.status==="glosada_parcial"||g.status==="glosada_total") && noPeriodo(g.dataEnvio||g.validade, periodoTipo, mes, ano));
    const canceladasList = guias.filter(g => g.status==="cancelada" && noPeriodo(g.validade, periodoTipo, mes, ano));
    const somaValor = list => list.reduce((s,g)=>s+valorGuiaPendente(g, procedimentosTuss, convenios), 0);
    return {
      enviadas: enviadasList.length, valorEnviadas: somaValor(enviadasList),
      abertas: abertasList.length, valorAbertas: somaValor(abertasList),
      pagas: pagasList.length, valorPagas: somaValor(pagasList),
      glosadas: glosadasList.length, valorGlosadas: glosadasList.reduce((s,g)=>s+(g.valorGlosa||0),0),
      canceladas: canceladasList.length,
    };
  }, [guias, periodoTipo, mes, ano, procedimentosTuss, convenios]);

  const todosPlanos = useMemo(() => {
    const buckets = [...new Set(clients.map(getBucketCliente))];
    const totalAgendaPeriodo = appointments.filter(a => {
      const [y,m] = a.data.split("-").map(Number);
      return periodoTipo==="ano" ? y===ano : (y===ano && m===mes);
    }).length;
    return buckets.map(bucket => {
      const apptsPeriodo = appointments.filter(a => {
        const [y,m] = a.data.split("-").map(Number);
        const dentro = periodoTipo==="ano" ? y===ano : (y===ano && m===mes);
        if (!dentro) return false;
        const c = clients.find(cl=>cl.id===a.clienteId);
        return c && getBucketCliente(c)===bucket;
      });
      const confirmados = apptsPeriodo.filter(a=>a.status==="atendido");
      const valorPeriodo = confirmados.reduce((s,a)=>{ const c=clients.find(cl=>cl.id===a.clienteId); return s+(c?.valorSessao||0); },0);
      const valorMes = valorBucketPeriodo(appointments, clients, bucket, ano, mes);
      const valorAno = valorBucketPeriodo(appointments, clients, bucket, ano, null);
      const percentualAgenda = totalAgendaPeriodo>0 ? (apptsPeriodo.length/totalAgendaPeriodo*100) : 0;
      const tempoPagamento = calcTempoMedioPagamento(guias, bucket);
      return { bucket, atendimentos: confirmados.length, valorPeriodo, valorMes, valorAno, percentualAgenda, tempoPagamento };
    }).sort((a,b)=>b.atendimentos-a.atendimentos);
  }, [clients, appointments, guias, periodoTipo, mes, ano]);

  const top5 = todosPlanos.slice(0,5);
  const anos = [anoAtual-1, anoAtual, anoAtual+1];

  return (
    <div>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <div className="flex gap-1 bg-slate-200/60 rounded-lg p-1">
          {[["mes","Mês"],["ano","Ano inteiro"]].map(([id,label]) => (
            <button key={id} onClick={()=>setPeriodoTipo(id)} className={"px-3 py-1.5 rounded-md text-xs font-medium " + (periodoTipo===id ? "bg-white shadow text-teal-700" : "text-slate-500")}>{label}</button>
          ))}
        </div>
        {periodoTipo==="mes" && (
          <select className={inputCls + " max-w-[160px]"} value={mes} onChange={e=>setMes(Number(e.target.value))}>
            {MESES_PT.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
          </select>
        )}
        <select className={inputCls + " max-w-[110px]"} value={ano} onChange={e=>setAno(Number(e.target.value))}>
          {anos.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
        <KpiCard label="Enviadas" value={contagens.enviadas} tone="amber" sub={fmtBRL(contagens.valorEnviadas)} />
        <KpiCard label="Em aberto" value={contagens.abertas} tone="default" sub={fmtBRL(contagens.valorAbertas)} />
        <KpiCard label="Pagas" value={contagens.pagas} tone="green" sub={fmtBRL(contagens.valorPagas)} />
        <KpiCard label="Glosadas" value={contagens.glosadas} tone="red" sub={fmtBRL(contagens.valorGlosadas)} />
        <KpiCard label="Canceladas" value={contagens.canceladas} tone="default" />
      </div>

      <div className="mb-2 text-sm font-medium text-slate-700">Top 5 planos mais atendidos {periodoTipo==="mes" ? `em ${MESES_PT[mes-1]}/${ano}` : `em ${ano}`}</div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto mb-4">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase"><tr><th className="text-left px-3 py-2">Plano</th><th className="text-right px-3 py-2">Atendimentos</th><th className="text-right px-3 py-2">Valor</th><th className="text-right px-3 py-2">% da agenda</th><th className="text-right px-3 py-2">Tempo médio de pagamento</th></tr></thead>
          <tbody>
            {top5.length===0 && <tr><td colSpan="5" className="text-center py-3 text-slate-400">Sem atendimentos no período.</td></tr>}
            {top5.map(p => (
              <tr key={p.bucket} className="border-t border-slate-100">
                <td className="px-3 py-1.5 font-medium text-slate-800">{p.bucket}</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{p.atendimentos}</td>
                <td className="px-3 py-1.5 text-right text-slate-700 font-medium">{fmtBRL(p.valorPeriodo)}</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{p.percentualAgenda.toFixed(0)}%</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{p.tempoPagamento===null ? "—" : `${p.tempoPagamento.toFixed(0)} dias`}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="mb-2 text-sm font-medium text-slate-700">Todos os planos — valor comercializado</div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase"><tr><th className="text-left px-3 py-2">Plano</th><th className="text-right px-3 py-2">{`Valor em ${MESES_PT[mes-1]}/${ano}`}</th><th className="text-right px-3 py-2">{`Valor em ${ano}`}</th></tr></thead>
          <tbody>
            {todosPlanos.map(p => (
              <tr key={p.bucket} className="border-t border-slate-100">
                <td className="px-3 py-1.5 font-medium text-slate-800">{p.bucket}</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{fmtBRL(p.valorMes)}</td>
                <td className="px-3 py-1.5 text-right text-slate-700 font-medium">{fmtBRL(p.valorAno)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Sub-aba "Por plano" (pedida explicitamente pelo usuário: "uma sub aba onde posso selecionar por plano e
// ver o valor enviado mês a mês no ano selecionado, quantos pacientes daquele plano e a porcentagem que
// aquele plano detém do faturamento total do mês"). Só lista convênios (planos de verdade) — Particular/
// Bolsa não fazem sentido aqui porque não têm guia/faturamento por convênio.
function GuiasPorPlano({guias, clients, appointments, procedimentosTuss, convenios}) {
  const anoAtual = Number(TODAY.slice(0,4));
  const [ano, setAno] = useState(anoAtual);
  const planos = useMemo(() => [...new Set(guias.map(g=>g.convenio).filter(Boolean))].sort(), [guias]);
  const [plano, setPlano] = useState("");
  useEffect(() => { if (!plano && planos.length>0) setPlano(planos[0]); }, [planos]);

  const pacientesDoPlano = useMemo(() => {
    return clients.filter(c => c.pagamento?.tipo==="convenio" && c.convenio===plano).length;
  }, [clients, plano]);

  const linhasMes = useMemo(() => {
    if (!plano) return [];
    // Faturamento total do mês = soma do valor produzido (sessões atendidas × preço) de TODOS os planos +
    // particular no mês — mesmo critério já usado em GuiasResumo/valorBucketPeriodo, para manter a %
    // consistente com o resto do sistema em vez de inventar uma nova base de cálculo.
    const bucketsPresentes = [...new Set(clients.map(getBucketCliente))];
    return MESES_PT.map((nomeMes, idx) => {
      const mes = idx + 1;
      const guiasDoMesPlano = guias.filter(g => g.convenio===plano && g.dataEnvio && noPeriodo(g.dataEnvio, "mes", mes, ano));
      const valorEnviado = guiasDoMesPlano.reduce((s,g)=>s+valorGuiaPendente(g, procedimentosTuss, convenios), 0);
      const faturamentoTotalMes = bucketsPresentes.reduce((s,b)=>s+valorBucketPeriodo(appointments, clients, b, ano, mes), 0);
      const percentual = faturamentoTotalMes>0 ? (valorEnviado/faturamentoTotalMes*100) : 0;
      return { mes: nomeMes, valorEnviado, faturamentoTotalMes, percentual, qtdGuias: guiasDoMesPlano.length };
    });
  }, [plano, ano, guias, clients, appointments, procedimentosTuss, convenios]);

  const totalAnoEnviado = linhasMes.reduce((s,l)=>s+l.valorEnviado,0);
  const anos = [anoAtual-1, anoAtual, anoAtual+1];

  return (
    <div>
      <div className="flex items-center gap-3 mb-4 flex-wrap">
        <Field label="Plano (convênio)"><select className={inputCls + " max-w-[220px]"} value={plano} onChange={e=>setPlano(e.target.value)}>
          {planos.length===0 && <option value="">Nenhum plano com guia cadastrada</option>}
          {planos.map(p => <option key={p} value={p}>{p}</option>)}
        </select></Field>
        <Field label="Ano"><select className={inputCls + " max-w-[110px]"} value={ano} onChange={e=>setAno(Number(e.target.value))}>
          {anos.map(a => <option key={a} value={a}>{a}</option>)}
        </select></Field>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
        <KpiCard label="Pacientes desse plano" value={pacientesDoPlano} tone="teal" />
        <KpiCard label={`Total enviado em ${ano}`} value={fmtBRL(totalAnoEnviado)} tone="green" />
        <KpiCard label="Guias enviadas no ano" value={linhasMes.reduce((s,l)=>s+l.qtdGuias,0)} tone="amber" />
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
            <tr><th className="text-left px-3 py-2">Mês</th><th className="text-right px-3 py-2">Guias enviadas</th><th className="text-right px-3 py-2">Valor enviado</th><th className="text-right px-3 py-2">% do faturamento total do mês</th></tr>
          </thead>
          <tbody>
            {!plano && <tr><td colSpan="4" className="text-center py-4 text-slate-400">Selecione um plano.</td></tr>}
            {plano && linhasMes.map(l => (
              <tr key={l.mes} className="border-t border-slate-100">
                <td className="px-3 py-1.5 font-medium text-slate-800">{l.mes}</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{l.qtdGuias}</td>
                <td className="px-3 py-1.5 text-right text-slate-700 font-medium">{fmtBRL(l.valorEnviado)}</td>
                <td className="px-3 py-1.5 text-right text-slate-600">{l.percentual.toFixed(1)}%</td>
              </tr>
            ))}
          </tbody>

    </div>

}

/* ---------------- TISS: prontidão, cadastros e geração de lote XML (Guia SP/SADT) ---------------- */
// Retorna o valor do procedimento para o convênio da guia: usa o preço específico negociado
// (precosPorConvenio) quando existir; caso contrário, cai no valorPadrao.
function getPrecoProcedimento(procedimento, convenioNome, convenios){
  if (!procedimento) return 0;
  const convenioObj = (convenios||[]).find(c=>c.nome===convenioNome);
  if (convenioObj && procedimento.precosPorConvenio && procedimento.precosPorConvenio[convenioObj.id] != null) {
    return procedimento.precosPorConvenio[convenioObj.id];
  }
  return procedimento.valorPadrao || 0;
}

function avaliarProntidaoTiss(guia, ctx){
  const { clients, professionals, unidades, procedimentosTuss, convenios } = ctx;
  const cliente = clients.find(c=>c.id===guia.clienteId);
  const executante = professionals.find(p=>p.id===guia.executanteId);
  const unidade = unidades.find(u=>u.id===guia.unidadePrestadoraId);
  const procedimento = procedimentosTuss.find(p=>p.id===guia.procedimentoId);
  const convenioObj = convenios.find(c=>c.nome===guia.convenio);
  const pendencias = [];
  if (!cliente?.cpf) pendencias.push("CPF do paciente");
  if (!cliente?.numeroCarteirinha) pendencias.push("Nº carteirinha do paciente");
  if (!executante?.conselho) pendencias.push("CREFITO do executante");
  if (!executante?.cbo) pendencias.push("CBO do executante");
  if (!procedimento) pendencias.push("Procedimento (código TUSS)");
  if (!unidade?.cnes) pendencias.push("CNES da unidade");
  if (!unidade?.cnpj) pendencias.push("CNPJ da unidade");
  if (!convenioObj?.registroANS) pendencias.push("Registro ANS do convênio");
  if (!guia.senha) pendencias.push("Senha da guia");
  if (!guia.dataAutorizacao) pendencias.push("Data de autorização");
  if (!guia.cid) pendencias.push("CID (diagnóstico)");
  return { guia, cliente, executante, unidade, procedimento, convenioObj, pendencias, pronta: pendencias.length===0 };
}

function escXml(v){
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

// Aceita linhas coladas (ex.: de uma planilha) separadas por tab ou ";":
// codigoTUSS;nomeProcedimento;nomeConvenio;valor  (nomeConvenio em branco = valor padrão)
function parseImportTuss(texto){
  const linhas = (texto||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return linhas
    .filter(l => !/^c[oó]digo/i.test(l) && !l.startsWith("#"))
    .map(linha => {
      const sep = linha.includes("\t") ? "\t" : ";";
      const partes = linha.split(sep).map(s=>s.trim());
      const [codigoTUSS, nomeProcedimento, nomeConvenio, valorStr] = partes;
      const valor = Number(String(valorStr||"0").replace(",", "."));
      return { codigoTUSS, nomeProcedimento, nomeConvenio: nomeConvenio||"", valor: isNaN(valor) ? 0 : valor };
    })
    .filter(r => r.codigoTUSS);
}

// Lê uma linha de CSV respeitando campos entre aspas (permite vírgula/aspas escapada dentro do campo)
function parseLinhaCSV(linha){
  const campos = [];
  let atual = "";
  let entreAspas = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (entreAspas) {
      if (ch === '"') {
        if (linha[i + 1] === '"') { atual += '"'; i++; }
        else entreAspas = false;
      } else atual += ch;
    } else {
      if (ch === '"') entreAspas = true;
      else if (ch === ",") { campos.push(atual); atual = ""; }
      else atual += ch;
    }
  }
  campos.push(atual);
  return campos.map(c => c.trim());
}

// Lê um CSV com cabeçalho nome,cpf,convenio,email,telefone (colunas em qualquer ordem)
function parseClientesCSV(csvText){
  const texto = String(csvText || "").replace(/^﻿/, ""); // remove BOM se houver
  const linhas = texto.split(/\r\n|\r|\n/).filter(l => l.trim().length > 0);
  if (linhas.length === 0) {
    return { erro: "O arquivo CSV está vazio.", registros: [] };
  }
  const cabecalho = parseLinhaCSV(linhas[0]).map(h => h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""));
  const idxNome = cabecalho.indexOf("nome");
  if (idxNome === -1) {
    return { erro: "Não foi possível ler o CSV — a primeira linha precisa ser o cabeçalho com uma coluna \"nome\", como no modelo.", registros: [] };
  }
  const idxCpf = cabecalho.indexOf("cpf");
  const idxConvenio = cabecalho.indexOf("convenio");
  const idxEmail = cabecalho.indexOf("email");
  const idxTelefone = cabecalho.indexOf("telefone");
  const registros = linhas.slice(1).map(linha => {
    const campos = parseLinhaCSV(linha);
    return {
      nome: (campos[idxNome] || "").trim(),
      cpf: idxCpf > -1 ? (campos[idxCpf] || "").trim() : "",
      convenio: idxConvenio > -1 ? (campos[idxConvenio] || "").trim() : "",
      email: idxEmail > -1 ? (campos[idxEmail] || "").trim() : "",
      telefone: idxTelefone > -1 ? (campos[idxTelefone] || "").trim() : "",
    };
  }).filter(r => r.nome);
  return { erro: null, registros };
}

function baixarArquivo(nomeArquivo, conteudo, mime){
  try {
    const blob = new Blob([conteudo], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomeArquivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } catch (e) {
    window.alert("Não foi possível baixar o arquivo automaticamente neste navegador. Use a opção de ver/copiar o texto do modelo.");
  }
}

function gerarLoteTissXML(guiasParaLote, appointments, convenios){
  const numeroLote = "LOTE" + Date.now();
  const guiasXml = guiasParaLote.map(({guia, cliente, executante, unidade, procedimento, convenioObj}) => {
    const execucoes = appointments.filter(a => a.guiaId===guia.id && a.status==="atendido");
    const valorUnitario = getPrecoProcedimento(procedimento, guia.convenio, convenios);
    const procedimentosXml = execucoes.map(exec => `
        <procedimentoExecutado>
          <dataExecucao>${escXml(exec.data)}</dataExecucao>
          <codigoTabela>22</codigoTabela>
          <codigoProcedimento>${escXml(procedimento?.codigoTUSS)}</codigoProcedimento>
          <descricaoProcedimento>${escXml(procedimento?.nome)}</descricaoProcedimento>
          <profissionalExecutante>
            <nomeProfissional>${escXml(executante?.nome)}</nomeProfissional>
            <numeroConselho>${escXml(executante?.conselho)}</numeroConselho>
            <CBO>${escXml(executante?.cbo)}</CBO>
          </profissionalExecutante>
          <valorProcedimento>${valorUnitario.toFixed(2)}</valorProcedimento>
        </procedimentoExecutado>`).join("");
    const valorTotal = execucoes.length * valorUnitario;
    return `
      <guiaSP-SADT>
        <cabecalhoGuia>
          <registroANS>${escXml(convenioObj?.registroANS)}</registroANS>
          <numeroGuiaPrestador>${escXml(guia.numeroGuia)}</numeroGuiaPrestador>
        </cabecalhoGuia>
        <dadosAutorizacao>
          <numeroGuiaOperadora>${escXml(guia.numeroGuia)}</numeroGuiaOperadora>
          <senha>${escXml(guia.senha)}</senha>
          <dataAutorizacao>${escXml(guia.dataAutorizacao)}</dataAutorizacao>
        </dadosAutorizacao>
        <dadosBeneficiario>
          <numeroCarteira>${escXml(cliente?.numeroCarteirinha)}</numeroCarteira>
          <nomeBeneficiario>${escXml(cliente?.nome)}</nomeBeneficiario>
          <cpfBeneficiario>${escXml(cliente?.cpf)}</cpfBeneficiario>
        </dadosBeneficiario>
        <dadosSolicitacao>
          <cid10>${escXml(guia.cid)}</cid10>
          <indicacaoClinica>${escXml(guia.indicacaoClinica)}</indicacaoClinica>
        </dadosSolicitacao>
        <contratadoExecutante>
          <codigoCNPJ>${escXml(unidade?.cnpj)}</codigoCNPJ>
          <codigoCNES>${escXml(unidade?.cnes)}</codigoCNES>
          <nomeContratado>${escXml(unidade?.razaoSocial)}</nomeContratado>
        </contratadoExecutante>
        <procedimentosExecutados>${procedimentosXml}
        </procedimentosExecutados>
        <valorTotalGuia>${valorTotal.toFixed(2)}</valorTotalGuia>
      </guiaSP-SADT>`;
  }).join("");

  return `<?xml version="1.0" encoding="ISO-8859-1"?>
<!-- Gerado pelo PhysioFlow (protótipo). Estrutura simplificada baseada na Guia SP/SADT do padrão TISS.
     Valide contra o XSD oficial do Componente de Conteúdo e Estrutura da ANS antes de enviar à produção.
     Máximo de 100 guias por lote, conforme regra do Componente Organizacional. -->
<mensagemTISS xmlns="http://www.ans.gov.br/padroes/tiss/schemas">
  <cabecalho>
    <identificacaoTransacao>
      <tipoTransacao>ENVIO_LOTE_GUIAS</tipoTransacao>
      <sequencialTransacao>1</sequencialTransacao>
      <dataRegistroTransacao>${TODAY}</dataRegistroTransacao>
    </identificacaoTransacao>
    <versaoPadrao>4.01.00</versaoPadrao>
  </cabecalho>
  <prestadorParaOperadora>
    <loteGuias>
      <numeroLote>${numeroLote}</numeroLote>
      <guiasTISS>${guiasXml}
      </guiasTISS>
    </loteGuias>
  </prestadorParaOperadora>
</mensagemTISS>`;
}

/* ---------------- Fluxo de Caixa ---------------- */
function calcCaixaDia(lancamentos, data){
  const doDia = lancamentos.filter(l => l.data === data);
  const porForma = {};
  Object.keys(FORMAS_PAGAMENTO).forEach(k => porForma[k] = 0);
  const porOrigem = {};
  Object.keys(ORIGENS_PAGAMENTO).forEach(k => porOrigem[k] = 0);
  let totalReceitas = 0, totalDespesas = 0, totalSangrias = 0, totalReforcos = 0;
  doDia.forEach(l => {
    if (l.tipo === "receita") {
      totalReceitas += l.valor;
      porForma[l.formaPagamento] = (porForma[l.formaPagamento]||0) + l.valor;
      const origem = l.origemPagamento || "particular";
      porOrigem[origem] = (porOrigem[origem]||0) + l.valor;
    }
    if (l.tipo === "despesa") { totalDespesas += l.valor; }
    if (l.tipo === "sangria") { totalSangrias += l.valor; }
    if (l.tipo === "reforco") { totalReforcos += l.valor; }
  });
  const despesasDinheiro = doDia.filter(l=>l.tipo==="despesa" && l.formaPagamento==="dinheiro").reduce((s,l)=>s+l.valor,0);
  const valorSistemaDinheiro = (porForma.dinheiro||0) + totalReforcos - despesasDinheiro - totalSangrias;
  const resultadoDia = totalReceitas - totalDespesas;
  return { doDia, porForma, porOrigem, totalReceitas, totalDespesas, totalSangrias, totalReforcos, valorSistemaDinheiro, resultadoDia };
}
